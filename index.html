  document.body.appendChild(a); a.click(); a.remove();
}
function openWhatsApp(phone, text) {
  const p = waPhone(phone);
  openExternal(`https://wa.me/${p}?text=${encodeURIComponent(text)}`);
}
function statementMessage(c) {
  const s = S.settings;
  const rows = withRunning(customerEntries(c.id)).filter((r) => !r.e.void).slice(-8);
  const lines = rows.map(({ e }) => {
    const d = new Date(e.ts).toLocaleDateString('tr-TR', { day: '2-digit', month: '2-digit' });

    return `${d}  ${what}  ${e.amt < 0 ? '−' : ''}${money(Math.abs(e.amt))}`;
  });
  return [
    `Merhaba ${c.name},`,
    `${s.bizName || 'Büfemiz'} veresiye hesabınızın ${fmtDate(Date.now())} tarihli özeti:`,
    '',
    ...(lines.length ? ['Son hareketler:', ...lines, ''] : []),
    c.bal > 0.004 ? `Güncel borcunuz: ${money(c.bal)}` : c.bal < -0.004 ? `${money(-c.bal)} alacağınız bulunuyor.` : 'Hesabınızda borç bulunmuyor. Teşekkür ederiz.',
    '',
    `İyi günler dileriz.`,
    `${s.bizName || ''}${s.phone ? ' ' + fmtPhone(s.phone) : ''}`.trim()
  ].join('\n');
}
function paidMessage(c, amount) {

  return [`Merhaba ${c.name},`, `${money(amount)} ödemeniz alınmıştır. Teşekkür ederiz.`, c.bal > 0.004 ? `Kalan borcunuz: ${money(c.bal)}` : 'Hesabınızda borç kalmadı.', '', `${s.bizName || ''}`].join('\n');

/* ---- 68-breakdown.js ---- */
/* ============================================================
   Satış dökümü: kategoriye / markaya göre kırılım ve öne çıkan
   kategori bandı (varsayılan: sigara). Kasa, Raporlar ve Özet
   ekranları ile gün sonu çıktısı aynı parçaları kullanır.
   ============================================================ */
const BDS = {};
function bdState(id) {
  return BDS[id] || (BDS[id] = { by: 'cat', open: new Set(), init: false, keys: [] });
}

/* Kategoride en çok kullanılan birim (satış yokken "0 paket" yazabilmek için) */
function catUnit(cat) {
  const cnt = {};
  for (const p of S.products.values()) if (p.cat === cat) { const u = p.unit || 'adet'; cnt[u] = (cnt[u] || 0) + 1; }
  const top = Object.entries(cnt).sort((a, b) => b[1] - a[1])[0];
  return top ? top[0] : 'adet';
}
/* "37 paket" ya da satış yoksa "0 paket" */
function focusQtyText(f) {
  const t = unitsText(f.units);
  return t === '0' ? `0 ${catUnit(f.cat)}` : t;
}
function mergeUnits(into, add) {
  for (const [u, q] of Object.entries(add || {})) into[u] = r3((into[u] || 0) + q);
  return into;
}
/* Tek günün öne çıkan kategori toplamı (gün gün döküm tabloları için).
   Raporlarla aynı kural: ürünün güncel kategorisi, silinmişse satış anındaki. */
function dayFocus(d, cat) {
  const units = {};
  let t = 0;
  if (!d || !cat) return { units, t };
  for (const [key, a] of Object.entries(d.p)) {
    const p = key.startsWith('~') ? null : S.products.get(key);
    const k = p ? (p.cat || 'Diğer') : (a[4] || 'Diğer');
    if (k !== cat) continue;
    const u = p ? (p.unit || 'adet') : (a[5] || 'adet');
    units[u] = r3((units[u] || 0) + a[0]);
    t += a[1];
  }
  return { units, t: r2(t) };
}
/* Öne çıkan kategorinin markalara göre dağılımı; marka girilmemişse ürünlere göre */
function focusParts(A, cat) {
  const items = [...A.p.values()].filter((x) => x.k === cat && (Math.abs(x.q) > 1e-9 || Math.abs(x.t) > 0.005));
  const byB = new Map();
  for (const x of items) {
    const o = byB.get(x.b || '') || { name: brandLabel(x.b), units: {}, t: 0 };
    o.units[x.u] = r3((o.units[x.u] || 0) + x.q);
    o.t = r2(o.t + x.t);
    byB.set(x.b || '', o);
  }
  if (byB.size > 1 || (byB.size === 1 && !byB.has(''))) return [...byB.values()].sort((a, b) => b.t - a.t);
  return items.map((x) => ({ name: x.n, units: { [x.u]: x.q }, t: x.t })).sort((a, b) => b.t - a.t);
}
/* Büyük rakamlı miktar: 37 paket + 2 karton */
function unitsBig(f) {
  const parts = Object.entries(f.units || {}).filter(([, q]) => Math.abs(q) > 1e-9).sort((a, b) => b[1] - a[1]);
  if (!parts.length) parts.push([catUnit(f.cat), 0]);
  return parts.map(([u, q]) => `<b>${qtyFmt(q)}</b><small>${esc(u)}</small>`).join('<i>+</i>');
}

/* Öne çıkan kategori bandı: "Sigara · 37 paket · 3.700 ₺ · satışların %42'si" (veresiye dahil) */
function focusBand(A, { sub = 'Bugün satılan', cmp = '' } = {}) {
  const f = focusSummary(A);
  if (!f) return '';
  const parts = focusParts(A, f.cat);
  const shown = parts.slice(0, 5);
  const share = A.t > 0 ? f.t / A.t : 0;
  return `<section class="focus-band" aria-label="${esc(f.cat)}: ${esc(focusQtyText(f))}, ${esc(money(f.t))}">
    <div class="fb-k"><span class="fb-ic">${ic('target')}</span><div><b>${esc(f.cat)}</b><small>${esc(sub)}</small></div></div>
    <div class="fb-q"><div class="fb-n">${unitsBig(f)}</div>${cmp ? `<div class="fb-cmp">${esc(cmp)}</div>` : ''}</div>
    <div class="fb-t"><span>Tutar</span><b>${money(f.t)}</b></div>
    <div class="fb-t"><span>Satıştaki payı</span><b>${pct(share)}</b></div>
    <div class="fb-b">${shown.length
      ? shown.map((x) => `<span title="${esc(x.name)}: ${esc(unitsText(x.units))}, ${esc(money(x.t))}">${esc(x.name)}<em>${esc(unitsText(x.units))}</em></span>`).join('') + (parts.length > shown.length ? `<span class="more">+${parts.length - shown.length}</span>` : '')
      : '<span class="none">Henüz satış yok</span>'}</div>
  </section>`;
}

/* Kategori / marka dökümü: açılır satırlarda ürün ürün miktar ve tutar */
function breakdownPanel(A, id, { title = 'Satış dökümü', sub = '', profit = true, empty = 'Bu dönemde satış yok' } = {}) {
  const st = bdState(id);
  const fc = focusCat();
  if (!st.init) { if (fc) st.open.add('cat|' + fc); st.init = true; }
  const by = st.by;
  const groups = breakdown(A, by);
  st.keys = groups.map((g) => by + '|' + g.key);
  const tot = r2(sum(groups, (g) => g.t)), totC = r2(sum(groups, (g) => g.c));
  const allOpen = groups.length > 0 && st.keys.every((k) => st.open.has(k));
  const noCost = (x) => x.t > 0.004 && !(x.c > 0);
  const head = `<div class="panel-head"><h3>${esc(title)}</h3>${sub ? `<span class="sub">${esc(sub)}</span>` : ''}
    <div class="end">${groups.length ? `<button class="btn ghost sm" data-bd-all>${allOpen ? 'Tümünü kapat' : 'Tümünü aç'}</button>` : ''}
      <div class="seg sm" role="group" aria-label="Döküm türü"><button data-by="cat" class="${by === 'cat' ? 'on' : ''}">Kategori</button><button data-by="brand" class="${by === 'brand' ? 'on' : ''}">Marka</button></div></div></div>`;
  if (!groups.length) return `<div class="panel flush bd" data-bd="${id}">${head}<div class="empty" style="padding:26px">${ic('chart')}<p>${esc(empty)}</p></div></div>`;
  const body = groups.map((g, i) => {
    const open = st.open.has(st.keys[i]);
    const isF = by === 'cat' && !!fc && g.key === fc;
    const share = tot > 0 ? Math.max(0, g.t) / tot : 0;
    const gNo = g.items.some(noCost);
    return `<tr class="grp${open ? ' open' : ''}${isF ? ' focus' : ''}" data-g="${i}" tabindex="0" aria-expanded="${open}">
        <td><span class="chev">${ic('right', 'sm')}</span><span class="nm">${esc(by === 'brand' ? brandLabel(g.key) : g.key)}</span><span class="cnt">${plural(g.items.length, 'ürün')}</span></td>
        <td class="r">${esc(unitsText(g.units))}</td>
        <td class="r strong">${money(g.t)}</td>
        ${profit ? `<td class="r ${g.t - g.c < 0 ? 'red' : ''}">${money(g.t - g.c)}${gNo ? '<span class="amber" title="Bazı ürünlerde alış fiyatı girilmemiş; kâr olduğundan yüksek görünür"> *</span>' : ''}</td>` : ''}
        <td class="r"><span class="share" aria-hidden="true"><i style="width:${(share * 100).toFixed(1)}%"></i></span>${pct(share)}</td></tr>`
      + g.items.map((x) => `<tr class="it" data-of="${i}"${open ? '' : ' hidden'}>
        <td><span class="nm">${esc(x.n)}</span><span class="cnt">${esc(by === 'brand' ? x.k : brandLabel(x.b))}</span></td>
        <td class="r">${qtyFmt(x.q)} ${esc(x.u)}</td>
        <td class="r">${money(x.t)}</td>
        ${profit ? `<td class="r ${x.c > 0 && x.t - x.c < 0 ? 'red' : ''}">${noCost(x) ? '<span class="amber" title="Alış fiyatı girilmemiş">?</span>' : money(x.t - x.c)}</td>` : ''}
        <td></td></tr>`).join('');
  }).join('');
  return `<div class="panel flush bd" data-bd="${id}">${head}
    <div class="tbl-wrap"><table class="tbl bd-tbl"><thead><tr><th>${by === 'brand' ? 'Marka' : 'Kategori'}</th><th class="r">Miktar</th><th class="r">Tutar</th>${profit ? '<th class="r">Kâr</th>' : ''}<th class="r share-h">Pay</th></tr></thead>
    <tbody>${body}</tbody>
    <tfoot><tr><td>Toplam satış <span class="muted" style="font-weight:500">(veresiye dahil)</span></td><td></td><td class="r">${money(tot)}</td>${profit ? `<td class="r">${money(tot - totC)}</td>` : ''}<td class="r">${tot > 0 ? '%100' : ''}</td></tr></tfoot></table></div></div>`;
}
function mountBreakdown(host, A, id, opts = {}) {
  if (!host) return;
  host.innerHTML = breakdownPanel(A, id, opts);
  const st = bdState(id);
  const pn = host.firstElementChild;
  const syncAll = () => { const b = pn.querySelector('[data-bd-all]'); if (b) b.textContent = st.keys.every((k) => st.open.has(k)) ? 'Tümünü kapat' : 'Tümünü aç'; };
  const toggle = (row) => {
    const i = +row.dataset.g, k = st.keys[i];
    const open = !st.open.has(k);
    if (open) st.open.add(k); else st.open.delete(k);
    row.classList.toggle('open', open);
    row.setAttribute('aria-expanded', String(open));
    pn.querySelectorAll(`tr.it[data-of="${i}"]`).forEach((r) => { r.hidden = !open; });
    syncAll();
  };
  pn.addEventListener('click', (e) => {
    const b = e.target.closest('[data-by]');
    if (b) {
      if (st.by !== b.dataset.by) { st.by = b.dataset.by; mountBreakdown(host, A, id, opts); const nb = host.querySelector(`[data-by="${st.by}"]`); if (nb) nb.focus(); }
      return;
    }
    if (e.target.closest('[data-bd-all]')) {
      const all = st.keys.every((k) => st.open.has(k));
      st.keys.forEach((k) => { if (all) st.open.delete(k); else st.open.add(k); });
      mountBreakdown(host, A, id, opts);
      const nb = host.querySelector('[data-bd-all]'); if (nb) nb.focus();
      return;
    }
    const g = e.target.closest('tr.grp');
    if (g) toggle(g);
  });
  pn.addEventListener('keydown', (e) => {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('tr.grp')) { e.preventDefault(); toggle(e.target); }
  });
}

/* ---------- Yazdırma parçaları ---------- */
function docFocusBox(A, label) {
  const f = focusSummary(A);
  if (!f) return '';
  const share = A.t > 0 ? f.t / A.t : 0;
  const parts = focusParts(A, f.cat);
  return `<div class="doc-focus">
      <div><small>${esc(f.cat)}, ${esc(label)}</small><strong>${esc(focusQtyText(f))}</strong></div>

    </div>
    ${parts.length ? `<p class="doc-focus-sub">${parts.slice(0, 10).map((x) => `${esc(x.name)} <b>${esc(unitsText(x.units))}</b>`).join(' · ')}${parts.length > 10 ? ` · +${parts.length - 10}` : ''}</p>` : ''}`;
}
function docGroupTable(A, by = 'cat', { title = '', profit = true } = {}) {
  const groups = breakdown(A, by);
  if (!groups.length) return '';
  const fc = focusCat();
  const tot = r2(sum(groups, (g) => g.t)), totC = r2(sum(groups, (g) => g.c));
  return `<h3>${esc(title || (by === 'brand' ? 'Markalara göre satış' : 'Kategorilere göre satış'))}</h3>
    <table><thead><tr><th>${by === 'brand' ? 'Marka' : 'Kategori'}</th><th class="r">Miktar</th><th class="r">Tutar</th>${profit ? '<th class="r">Brüt kâr</th>' : ''}<th class="r">Pay</th></tr></thead><tbody>
    ${groups.map((g) => `<tr${by === 'cat' && g.key === fc ? ' class="hl"' : ''}><td>${esc(by === 'brand' ? brandLabel(g.key) : g.key)}</td><td class="r">${esc(unitsText(g.units))}</td><td class="r">${money(g.t)}</td>${profit ? `<td class="r">${money(g.t - g.c)}</td>` : ''}<td class="r">${tot > 0 ? pct(g.t / tot) : ''}</td></tr>`).join('')}
    </tbody><tfoot><tr><td>Toplam satış (veresiye dahil)</td><td></td><td class="r">${money(tot)}</td>${profit ? `<td class="r">${money(tot - totC)}</td>` : ''}<td class="r">${tot > 0 ? '%100' : ''}</td></tr></tfoot></table>`;
}
/* Bütün ürünler, kategori başlıkları altında (öne çıkan kategori en üstte) */
function docGroupedItems(A, { title = 'Ürün ürün satışlar' } = {}) {
  const groups = breakdown(A, 'cat');
  if (!groups.length) return '';
  return `<h3>${esc(title)}</h3><table class="grouped"><thead><tr><th>Ürün</th><th>Marka</th><th class="r">Miktar</th><th class="r">Tutar</th></tr></thead>
    ${groups.map((g) => `<tbody><tr class="grp-h"><td colspan="2">${esc(g.key)}</td><td class="r">${esc(unitsText(g.units))}</td><td class="r">${money(g.t)}</td></tr>
      ${g.items.map((x) => `<tr><td>${esc(x.n)}</td><td>${esc(x.b || '')}</td><td class="r">${qtyFmt(x.q)} ${esc(x.u)}</td><td class="r">${money(x.t)}</td></tr>`).join('')}</tbody>`).join('')}
  </table>`;
}

      <div class="field"><label for="cd-n">Not</label><input class="inp" id="cd-n" value="${cl ? esc(cl.note || '') : ''}" placeholder="İsteğe bağlı"></div></div>`,
    foot: `<button class="btn" data-close>Vazgeç</button><button class="btn primary" data-enter id="cd-ok">${ic('check')} Günü kapat</button>`,
    onMount(el, m) {

        const df = r2(v - cs.expected);
        box.className = 'change-box mt' + (df < -0.009 ? ' short' : '');
        box.querySelector('.k').textContent = Math.abs(df) < 0.01 ? 'Kasa tam' : df < 0 ? 'Kasa eksik' : 'Kasa fazla';
        box.querySelector('.v').textContent = Math.abs(df) < 0.01 ? money(0) : money(Math.abs(df));
      };
      c.addEventListener('input', upd); upd();
      $('#cd-ok', el).onclick = () => {
        const v = parseNum(c.value);
        if (isNaN(v) || v < 0) { c.classList.add('err'); c.focus(); return; }

      };
    }
  });
}

function printDayReport(dk) {

      <div><h3>Kasa</h3><table><tbody>${tr('Gün başı nakit', money(cs.opening))}${tr('Nakit satışlar', plusM(cs.cashSales))}${tr('Nakit tahsilat', plusM(cs.colCash))}${tr('Nakit giderler', minusM(cs.expCash))}${tr('Toptancıya nakit ödeme', minusM(cs.supCash))}${cs.purCash ? tr('Peşin mal alımı', minusM(cs.purCash)) : ''}</tbody><tfoot><tr><td>Olması gereken</td><td class="r">${money(cs.expected)}</td></tr>${cl ? `<tr><td>Sayılan</td><td class="r">${money(cl.counted)}</td></tr><tr><td>Fark</td><td class="r">${signed(cl.diff)}</td></tr><tr><td>Ertesi güne bırakılan</td><td class="r">${money(cl.carry)}</td></tr>` : ''}</tfoot></table></div>

    <div class="doc-sign"><div>Kasayı teslim eden</div><div>Kasayı teslim alan</div></div></div>`);
}

/* ---- 80-reports.js ---- */
/* ============================================================
   Raporlar: ciro (nakit + kart), veresiye, kâr, giderler, fire, ödeme türleri, saatler, ürünler
   ============================================================ */
const RS = { preset: 'month', from: '', to: '', prodSort: 't', showDays: false };
const PRESETS = [['today', 'Bugün'], ['yesterday', 'Dün'], ['week', 'Bu hafta'], ['month', 'Bu ay'], ['prev', 'Geçen ay'], ['30', 'Son 30 gün'], ['year', 'Bu yıl'], ['custom', 'Tarih seç']];
function presetRange(p) {
  const t = todayKey(); const d = fromKey(t);
  switch (p) {
    case 'today': return [t, t];
    case 'yesterday': { const y = addDays(t, -1); return [y, y]; }
    case 'week': { const wd = (d.getDay() + 6) % 7; return [addDays(t, -wd), t]; }
    case 'month': return periodRange('month');
    case 'prev': return periodRange('prev');
    case '30': return periodRange('30');
    case 'year': return [`${d.getFullYear()}-01-01`, t];
    case 'custom': return [RS.from || addDays(t, -6), RS.to || t];
    default: return periodRange('month');
  }
}
function rangeLabel(a, b) {
  if (a === b) return fmtDay(a);
  return `${fmtDateL(fromKey(a))} – ${fmtDateL(fromKey(b))}`;
}
function monthBuckets(series) {
  const m = new Map();
  for (const s of series) {
    const k = s.id.slice(0, 7);
    const x = m.get(k) || { id: k, n: 0, t: 0, c: 0, pay: { nakit: 0, kart: 0, veresiye: 0 }, fu: {}, ft: 0 };
    x.n += s.n; x.t += s.t; x.c += s.c;
    mergeUnits(x.fu, s.fu); x.ft = r2(x.ft + (s.ft || 0));
    for (const p of Object.keys(x.pay)) x.pay[p] += (s.pay && s.pay[p]) || 0;
    m.set(k, x);
  }
  return [...m.values()];
}
const MONTHS = ['Oca', 'Şub', 'Mar', 'Nis', 'May', 'Haz', 'Tem', 'Ağu', 'Eyl', 'Eki', 'Kas', 'Ara'];
const MONTHS_L = ['Ocak', 'Şubat', 'Mart', 'Nisan', 'Mayıs', 'Haziran', 'Temmuz', 'Ağustos', 'Eylül', 'Ekim', 'Kasım', 'Aralık'];

function reportData() {
  const [from, to] = presetRange(RS.preset);
  const A = aggregate(from, to);
  const fc = focusCat();
  for (const s of A.series) { const f = dayFocus(S.days.get(s.id), fc); s.fu = f.units; s.ft = f.t; }
  const len = daysBetween(from, to) + 1;
  const pTo = addDays(from, -1), pFrom = addDays(from, -len);
  const P = aggregate(pFrom, pTo);
  const monthly = len > 62;
  const buckets = monthly ? monthBuckets(A.series) : A.series;
  return { from, to, A, P, len, monthly, buckets, fc };
}
function presetWhen() {
  const p = PRESETS.find(([k]) => k === RS.preset);
  if (RS.preset === 'custom' || !p) return 'Seçilen dönemde satılan';
  if (RS.preset === '30') return 'Son 30 günde satılan';
  return `${p[1]} satılan`;
}
/* Gün gün / ay ay döküm satırının etiketi */
function bucketLabel(b, monthly, withWeekday = false) {
  if (monthly) return `${MONTHS_L[+b.id.slice(5, 7) - 1]} ${b.id.slice(0, 4)}`;
  return fmtDate(fromKey(b.id)) + (withWeekday ? ' <span class="muted">' + fromKey(b.id).toLocaleDateString('tr-TR', { weekday: 'short' }) + '</span>' : '');
}

};

/* Öne çıkan kategori tek birimle satılıyorsa Excel'de sayı, karışıksa metin yazılır */
function focusCell(units, single) {
  if (single) return r3((units || {})[single] || 0);
  return unitsText(units);
}
function exportReportXlsx() {
  const { from, to, A, monthly, buckets, fc } = reportData();
  const fs = focusSummary(A);
  const fUnits = fs ? Object.keys(fs.units).filter((u) => Math.abs(fs.units[u]) > 1e-9) : [];
  const single = fs ? (fUnits.length <= 1 ? (fUnits[0] || catUnit(fs.cat)) : null) : null;

function greeting() {
  const h = new Date().getHours();
  if (h >= 5 && h < 12) return 'Günaydın';
  if (h >= 12 && h < 18) return 'İyi günler';
  if (h >= 18 && h < 23) return 'İyi akşamlar';
  return 'İyi geceler';
}
/* Dün aynı saate kadarki ciro (nakit + kart; veresiye hariç) */
function sameTimeYesterday() {
  const yk = addDays(todayKey(), -1);
  const y = S.days.get(yk);
  if (!y) return null;
  const lim = new Date(); lim.setDate(lim.getDate() - 1);
  const limTs = lim.getTime();
  let v = 0;
  for (const s of S.sales) if (!s.void && s.day === yk && s.ts <= limTs) v += s.total - saleCredit(s);
  return { part: r2(v), full: ciroOf(y) };
}

      days.push({ label: i === 0 ? 'Bugün' : fromKey(k).toLocaleDateString('tr-TR', { day: 'numeric', month: 'short' }), title: fmtDay(k), hl: i === 0, vals: [ciroOf(x)], extra: [['Satış', NF0.format(x ? x.n : 0)], ['Veresiye', money(x ? x.pay.veresiye || 0 : 0)], ['Brüt kâr', money(x ? x.t - x.c : 0)]] });
    }
    columnChart($('#db-ch', el), { height: 190, series: [{ name: 'Ciro', color: 'var(--c-kar)' }], data: days, ariaLabel: 'Son 14 günün cirosu', emptyText: 'Satış yaptıkça son 14 günün cirosu burada görünür.' });
    el.addEventListener('click', async (e) => {
      const ob = e.target.closest('[data-ob]');
      if (ob) {
        const k = ob.dataset.ob;
        if (k === 'hide') { S.settings.onboardHidden = true; saveSettings(); rerender(); }
        if (k === 'prod-new') openProductForm({});
        if (k === 'prod-import') importProductsModal();
        if (k === 'backup-dir') { if (await Backup.chooseDir()) rerender(); }
        if (k === 'cust-new') openCustomerForm({});
        if (k === 'pin') pinSetupModal();
        if (k === 'pos') go('satis');
        return;
      }
      const tp = e.target.closest('[data-top]');
      if (tp) { DS.top = tp.dataset.top; rerender(); return; }
      const g = e.target.closest('[data-go]');
      if (g) {
        const k = g.dataset.go;
        if (k === 'kasa') { KS.day = todayKey(); go('kasa'); }
        if (k === 'skt') { PS.f = 'skt'; go('urunler'); }
        if (k === 'stock') { PS.f = 'low'; go('urunler'); }
        if (k === 'over') { VS.f = 'over'; go('veresiye'); }
        if (k === 'late') { VS.f = 'late'; go('veresiye'); }
        if (k === 'close') { KS.day = addDays(todayKey(), -1); go('kasa'); setTimeout(() => closeDayModal(KS.day), 60); }
        if (k === 'perm') { const p = await Backup.permission(true); if (p === 'granted') await Backup.writeNow('manual'); rerender(); }
        if (k === 'backup') { SS.tab = 'yedek'; go('ayarlar'); }
        if (k === 'backupnow') { await Backup.writeNow('manual'); rerender(); }
        return;
      }
      const sl = e.target.closest('[data-sale]'); if (sl) { saleDetailModal(sl.dataset.sale); return; }
      const cu = e.target.closest('[data-cust]'); if (cu) { go('veresiye/' + cu.dataset.cust); return; }
      const a = e.target.closest('[data-a]'); if (!a) return;
      if (a.dataset.a === 'pay') customerPicker('Tahsilat al', (c) => payModal(c.id));
      if (a.dataset.a === 'hist') salesHistoryModal();
    });
  }
};

const uniq = (arr) => [...new Set(arr.filter(Boolean))];
async function renameListItem(key, oldV) {
  const v = await askBox({ title: 'Adını değiştir', label: 'Yeni ad', value: oldV, ok: 'Kaydet', validate: (x) => titleTR(x) ? '' : 'Ad yazın.' });
  if (v === null) return;
  const nv = capFirst(v);
  if (nv === oldV) return;
  const pool = key === 'brands' ? brandList() : S.settings[key];
  const clash = pool.find((x) => x !== oldV && fold(x) === fold(nv));
  if (clash && !(await confirmBox({ title: `"${clash}" zaten var`, message: `"${esc(oldV)}" ile "${esc(clash)}" birleştirilsin mi? "${esc(oldV)}" altındaki her şey "${esc(clash)}" altına taşınır.`, ok: 'Birleştir' }))) return;
  const target = clash || nv;
  const ops = [];
  if (key === 'categories') {
    // Öne çıkan kategori (elle ya da otomatik seçilmiş olsun) yeni adıyla devam eder
    const wasFocus = focusCat() === oldV;
    S.settings.categories = uniq(S.settings.categories.map((x) => (x === oldV ? target : x)));
    if (wasFocus) S.settings.focusCat = target;
    productList(true).filter((p) => p.cat === oldV).forEach((p) => { p.cat = target; ops.push(putOp('products', p)); });
  } else if (key === 'brands') {
    S.settings.brands = uniq([...(S.settings.brands || []).map((x) => (x === oldV ? target : x)), target]);
    productList(true).filter((p) => p.brand === oldV).forEach((p) => { p.brand = target; ops.push(putOp('products', p)); });
  } else if (key === 'expenseCats') {
    S.settings.expenseCats = uniq(S.settings.expenseCats.map((x) => (x === oldV ? target : x)));
    S.expenses.filter((x) => x.cat === oldV).forEach((x) => { x.cat = target; ops.push(putOp('expenses', x)); });
  }
  ops.push(putOp('meta', S.settings));
  persist(ops); emit('data');
  toast(clash ? `"${oldV}", "${target}" ile birleştirildi` : `"${oldV}" adı "${target}" olarak değiştirildi`);
}
async function deleteListItem(key, v) {
  const ops = [];
  if (key === 'categories') {
    const others = S.settings.categories.filter((x) => x !== v);
    if (!others.length) { toast('En az bir kategori kalmalı', { type: 'warn' }); return; }
    const prods = productList(true).filter((p) => p.cat === v);
    let target = null;
    if (prods.length) {
      target = await new Promise((res) => openModal({
        title: `"${v}" silinsin mi?`, size: 'sm',
        body: `<p class="ink2">Bu kategoride ${plural(prods.length, 'ürün')} var. Ürünler hangi kategoriye taşınsın?</p><select class="inp mt" id="dl-t">${others.map((c) => `<option>${esc(c)}</option>`).join('')}</select>`,
        foot: `<button class="btn" data-close>Vazgeç</button><button class="btn danger solid" data-enter id="dl-ok">Sil ve taşı</button>`,
        onMount(el, m) { $('#dl-ok', el).onclick = () => { res($('#dl-t', el).value); m.close(true); }; },
        onClose() { res(null); }
      }));
      if (!target) return;
    } else if (!(await confirmBox({ title: `"${v}" silinsin mi?`, message: 'Bu kategoride ürün yok.', ok: 'Sil', danger: true }))) return;
    prods.forEach((p) => { p.cat = target; ops.push(putOp('products', p)); });
    S.settings.categories = others;
    if (S.settings.focusCat === v) S.settings.focusCat = '';
  } else if (key === 'brands') {
    const prods = productList(true).filter((p) => p.brand === v);
    if (!(await confirmBox({ title: `"${v}" markası silinsin mi?`, message: prods.length ? `${plural(prods.length, 'ürün')} "${NO_BRAND}" olarak kalacak; ürünler silinmez.` : 'Bu markada ürün yok.', ok: 'Sil', danger: true }))) return;
    prods.forEach((p) => { p.brand = ''; ops.push(putOp('products', p)); });
    S.settings.brands = (S.settings.brands || []).filter((x) => x !== v);
  } else if (key === 'expenseCats') {
    if (S.settings.expenseCats.length <= 1) { toast('En az bir gider türü kalmalı', { type: 'warn' }); return; }
    if (!(await confirmBox({ title: `"${v}" silinsin mi?`, message: 'Geçmiş gider kayıtları bu adla kalır.', ok: 'Sil', danger: true }))) return;
    S.settings.expenseCats = S.settings.expenseCats.filter((x) => x !== v);
  }
  ops.push(putOp('meta', S.settings));
  persist(ops); emit('data');
  toast(`"${v}" silindi`);
}
function addListItem(key, raw) {
  const v = capFirst(raw);
  if (!v) return false;
  const pool = key === 'brands' ? brandList() : S.settings[key];
  if (pool.some((c) => fold(c) === fold(v))) { toast('Bu isim zaten var', { type: 'warn' }); return false; }
  if (key === 'brands') S.settings.brands = [...(S.settings.brands || []), v];
  else S.settings[key].push(v);
  saveSettings(); emit('data'); toast(`"${v}" eklendi`);
  return true;
}

    if (!w) return arr[Math.floor(this.r() * arr.length)];
    const tot = w.reduce((a, b) => a + b, 0);
    let x = this.r() * tot;
    for (let i = 0; i < arr.length; i++) { x -= w[i]; if (x <= 0) return arr[i]; }

    const base = '869' + String(4100000 + seq * 7919).padStart(9, '0').slice(-9);

const XLSX = {
  _crc: null,
  crc32(buf) {

    const dosDate = ((now.getFullYear() - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate();
    for (const f of files) {
      const nameB = enc.encode(f.name);

      cv.setUint16(12, dosTime, true); cv.setUint16(14, dosDate, true); cv.setUint32(16, crc, true);
      cv.setUint32(20, data.length, true); cv.setUint32(24, data.length, true); cv.setUint16(28, nameB.length, true);
      cv.setUint16(30, 0, true); cv.setUint16(32, 0, true); cv.setUint16(34, 0, true); cv.setUint16(36, 0, true); cv.setUint32(38, 0, true); cv.setUint32(42, offset, true);

    ev.setUint16(8, files.length, true); ev.setUint16(10, files.length, true);

  sheetXml({ rows, money = [], text = [], widths = [], noHeader = false }) {

          const st = fs === 'int' ? 0 : fs === 'money' ? 2 : fs === 'pct' ? 3 : money.includes(ci) ? 2 : 0;
          x += `<c r="${ref}"${st ? ` s="${st}"` : ''}><v>${v}</v></c>`;
        } else {
          x += `<c r="${ref}" t="inlineStr"${head || (noHeader && ci === 0) ? ' s="1"' : ''}><is><t xml:space="preserve">${this.xmlEsc(v)}</t></is></c>`;
        }
      });
      x += '</row>';
    });
    return x + '</sheetData></worksheet>';
  },
  build(sheets) {
    const enc = new TextEncoder();
    const used = new Set();
    const names = sheets.map((s, i) => {
      let n = String(s.name || `Sayfa${i + 1}`).replace(/[\[\]:*?/\\]/g, ' ').slice(0, 31).trim() || `Sayfa${i + 1}`;
      let k = n, j = 2;
      while (used.has(k.toLowerCase())) k = n.slice(0, 28) + ' ' + (j++);
      used.add(k.toLowerCase());
      return k;
    });
    const ct = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>${sheets.map((_, i) => `<Override PartName="/xl/worksheets/sheet${i + 1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')}</Types>`;
    const rels = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`;
    const wb = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><bookViews><workbookView/></bookViews><sheets>${names.map((n, i) => `<sheet name="${this.xmlEsc(n)}" sheetId="${i + 1}" r:id="rId${i + 1}"/>`).join('')}</sheets></workbook>`;
    const wbRels = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${sheets.map((_, i) => `<Relationship Id="rId${i + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i + 1}.xml"/>`).join('')}<Relationship Id="rId${sheets.length + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`;
    const styles = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="Calibri"/><family val="2"/></font><font><b/><sz val="11"/><name val="Calibri"/><family val="2"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FFE8EDFB"/><bgColor indexed="64"/></patternFill></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="4"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1"/><xf numFmtId="4" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/><xf numFmtId="9" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`;
    const files = [
      { name: '[Content_Types].xml', data: enc.encode(ct) },
      { name: '_rels/.rels', data: enc.encode(rels) },
      { name: 'xl/workbook.xml', data: enc.encode(wb) },
      { name: 'xl/_rels/workbook.xml.rels', data: enc.encode(wbRels) },
      { name: 'xl/styles.xml', data: enc.encode(styles) },
      ...sheets.map((s, i) => ({ name: `xl/worksheets/sheet${i + 1}.xml`, data: enc.encode(this.sheetXml(s)) }))
    ];
    return this.zip(files);
  },

  /* ---------- Okuma ---------- */
  async inflateRaw(data) {
    if (typeof DecompressionStream !== 'function') throw new Error('Bu tarayıcı sıkıştırılmış Excel dosyalarını açamıyor. Dosyayı CSV olarak kaydedip deneyin.');
    const ds = new DecompressionStream('deflate-raw');
    const stream = new Blob([data]).stream().pipeThrough(ds);
    return new Uint8Array(await new Response(stream).arrayBuffer());
  },
  unzip(buf) {
    const u8 = new Uint8Array(buf);
    const dv = new DataView(buf);
    let eocd = -1;
    for (let i = u8.length - 22; i >= Math.max(0, u8.length - 65557); i--) { if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; } }
    if (eocd < 0) throw new Error('Geçerli bir Excel dosyası değil');
    const count = dv.getUint16(eocd + 10, true);
    let p = dv.getUint32(eocd + 16, true);
    const dec = new TextDecoder();
    const entries = new Map();
    for (let i = 0; i < count; i++) {
      if (dv.getUint32(p, true) !== 0x02014b50) break;
      const method = dv.getUint16(p + 10, true);
      const csize = dv.getUint32(p + 20, true);
      const nlen = dv.getUint16(p + 28, true), xlen = dv.getUint16(p + 30, true), clen = dv.getUint16(p + 32, true);
      const lho = dv.getUint32(p + 42, true);
      entries.set(dec.decode(u8.subarray(p + 46, p + 46 + nlen)), { method, csize, lho });
      p += 46 + nlen + xlen + clen;
    }
    const self = this;
    return {
      entries,
      async text(name) {
        const e = entries.get(name);
        if (!e) return null;
        const start = e.lho + 30 + dv.getUint16(e.lho + 26, true) + dv.getUint16(e.lho + 28, true);
        const raw = u8.subarray(start, start + e.csize);
        const data = e.method === 0 ? raw : e.method === 8 ? await self.inflateRaw(raw) : null;
        if (!data) throw new Error('Desteklenmeyen sıkıştırma');
        return new TextDecoder('utf-8').decode(data);
      }
    };
  },
  async read(buf) {
    const z = this.unzip(buf);
    const P = (t) => new DOMParser().parseFromString(t, 'application/xml');
    const all = (doc, tag) => Array.from(doc.getElementsByTagNameNS('*', tag));
    let sheetPath = null;
    const wbT = await z.text('xl/workbook.xml');
    const relT = await z.text('xl/_rels/workbook.xml.rels');
    if (wbT && relT) {
      const first = all(P(wbT), 'sheet')[0];
      const rid = first && (first.getAttribute('r:id') || first.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships', 'id'));
      const rel = rid && all(P(relT), 'Relationship').find((r) => r.getAttribute('Id') === rid);
      if (rel) { const t = rel.getAttribute('Target'); sheetPath = t.startsWith('/') ? t.slice(1) : 'xl/' + t.replace(/^\.\//, ''); }
    }
    if (!sheetPath || !z.entries.has(sheetPath)) sheetPath = [...z.entries.keys()].filter((n) => /^xl\/worksheets\/sheet\d+\.xml$/.test(n)).sort()[0];
    if (!sheetPath) throw new Error('Dosyada çalışma sayfası bulunamadı');
    const shared = [];
    const ssT = await z.text('xl/sharedStrings.xml');
    if (ssT) all(P(ssT), 'si').forEach((si) => { shared.push(all(si, 't').filter((t) => !t.parentNode || t.parentNode.localName !== 'rPh').map((t) => t.textContent).join('')); });
    const sh = P(await z.text(sheetPath));
    const rows = [];
    all(sh, 'row').forEach((row) => {
      const rIdx = (+row.getAttribute('r') || rows.length + 1) - 1;
      const arr = [];
      all(row, 'c').forEach((c, k) => {
        const ref = c.getAttribute('r') || '';
        const letters = ref.replace(/\d+/g, '');
        let ci = k;
        if (letters) { ci = 0; for (const ch of letters) ci = ci * 26 + (ch.charCodeAt(0) - 64); ci -= 1; }
        const t = c.getAttribute('t');
        const vEl = all(c, 'v')[0];
        let val = '';
        if (t === 's') val = shared[+(vEl ? vEl.textContent : 0)] ?? '';
        else if (t === 'inlineStr') val = all(c, 't').map((x) => x.textContent).join('');
        else if (t === 'str' || t === 'e') val = vEl ? vEl.textContent : '';
        else if (t === 'b') val = vEl ? vEl.textContent === '1' : '';
        else if (vEl) { const n = Number(vEl.textContent); val = isNaN(n) ? vEl.textContent : n; }
        arr[ci] = val;
      });
      rows[rIdx] = Array.from(arr, (v) => v === undefined ? '' : v);
    });
    return Array.from(rows, (r) => r || []).filter((r) => r.some((v) => String(v).trim() !== ''));
  }
};

function parseCSV(text) {
  const first = (text.split(/\r?\n/)[0] || '');
  const cands = [';', '\t', ','].map((d) => [d, first.split(d).length - 1]).sort((a, b) => b[1] - a[1]);
  const delim = cands[0][1] > 0 ? cands[0][0] : ';';
  const rows = [];
  let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) {
      if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; }
      else cell += ch;
    } else if (ch === '"' && cell === '') q = true;
    else if (ch === delim) { row.push(cell); cell = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += ch;
  }
  if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
  return rows.filter((r) => r.some((c) => String(c).trim() !== ''));
}
async function readTableFile(file) {
  const buf = await file.arrayBuffer();
  const u8 = new Uint8Array(buf);
  if (u8[0] === 0x50 && u8[1] === 0x4B) return XLSX.read(buf);
  if (u8[0] === 0xD0 && u8[1] === 0xCF) throw new Error('Eski .xls biçimi açılamıyor. Excel\'de "Farklı kaydet" ile "Excel Çalışma Kitabı (.xlsx)" seçip tekrar deneyin.');
  let text = new TextDecoder('utf-8').decode(u8);
  if (text.includes('�')) { try { text = new TextDecoder('windows-1254').decode(u8); } catch (e) { /* utf-8 ile devam */ } }
  return parseCSV(text.replace(/^﻿/, ''));
}
