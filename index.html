/* ============================================================
   Yedekleme
   ============================================================ */
const Backup = {
  dirty: false,
  gen: 0,
  firstDirtyAt: 0,
  timer: null,
  running: false,
  supported() { return !SAMPLE && typeof window.showDirectoryPicker === 'function'; },
  /* Son değişiklikten 3 dk sonra yedekle; satışlar hiç durmasa bile ilk kaydedilmemiş değişiklikten en geç 10 dk sonra */
  markDirty() {
    this.dirty = true;
    this.gen++;
    if (!this.firstDirtyAt) this.firstDirtyAt = Date.now();
    this.schedule();
  },
  schedule() {
    clearTimeout(this.timer);
    const wait = Math.max(5000, Math.min(3 * 60e3, this.firstDirtyAt + 10 * 60e3 - Date.now()));
    this.timer = setTimeout(() => this.auto('change'), wait);
  },
  async exportData() {
    const names = Object.keys(DB.STORES);
    const data = {};
    if (DB.ok) {
      for (const n of names) {
        let arr = await DB.getAll(n);
        if (n === 'meta') arr = arr.filter((m) => m.id !== 'backupDir');
        data[n] = arr;
      }
    } else {
      data.meta = [S.settings];
      data.products = [...S.products.values()];
      data.customers = [...S.customers.values()];
      data.suppliers = [...S.suppliers.values()];
      data.ledger = S.ledger; data.sledger = S.sledger; data.purchases = S.purchases; data.sales = S.sales;
      data.lots = S.lots; data.moves = S.moves; data.expenses = S.expenses;
      data.closings = [...S.closings.values()]; data.days = [...S.days.values()];
    }
    return { app: 'tezgah', format: 1, version: APP.version, createdAt: Date.now(), biz: S.settings.bizName, data };
  },
  fileName(ts = Date.now()) { return `Tezgah-Yedek-${dayKey(ts)}.json`; },
  async download() {
    const obj = await this.exportData();
    downloadBlob(new Blob([JSON.stringify(obj)], { type: 'application/json' }), `${safeFileName(S.settings.bizName)}-yedek-${dayKey()}.json`);
    S.settings.lastDownloadAt = Date.now();
    if (!S.backupDir) S.settings.lastBackupAt = Date.now();
    saveSettings();
    emit('backup');
  },
  async permission(ask = false) {
    if (!S.backupDir || !S.backupDir.queryPermission) { S.backupPerm = 'none'; return 'none'; }
    try {
      let p = await S.backupDir.queryPermission({ mode: 'readwrite' });
      if (p !== 'granted' && ask) p = await S.backupDir.requestPermission({ mode: 'readwrite' });
      S.backupPerm = p;
      return p;
    } catch (e) { S.backupPerm = 'denied'; return 'denied'; }
  },
  async chooseDir() {
    if (!this.supported()) { toast('Bu tarayıcı klasöre otomatik yedeklemeyi desteklemiyor. Yedek dosyasını indirerek alabilirsiniz.', { type: 'warn', ms: 6000 }); return false; }
    try {
      const h = await window.showDirectoryPicker({ id: 'tezgah-yedek', mode: 'readwrite', startIn: 'documents' });
      S.backupDir = h;
      S.backupPerm = 'granted';
      S.settings.backupDirName = h.name;
      S.settings.autoBackup = true;
      await persist([putOp('meta', { id: 'backupDir', handle: h }), putOp('meta', S.settings)]);
      await this.writeNow('manual');
      emit('backup');
      return true;
    } catch (e) {
      if (e && e.name !== 'AbortError') toast('Klasör seçilemedi: ' + (e.message || e), { type: 'err' });
      return false;
    }
  },
  async writeNow(reason = 'auto') {
    if (this.running) return false;
    if (!S.backupDir) return false;
    const p = await this.permission(reason === 'manual');
    if (p !== 'granted') { emit('backup'); return false; }
    this.running = true;
    const gen = this.gen;
    let ok = false;
    try {
      await this.writeFile(this.fileName(), await this.exportData());
      await this.prune();
      S.settings.lastBackupAt = Date.now();
      if (this.gen === gen) { this.dirty = false; this.firstDirtyAt = 0; clearTimeout(this.timer); }
      await persist([putOp('meta', S.settings)], { quiet: true });
      ok = true;
      emit('backup');
      if (reason === 'manual') toast(`Yedek "${S.backupDir.name}" klasörüne kaydedildi`);
      return true;
    } catch (e) {
      console.error(e);
      if (reason === 'manual') toast('Yedek yazılamadı: ' + (e.message || e), { type: 'err' });
      return false;
    } finally {
      this.running = false;
      // Yazma sürerken yeni kayıt geldiyse onlar için de kısa süre sonra yedek al
      if (ok && this.dirty) this.schedule();
    }
  },
  async writeFile(name, obj) {
    const fh = await S.backupDir.getFileHandle(name, { create: true });
    const w = await fh.createWritable();
    await w.write(new Blob([JSON.stringify(obj)], { type: 'application/json' }));
    await w.close();
  },
  async prune(keep = 30) {
    try {
      const files = [];
      for await (const [name, h] of S.backupDir.entries()) {
        if (h.kind === 'file' && /^Tezgah-Yedek-\d{4}-\d{2}-\d{2}\.json$/.test(name)) files.push(name);
      }
      files.sort().reverse();
      for (const n of files.slice(keep)) await S.backupDir.removeEntry(n);
    } catch (e) { /* temizlik başarısızsa önemli değil */ }
  },
  async auto(reason) {
    if (!S.settings.autoBackup || !S.backupDir || DB.readOnly) return;
    const age = Date.now() - (S.settings.lastBackupAt || 0);
    if (reason === 'start' && age < 6 * 3600e3) return;
    if (reason === 'change' && !this.dirty) return;
    await this.writeNow('auto');
  },
  status() {
    const last = S.settings.lastBackupAt || 0;
    const ageDays = last ? (Date.now() - last) / 864e5 : Infinity;
    if (S.backupDir && S.backupPerm === 'granted') return { level: ageDays > 2 ? 'warn' : 'ok', last, ageDays };
    if (S.backupDir) return { level: 'perm', last, ageDays };
    return { level: ageDays > 7 ? 'bad' : (ageDays > 3 ? 'warn' : 'ok'), last, ageDays, manual: true };
  },
  /* Yedek dosyasını oku ve doğrula; geçersizse null */
  async readFile(file) {
    let obj;
    try { obj = JSON.parse(await file.text()); } catch (e) { toast('Dosya okunamadı. Tezgâh yedek dosyası (.json) seçin.', { type: 'err' }); return null; }
    if (!obj || obj.app !== 'tezgah' || !obj.data) { toast('Bu dosya bir Tezgâh yedeği değil.', { type: 'err' }); return null; }
    return obj;
  },
  describe(obj) {
    const d = obj.data;
    const cnt = (n) => (d[n] || []).length;
    return `<p><b>${esc(obj.biz || 'İsimsiz işletme')}</b>, ${fmtDT(obj.createdAt)} tarihli yedek (${esc(agoText(obj.createdAt))}).</p>
      <p class="mt-s">${plural(cnt('products'), 'ürün')}, ${plural(cnt('customers'), 'veresiye müşterisi')}, ${plural(cnt('sales'), 'satış')} kaydı içeriyor.</p>`;
  },
  async apply(obj) {
    if (!DB.ok) { toast('Tarayıcı kayıt alanı kullanılamıyor.', { type: 'err' }); return false; }
    const d = obj.data;
    const dir = S.backupDir;
    // Yeni bilgisayarda yedek klasörü yeniden seçilene kadar uyarı görünsün diye son yedek bilgisini sıfırla
    const meta = (d.meta || []).filter((m) => m && m.id !== 'backupDir')
      .map((m) => m.id === 'settings' ? Object.assign({}, m, { lastBackupAt: 0, backupDirName: dir ? (S.settings.backupDirName || dir.name) : '' }) : m);
    await DB.clearAll();
    for (const n of Object.keys(DB.STORES)) {
      const arr = n === 'meta' ? meta : d[n];
      if (Array.isArray(arr) && arr.length) await DB.putAll(n, arr);
    }
    if (dir) { try { await DB.write([putOp('meta', { id: 'backupDir', handle: dir })]); } catch (e) { console.error(e); } }
    // Yenilendikten sonra Yedekleme ayarları açılsın
    try { history.replaceState(null, '', '#/ayarlar/yedek/geri-yuklendi'); } catch (e) { /* */ }
    return true;
  },
  async restoreFrom(file) {
    const obj = await this.readFile(file);
    if (!obj) return;
    const ok = await confirmBox({
      title: 'Yedekten geri yüklensin mi?',
      message: `${this.describe(obj)}<div class="note warn mt-s">Bu bilgisayardaki mevcut kayıtların yerine yedekteki kayıtlar yüklenecek.${S.backupDir ? ' Mevcut kayıtların bir kopyası önce yedek klasörüne ayrıca kaydedilir.' : ''}</div>`,
      ok: 'Geri yükle', danger: true
    });
    if (!ok) return;
    // Güvenlik kopyası: yanlış dosya seçilirse bugünkü kayıtlar kaybolmasın
    if (S.backupDir && S.products.size && await this.permission(true) === 'granted') {
      const t = new Date();
      try { await this.writeFile(`Tezgah-GeriYuklemeOncesi-${dayKey(t)}-${pad(t.getHours())}${pad(t.getMinutes())}.json`, await this.exportData()); }
      catch (e) { if (!(await confirmBox({ title: 'Güvenlik kopyası alınamadı', message: 'Mevcut kayıtların kopyası yedek klasörüne yazılamadı. Yine de geri yüklensin mi?', ok: 'Geri yükle', danger: true }))) return; }
    }
    if (!(await this.apply(obj))) return;
    toast('Yedek geri yüklendi, uygulama yenileniyor…');
    setTimeout(() => location.reload(), 700);
  }
};

document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState === 'hidden') { if (Backup.dirty) Backup.auto('change'); return; }
  // Pencere uzun süre arka planda kaldıysa tarayıcı klasör iznini geri almış olabilir
  if (S.backupDir) { const before = S.backupPerm; const p = await Backup.permission(); if (p !== before) emit('backup'); }
});

/* ---- 20-domain.js ---- */
/* ============================================================
   İş kuralları: ürün, stok, SKT, satış, veresiye, toptancı,
   mal girişi, gider, kasa ve rapor hesapları
   ============================================================ */

/* ---------- Ürün ---------- */
const UNITS = { adet: 'adet', paket: 'paket', kg: 'kg', lt: 'lt' };
function productList(all = false) {
  const arr = [...S.products.values()];
  return (all ? arr : arr.filter((p) => p.active !== false)).sort((a, b) => a.name.localeCompare(b.name, 'tr'));
}
function minOf(p) { return p.min ?? S.settings.minStockDefault; }
function stockState(p) {
  if (p.track === false) return 'none';
  if (p.stock < 0) return 'neg';
  if (p.stock <= 0) return 'out';
  if (p.stock <= minOf(p)) return 'low';
  return 'ok';
}
function stockText(p) {
  if (p.track === false) return 'Stok takibi yok';
  return qtyFmt(p.stock) + ' ' + (p.unit || 'adet');
}
function margin(p) { return p.sell > 0 && p.buy > 0 ? (p.sell - p.buy) / p.sell : null; }
function findByBarcode(code) {
  const id = S.byBarcode.get(String(code || '').trim());
  return id ? S.products.get(id) : null;
}
function searchProducts(q, list) {
  const f = fold(q).trim();
  list = list || productList();
  if (!f) return list;
  const words = f.split(/\s+/);
  const scored = [];
  for (const p of list) {
    const name = fold(p.name);
    const hay = p.brand ? name + ' ' + fold(p.brand) : name;
    const bc = String(p.barcode || '');
    let score = -1;
    if (bc && bc === q.trim()) score = 100;
    else if (bc && q.trim().length >= 3 && bc.includes(q.trim())) score = 40;
    if (words.every((w) => name.includes(w))) score = Math.max(score, name.startsWith(words[0]) ? 80 : 60);
    else if (words.every((w) => hay.includes(w))) score = Math.max(score, 50);
    if (score >= 0) scored.push([score, p]);
  }
  return scored.sort((a, b) => b[0] - a[0] || a[1].name.localeCompare(b[1].name, 'tr')).map((x) => x[1]);
}

/* ---------- Marka ve kategori ---------- */
const NO_BRAND = 'Markasız';
const brandLabel = (b) => b || NO_BRAND;
function brandList() {
  const set = new Map();
  (S.settings.brands || []).forEach((b) => { if (b) set.set(fold(b), b); });
  for (const p of S.products.values()) if (p.brand && !set.has(fold(p.brand))) set.set(fold(p.brand), p.brand);
  return [...set.values()].sort((a, b) => a.localeCompare(b, 'tr'));
}
/* Yazılan markayı mevcut yazımla eşleştir ("ülker" → "Ülker"); yeniyse listeye ekle */
function normBrand(b, ops) {
  b = titleTR(b);
  if (!b) return '';
  const ex = brandList().find((x) => fold(x) === fold(b));
  if (ex) return ex;
  b = capFirst(b);
  S.settings.brands = [...(S.settings.brands || []), b];
  if (ops) ops.push(putOp('meta', S.settings));
  return b;
}
function catList() {
  const cats = [...S.settings.categories];
  for (const p of S.products.values()) if (p.cat && !cats.includes(p.cat)) cats.push(p.cat);
  return cats;
}
/* Gün sonunda öne çıkan kategori. Ayar boşsa adında "sigara" geçen kategori; "__none" ise gösterilmez */
const FOCUS_NONE = '__none';
function autoFocusCat() { return catList().find((c) => fold(c).includes('sigara')) || ''; }
function focusCat() {
  const f = S.settings.focusCat;
  if (f === FOCUS_NONE) return '';
  if (f && catList().includes(f)) return f;
  return autoFocusCat();
}

/* ---------- Personel fiyatı ---------- */
function staffPriceOf(p) {
  if (!p) return 0;
  if (p.staffPrice > 0) return p.staffPrice;
  const d = S.settings.staffDisc || 0;
  if (d > 0 && p.sell > 0) return r2(p.sell * (1 - d / 100));
  return p.sell;
}

function upsertProduct(data, { openingStock = 0, openingSkt = '' } = {}) {
  const ops = [];
  const now = Date.now();
  if (data.brand !== undefined) data.brand = normBrand(data.brand, ops);
  let p = data.id ? S.products.get(data.id) : null;
  if (p) {
    if (p.barcode && p.barcode !== data.barcode) S.byBarcode.delete(p.barcode);
    Object.assign(p, data, { updatedAt: now });
  } else {
    p = Object.assign({ id: uid(), stock: 0, buy: 0, sell: 0, unit: 'adet', cat: S.settings.categories[0] || 'Diğer', min: S.settings.minStockDefault, active: true, track: true, fav: false, skt: false, createdAt: now, updatedAt: now }, data);
    S.products.set(p.id, p);
    if (openingStock && p.track !== false) {
      p.stock = r3(openingStock);
      const mv = { id: uid(), ts: now, pid: p.id, n: p.name, type: 'open', q: p.stock, note: 'Açılış stoğu' };
      S.moves.push(mv); ops.push(putOp('moves', mv));
      if (p.skt && openingSkt) {
        const lot = { id: uid(), pid: p.id, skt: openingSkt, qty: p.stock, left: p.stock, ts: now, ref: 'open' };
        S.lots.push(lot); ops.push(putOp('lots', lot));
      }
    }
  }
  if (p.barcode) S.byBarcode.set(String(p.barcode), p.id);
  ops.push(putOp('products', p));
  persist(ops);
  emit('data');
  return p;
}
function deleteProduct(id) {
  const p = S.products.get(id);
  if (!p) return;
  const ops = [delOp('products', id)];
  S.products.delete(id);
  if (p.barcode) S.byBarcode.delete(String(p.barcode));
  S.lots = S.lots.filter((l) => { if (l.pid === id) { ops.push(delOp('lots', l.id)); return false; } return true; });
  persist(ops);
  emit('data');
}

/* ---------- SKT partileri ---------- */
function lotsOf(pid) {
  return S.lots.filter((l) => l.pid === pid && l.left > 0).sort((a, b) => a.skt.localeCompare(b.skt) || a.ts - b.ts);
}
function sktLeft(skt) { return daysBetween(todayKey(), skt); }
function sktState(skt) {
  const d = sktLeft(skt);
  if (d < 0) return 'expired';
  if (d <= S.settings.sktDays) return 'soon';
  return 'ok';
}
function sktLabel(skt) {
  const d = sktLeft(skt);
  if (d < 0) return `${-d} gün geçti`;
  if (d === 0) return 'Bugün son gün';
  if (d === 1) return 'Yarın son gün';
  return `${d} gün kaldı`;
}
function consumeLots(pid, q, ops) {
  const used = [];
  let rem = r3(q);
  for (const l of lotsOf(pid)) {
    if (rem <= 0) break;
    const u = Math.min(l.left, rem);
    l.left = r3(l.left - u);
    rem = r3(rem - u);
    used.push([l.id, u]);
    ops.push(putOp('lots', l));
  }
  return used;
}
function restoreLots(used, ops) {
  for (const [lid, u] of used || []) {
    const l = S.lots.find((x) => x.id === lid);
    if (l) { l.left = r3(l.left + u); ops.push(putOp('lots', l)); }
  }
}
function sktAlerts() {
  return S.lots
    .filter((l) => { const p = S.products.get(l.pid); return l.left > 0 && p && p.skt && p.active !== false && sktState(l.skt) !== 'ok'; })
    .sort((a, b) => a.skt.localeCompare(b.skt));
}
function stockAlerts() {
  const order = { neg: 0, out: 1, low: 2 };
  return productList().filter((p) => order[stockState(p)] !== undefined)
    .sort((a, b) => order[stockState(a)] - order[stockState(b)] || a.stock - b.stock);
}

/* ---------- Stok işlemleri ---------- */
function countStock(pid, newQty, note = '') {
  const p = S.products.get(pid);
  if (!p) return 0;
  const diff = r3(newQty - p.stock);
  if (!diff) return 0;
  const ops = [];
  p.stock = r3(newQty); p.updatedAt = Date.now();
  ops.push(putOp('products', p));
  if (diff < 0 && p.skt) consumeLots(pid, -diff, ops);
  const mv = { id: uid(), ts: Date.now(), pid, n: p.name, type: 'count', q: diff, note };
  S.moves.push(mv); ops.push(putOp('moves', mv));
  persist(ops); emit('data');
  return diff;
}
const WASTE_REASONS = ['Son kullanma tarihi geçti', 'Hasarlı / bozuk', 'Kayıp', 'Kendi kullanımı', 'Diğer'];
function wasteStock(pid, q, reason, note = '', lotId = null) {
  const p = S.products.get(pid);
  if (!p) return;
  q = r3(q);
  const ops = [];
  if (p.track !== false) p.stock = r3(p.stock - q);
  ops.push(putOp('products', p));
  if (p.skt) {
    let rest = q;
    if (lotId) {
      const l = S.lots.find((x) => x.id === lotId);
      if (l) { const u = Math.min(l.left, rest); l.left = r3(l.left - u); rest = r3(rest - u); ops.push(putOp('lots', l)); }
    }
    if (rest > 0) consumeLots(pid, rest, ops);
  }
  const mv = { id: uid(), ts: Date.now(), pid, n: p.name, type: 'waste', q: -q, cost: r2(q * (p.buy || 0)), reason, note };
  S.moves.push(mv); ops.push(putOp('moves', mv));
  persist(ops); emit('data');
}

/* ---------- Toplu fiyat ---------- */
function roundStep(v, step) {
  if (!step) return r2(v);
  return r2(Math.ceil(r2(v / step) - 1e-9) * step);
}
function bulkPricePlan(products, { mode, value, target, step, staff = true }) {
  const f = (old) => {
    if (!(old > 0)) return old;
    const v = mode === 'pct' ? old * (1 + value / 100) : old + value;
    return Math.max(0, roundStep(v, step));
  };
  return products.map((p) => ({
    p,
    oldSell: p.sell, newSell: target !== 'buy' ? f(p.sell) : p.sell,
    oldBuy: p.buy, newBuy: target !== 'sell' ? f(p.buy) : p.buy,
    oldStaff: p.staffPrice || 0, newStaff: target !== 'buy' && staff && p.staffPrice > 0 ? f(p.staffPrice) : (p.staffPrice || 0)
  })).filter((x) => x.oldSell !== x.newSell || x.oldBuy !== x.newBuy || x.oldStaff !== x.newStaff);
}
function applyBulkPrice(plan) {
  const ops = [];
  const now = Date.now();
  for (const x of plan) {
    x.p.sell = x.newSell; x.p.buy = x.newBuy;
    if (x.newStaff !== x.oldStaff) x.p.staffPrice = x.newStaff;
    x.p.updatedAt = now; ops.push(putOp('products', x.p));
  }
  persist(ops); emit('data');
}

/* ---------- Satış ---------- */
function itemsSummary(items, max = 80) {
  const s = items.map((i) => i.n + (Math.abs(i.q - 1) > 1e-9 ? ' ×' + qtyFmt(i.q) : '')).join(', ');
  return s.length > max ? s.slice(0, max - 1) + '…' : s;
}
/* Satışın ödeme parçaları: { nakit, kart, veresiye } (parçalı ödemede birden fazla) */
function salePays(s) { return s.pays ? s.pays : { [s.pay]: s.total }; }
/* Ciro: peşin satış, yani nakit + kart. Veresiye satış ciroya girmez, ayrı tutulur. */
function ciroOf(d) { return d ? r2((d.t || 0) - ((d.pay && d.pay.veresiye) || 0)) : 0; }
function saleCredit(s) { const p = salePays(s); return p.veresiye || 0; }
function emptyDay(id) { return { id, n: 0, t: 0, c: 0, disc: 0, pay: { nakit: 0, kart: 0, veresiye: 0 }, h: Array(24).fill(0), p: {}, st: [0, 0, 0] }; }
/* Günlük toplamlar. d.p[ürün] = [miktar, tutar, maliyet, ad, kategori, birim, marka]
   d.st = [personel satış sayısı, personel satış tutarı, personele yapılan indirim] */
function applyDay(sale, sign, ops) {
  let d = S.days.get(sale.day);
  if (!d) { d = emptyDay(sale.day); S.days.set(d.id, d); }
  d.n += sign;
  d.t = r2(d.t + sign * sale.total);
  d.c = r2(d.c + sign * sale.cost);
  d.disc = r2((d.disc || 0) + sign * (sale.disc || 0));
  for (const [m, v] of Object.entries(salePays(sale))) d.pay[m] = r2((d.pay[m] || 0) + sign * v);
  const hr = new Date(sale.ts).getHours();
  d.h[hr] = r2(d.h[hr] + sign * sale.total);
  const f = sale.sub > 0 ? sale.total / sale.sub : 1;
  let staffDisc = 0;
  for (const it of sale.items) {
    const key = it.pid || ('~' + it.n);
    const lt = it.q * it.p * f, lc = it.q * it.c;
    const pr = it.pid ? S.products.get(it.pid) : null;
    const a = d.p[key] || (d.p[key] = [0, 0, 0, it.n, '', '', '']);
    a[0] = r3(a[0] + sign * it.q); a[1] = r2(a[1] + sign * lt); a[2] = r2(a[2] + sign * lc); a[3] = it.n;
    a[4] = it.k || (pr && pr.cat) || 'Diğer';
    a[5] = it.u || (pr && pr.unit) || 'adet';
    a[6] = it.b !== undefined ? it.b : ((pr && pr.brand) || '');
    if (Math.abs(a[0]) < 1e-9 && Math.abs(a[1]) < 0.005) delete d.p[key];
    if (it.lp > it.p) staffDisc += (it.lp - it.p) * it.q;
  }
  if (sale.staff) {
    const st = d.st || (d.st = [0, 0, 0]);
    st[0] += sign; st[1] = r2(st[1] + sign * sale.total); st[2] = r2(st[2] + sign * staffDisc);
  }
  ops.push(putOp('days', d));
}
function createSale({ items, disc = 0, pay, pays = null, cid = null, given = null, ts = Date.now(), note = '', staff = false }, ext) {
  const ops = ext ? ext.ops : [];
  const day = dayKey(ts);
  const sItems = items.map((i) => {
    const it = { pid: i.pid || null, n: i.n, q: r3(i.q), p: r2(i.p), c: r2(i.c || 0), k: i.k || 'Diğer' };
    if (i.lp != null && r2(i.lp) > it.p) it.lp = r2(i.lp);
    const p = i.pid ? S.products.get(i.pid) : null;
    if (p) {
      it.c = r2(p.buy || 0); it.k = p.cat || 'Diğer'; it.u = p.unit || 'adet'; it.b = p.brand || '';
      if (p.track !== false) {
        p.stock = r3(p.stock - it.q); p.updatedAt = ts;
        ops.push(putOp('products', p));
        if (p.skt) { const used = consumeLots(p.id, it.q, ops); if (used.length) it.lots = used; }
      }
    }
    return it;
  });
  const sub = r2(sum(sItems, (i) => i.q * i.p));
  disc = r2(Math.min(Math.max(0, disc || 0), sub));
  const total = r2(sub - disc);
  const cost = r2(sum(sItems, (i) => i.q * i.c));
  // Parçalı ödeme: { nakit: 20, kart: 100 } gibi
  let parts = null;
  if (pays) {
    parts = {};
    for (const m of ['nakit', 'kart', 'veresiye']) { const v = r2(pays[m] || 0); if (v > 0.004) parts[m] = v; }
    const diff = r2(total - sum(Object.values(parts)));
    if (Math.abs(diff) >= 0.005) { const m = parts.kart ? 'kart' : (Object.keys(parts)[0] || 'nakit'); parts[m] = r2((parts[m] || 0) + diff); }
    const keys = Object.keys(parts);
    if (keys.length <= 1) { pay = keys[0] || pay || 'nakit'; parts = null; } else pay = 'parcali';
  }
  const credit = parts ? (parts.veresiye || 0) : (pay === 'veresiye' ? total : 0);
  const cashPart = parts ? (parts.nakit || 0) : total;
  const sale = {
    id: uid(), no: S.settings.seq++, ts, day, items: sItems, sub, disc, total, cost, pay,
    cid: credit > 0 ? cid : null,
    given: given != null ? r2(given) : null,
    change: given != null ? r2(given - cashPart) : null,
    note, void: false
  };
  if (parts) sale.pays = parts;
  if (staff) sale.staff = true;
  ops.push(putOp('sales', sale));
  ops.push(putOp('meta', S.settings));
  if (ts >= S.salesFrom) { S.sales.push(sale); if (S.sales.length > 1 && S.sales[S.sales.length - 2].ts > ts) S.sales.sort((a, b) => a.ts - b.ts); }
  if (credit > 0) {
    const c = S.customers.get(cid);
    const e = { id: uid(), cid, ts, type: 'sale', amt: credit, ref: sale.id, note: itemsSummary(sItems) + (parts ? `; toplam ${money(total)}, ${money(total - credit)} peşin ödendi` : ''), void: false };
    S.ledger.push(e); ops.push(putOp('ledger', e));
    if (c) { c.bal = r2((c.bal || 0) + credit); c.lastTs = Math.max(c.lastTs || 0, ts); ops.push(putOp('customers', c)); }
  }
  applyDay(sale, +1, ops);
  if (!ext) { persist(ops); emit('data'); }
  return sale;
}
async function getSale(id) {
  return S.sales.find((s) => s.id === id) || await DB.get('sales', id);
}
async function voidSale(id, reason = '') {
  const sale = await getSale(id);
  if (!sale || sale.void) return false;
  const ops = [];
  for (const it of sale.items) {
    const p = it.pid && S.products.get(it.pid);
    if (p && p.track !== false) {
      p.stock = r3(p.stock + it.q); ops.push(putOp('products', p));
      if (it.lots) restoreLots(it.lots, ops);
    }
  }
  if (saleCredit(sale) > 0) {
    const e = S.ledger.find((x) => x.ref === sale.id && x.type === 'sale');
    if (e && !e.void) {
      e.void = true; e.voidTs = Date.now(); ops.push(putOp('ledger', e));
      const c = S.customers.get(e.cid);
      if (c) { c.bal = r2(c.bal - e.amt); ops.push(putOp('customers', c)); }
    }
  }
  applyDay(sale, -1, ops);
  sale.void = true; sale.voidTs = Date.now(); sale.voidNote = reason;
  ops.push(putOp('sales', sale));
  persist(ops); emit('data');
  return true;
}
async function salesOfDay(dk) {
  if (dayStart(dk) >= S.salesFrom) return S.sales.filter((s) => s.day === dk);
  return (await DB.range('sales', 'ts', dayStart(dk), dayEnd(dk))).sort((a, b) => a.ts - b.ts);
}

/* ---------- Veresiye ---------- */
function customerList(all = false) {

/* ---------- Vade ---------- */
/* Ödemeler en eski borçtan başlayarak kapatılır (FIFO). Vade süresini aşan ve hâlâ ödenmemiş kısım "vadesi geçmiş" sayılır.
   base: vade farkı hesaplanacak tutar (önceki vade farkları hariç, faize faiz yürümez) */
function agingOf(cid, days = S.settings.vadeDays || 30) {
  const lim = Date.now() - days * 864e5;
  const q = [];
  let credit = 0;
  for (const e of customerEntries(cid)) {
    if (e.void) continue;
    if (e.amt > 0) {
      let a = e.amt;
      if (credit > 0) { const u = Math.min(credit, a); credit = r2(credit - u); a = r2(a - u); }
      if (a > 0.004) q.push({ amt: a, ts: e.ts, type: e.type });
    } else {
      let p = -e.amt;
      while (p > 0.004 && q.length) { const d = q[0]; const u = Math.min(d.amt, p); d.amt = r2(d.amt - u); p = r2(p - u); if (d.amt <= 0.004) q.shift(); }
      credit = r2(credit + p);
    }
  }
  const late = q.filter((d) => d.ts < lim);
  return {
    overdue: r2(sum(late, (d) => d.amt)),
    base: r2(sum(late.filter((d) => d.type !== 'vade'), (d) => d.amt)),
    oldest: q.length ? q[0].ts : 0
  };
}
function vadeSuggestion(c, rate = S.settings.vadeRate || 0) {
  const ag = agingOf(c.id);
  return { ...ag, rate, amount: r2(ag.base * rate / 100) };
}
function customerVade(cid, amount, { note = '', ts = Date.now(), rate = 0, base = 0 } = {}, ext) {
  const c = S.customers.get(cid);
  if (!c || !(amount > 0)) return null;
  amount = r2(amount);
  const e = { id: uid(), cid, ts, type: 'vade', amt: amount, note: note || (rate ? `Vade farkı %${NFQ.format(rate)}, ${money(base)} üzerinden` : 'Vade farkı'), rate, base, void: false };
  S.ledger.push(e);
  c.bal = r2(c.bal + amount); c.lastTs = Math.max(c.lastTs || 0, ts); c.lastVadeTs = Math.max(c.lastVadeTs || 0, ts);
  const ops = ext ? ext.ops : [];

  return e;
}

/* ---------- Mal girişi ---------- */
function createPurchase({ sid = null, ts = Date.now(), items, paid = 0, method = 'nakit', note = '' }, ext) {
  const ops = ext ? ext.ops : [];
  const pur = { id: uid(), no: S.settings.pseq++, ts, sid, items: [], total: 0, paid: 0, method, note, void: false };
  for (const it of items) {
    const p = S.products.get(it.pid);
    if (!p || !(it.q > 0)) continue;
    const q = r3(it.q), b = r2(it.b || 0);
    const row = { pid: p.id, n: p.name, u: p.unit || 'adet', q, b, s: (it.s != null && it.s > 0) ? r2(it.s) : null, skt: it.skt || '' };
    if (p.track !== false) p.stock = r3(p.stock + q);
    if (b > 0) p.buy = b;
    if (row.s) p.sell = row.s;
    p.updatedAt = ts;
    ops.push(putOp('products', p));
    if (p.skt && row.skt) {
      const lot = { id: uid(), pid: p.id, skt: row.skt, qty: q, left: q, ts, ref: pur.id };
      S.lots.push(lot); ops.push(putOp('lots', lot)); row.lot = lot.id;
    }
    const mv = { id: uid(), ts, pid: p.id, n: p.name, type: 'buy', q, cost: r2(q * b), ref: pur.id };
    S.moves.push(mv); ops.push(putOp('moves', mv));
    pur.items.push(row);
  }
  pur.total = r2(sum(pur.items, (i) => i.q * i.b));
  pur.paid = sid ? r2(clamp(paid || 0, 0, pur.total)) : pur.total;
  if (sid) {
    const s = S.suppliers.get(sid);
    const e1 = { id: uid(), sid, ts, type: 'buy', amt: pur.total, ref: pur.id, note: `Mal girişi #${pur.no} (${plural(pur.items.length, 'kalem')})`, void: false };
    S.sledger.push(e1); ops.push(putOp('sledger', e1));
    s.bal = r2(s.bal + pur.total);
    if (pur.paid > 0) {
      const e2 = { id: uid(), sid, ts, type: 'pay', amt: -pur.paid, method, ref: pur.id, note: `Mal girişi #${pur.no} peşinatı`, void: false };
      S.sledger.push(e2); ops.push(putOp('sledger', e2));
      s.bal = r2(s.bal - pur.paid);
    }
    s.lastTs = Math.max(s.lastTs || 0, ts);
    ops.push(putOp('suppliers', s));
  }
  S.purchases.push(pur);
  ops.push(putOp('purchases', pur), putOp('meta', S.settings));
  if (!ext) { persist(ops); emit('data'); }
  return pur;
}
function voidPurchase(id) {
  const pur = S.purchases.find((x) => x.id === id);
  if (!pur || pur.void) return false;
  const ops = [];
  const now = Date.now();
  for (const row of pur.items) {
    const p = S.products.get(row.pid);
    if (p && p.track !== false) { p.stock = r3(p.stock - row.q); ops.push(putOp('products', p)); }
    if (row.lot) { const l = S.lots.find((x) => x.id === row.lot); if (l) { l.left = 0; ops.push(putOp('lots', l)); } }
    const mv = { id: uid(), ts: now, pid: row.pid, n: row.n, type: 'buy-void', q: -row.q, ref: pur.id, note: `Mal girişi #${pur.no} iptal` };
    S.moves.push(mv); ops.push(putOp('moves', mv));
  }
  if (pur.sid) {
    for (const e of S.sledger) {
      if (e.ref === pur.id && !e.void) {
        e.void = true; e.voidTs = now; ops.push(putOp('sledger', e));
        const s = S.suppliers.get(e.sid);
        if (s) { s.bal = r2(s.bal - e.amt); ops.push(putOp('suppliers', s)); }

  pur.void = true; pur.voidTs = now;
  ops.push(putOp('purchases', pur));
  persist(ops); emit('data');
  return true;
}

/* ---------- Kasa ---------- */
function openingFor(dk) {
  const rec = S.closings.get(dk);
  if (rec && rec.opening != null) return rec.opening;
  let best = null;
  for (const c of S.closings.values()) if (c.id < dk && c.closedAt && c.carry != null && (!best || c.id > best.id)) best = c;
  return best ? best.carry : 0;
}
function setOpening(dk, amt) {
  const rec = S.closings.get(dk) || { id: dk };
  rec.opening = r2(amt);
  S.closings.set(dk, rec);
  persist([putOp('closings', rec)]); emit('data');
}
function cashSummary(dk) {
  const d = S.days.get(dk) || emptyDay(dk);
  const isDay = (ts) => dayKey(ts) === dk;
  const led = S.ledger.filter((e) => !e.void && e.type === 'pay' && isDay(e.ts));
  const colCash = r2(sum(led.filter((e) => e.method === 'nakit'), (e) => -e.amt));
  const colOther = r2(sum(led.filter((e) => e.method !== 'nakit'), (e) => -e.amt));
  const exps = S.expenses.filter((x) => isDay(x.ts));
  const expCash = r2(sum(exps.filter((x) => x.method === 'nakit'), (x) => x.amt));
  const expOther = r2(sum(exps.filter((x) => x.method !== 'nakit'), (x) => x.amt));
  const supCash = r2(sum(S.sledger.filter((e) => !e.void && e.type === 'pay' && e.method === 'nakit' && isDay(e.ts)), (e) => -e.amt));
  const purCash = r2(sum(S.purchases.filter((p) => !p.void && !p.sid && p.method === 'nakit' && isDay(p.ts)), (p) => p.paid));
  const opening = openingFor(dk);
  const cashSales = r2(d.pay.nakit || 0);
  const expected = r2(opening + cashSales + colCash - expCash - supCash - purCash);
  return { d, opening, cashSales, colCash, colOther, expCash, expOther, supCash, purCash, expected, exps, closing: S.closings.get(dk) };
}
function closeDay(dk, { counted, carry, note }) {
  const cs = cashSummary(dk);
  const rec = S.closings.get(dk) || { id: dk };
  Object.assign(rec, {
    opening: cs.opening, expected: cs.expected, counted: r2(counted), diff: r2(counted - cs.expected),
    carry: r2(carry), note: note || '', closedAt: Date.now(),
    sales: cs.d.t, cashSales: cs.cashSales, cardSales: cs.d.pay.kart || 0, credSales: cs.d.pay.veresiye || 0, n: cs.d.n
  });
  S.closings.set(dk, rec);
  // Gün sonu kaydedilir kaydedilmez yedek al (beklemeden)
  persist([putOp('closings', rec)]).then(() => Backup.auto('change'));
  emit('data');
  return rec;
}

/* ---------- Rapor toplamları ---------- */
function aggregate(from, to) {
  const A = { from, to, n: 0, t: 0, c: 0, disc: 0, pay: { nakit: 0, kart: 0, veresiye: 0 }, h: Array(24).fill(0), p: new Map(), st: [0, 0, 0], series: [] };
  for (let k = from; k <= to; k = addDays(k, 1)) {
    const d = S.days.get(k);
    A.series.push({ id: k, n: d ? d.n : 0, t: d ? d.t : 0, c: d ? d.c : 0, pay: d ? d.pay : { nakit: 0, kart: 0, veresiye: 0 } });
    if (!d) continue;
    A.n += d.n; A.t += d.t; A.c += d.c; A.disc += d.disc || 0;
    for (const k2 of Object.keys(A.pay)) A.pay[k2] += d.pay[k2] || 0;
    d.h.forEach((v, i) => { A.h[i] += v; });
    if (d.st) { A.st[0] += d.st[0]; A.st[1] += d.st[1]; A.st[2] += d.st[2]; }
    for (const [key, a] of Object.entries(d.p)) {
      const x = A.p.get(key) || { key, n: a[3], q: 0, t: 0, c: 0, k: '', u: '', b: '' };
      x.q += a[0]; x.t += a[1]; x.c += a[2]; x.n = a[3];
      if (a[4]) x.k = a[4];
      if (a[5]) x.u = a[5];
      if (a.length > 6) x.b = a[6] || '';
      A.p.set(key, x);
    }
  }
  // Raporlar ürünün güncel marka ve kategorisini kullanır; silinmiş ürünlerde satış anındaki bilgi geçerli
  for (const x of A.p.values()) {
    const p = x.key.startsWith('~') ? null : S.products.get(x.key);
    if (p) { x.k = p.cat || 'Diğer'; x.u = p.unit || 'adet'; x.b = p.brand || ''; x.n = p.name; }
    else { x.k = x.k || 'Diğer'; x.u = x.u || 'adet'; }
    x.q = r3(x.q); x.t = r2(x.t); x.c = r2(x.c);
  }
  A.st = [A.st[0], r2(A.st[1]), r2(A.st[2])];
  A.t = r2(A.t); A.c = r2(A.c); A.profit = r2(A.t - A.c);
  for (const k2 of Object.keys(A.pay)) A.pay[k2] = r2(A.pay[k2]);
  A.ciro = r2(A.t - A.pay.veresiye);
  const inR = (ts) => { const k = dayKey(ts); return k >= from && k <= to; };
  const exps = S.expenses.filter((x) => inR(x.ts));
  A.exp = r2(sum(exps, (x) => x.amt));
  A.expByCat = {};
  exps.forEach((x) => { A.expByCat[x.cat] = r2((A.expByCat[x.cat] || 0) + x.amt); });
  const wastes = S.moves.filter((m) => m.type === 'waste' && inR(m.ts));
  A.waste = r2(sum(wastes, (m) => m.cost || 0));
  A.wastes = wastes;
  A.net = r2(A.profit - A.exp - A.waste);
  A.collected = r2(sum(S.ledger.filter((e) => !e.void && e.type === 'pay' && inR(e.ts)), (e) => -e.amt));
  A.noCost = [...A.p.values()].filter((x) => !x.key.startsWith('~') && x.t > 0 && x.c <= 0).length;
  return A;
}
function productNameOf(key, fallback) {
  if (key.startsWith('~')) return key.slice(1);
  const p = S.products.get(key);
  return p ? p.name : fallback;
}
/* {paket: 37, adet: 4} → "37 paket, 4 adet" */
function unitsText(units) {
  const parts = Object.entries(units || {}).filter(([, q]) => Math.abs(q) > 1e-9).sort((a, b) => b[1] - a[1]);
  return parts.length ? parts.map(([u, q]) => `${qtyFmt(q)} ${u}`).join(', ') : '0';
}
/* Satılan ürünleri kategoriye ya da markaya göre grupla */
function breakdown(A, by = 'cat') {
  const G = new Map();
  for (const x of A.p.values()) {
    if (Math.abs(x.q) < 1e-9 && Math.abs(x.t) < 0.005) continue;
    const g = by === 'brand' ? (x.b || '') : (x.k || 'Diğer');
    const o = G.get(g) || { key: g, t: 0, c: 0, units: {}, items: [] };
    o.t += x.t; o.c += x.c; o.units[x.u] = r3((o.units[x.u] || 0) + x.q);
    o.items.push(x);
    G.set(g, o);
  }
  const fc = focusCat();
  return [...G.values()]
    .map((o) => { o.t = r2(o.t); o.c = r2(o.c); o.items.sort((a, b) => b.t - a.t); return o; })
    .sort((a, b) => (by === 'cat' ? (b.key === fc) - (a.key === fc) : (a.key === '') - (b.key === '')) || b.t - a.t);
}
/* Öne çıkan kategorinin (sigara) dönem özeti */
function focusSummary(A) {
  const cat = focusCat();
  if (!cat) return null;
  const units = {};
  let t = 0, c = 0;
  for (const x of A.p.values()) if (x.k === cat) { units[x.u] = r3((units[x.u] || 0) + x.q); t += x.t; c += x.c; }
  return { cat, units, t: r2(t), c: r2(c) };
}
function receivableTotal() { return r2(sum(customerList().filter((c) => c.bal > 0), (c) => c.bal)); }
function payableTotal() { return r2(sum(supplierList().filter((s) => s.bal > 0), (s) => s.bal)); }
/* Vadesi geçmiş borcu olan müşteriler; her birine c.overdue eklenir */
function overdueCustomers() {
  return customerList().filter((c) => {
    if (!(c.bal > 0.004)) return false;
    c.overdue = agingOf(c.id).overdue;
    return c.overdue > 0.004;
  });
}
function overLimitCustomers() { return customerList().filter((c) => c.limit > 0 && c.bal > c.limit); }

async function rebuildDays() {
  const all = (DB.ok ? await DB.getAll('sales') : S.sales.slice()).sort((a, b) => a.ts - b.ts);
  S.days = new Map();
  const tmp = [];
  for (const s of all) if (!s.void) applyDay(s, +1, tmp);
  if (DB.ok) {
    await new Promise((res, rej) => { const tx = DB.db.transaction(['days'], 'readwrite'); tx.objectStore('days').clear(); tx.oncomplete = res; tx.onerror = () => rej(tx.error); });
    await DB.putAll('days', [...S.days.values()]);
  }
  emit('data');
  return all.length;
}

/* ---------- Yönlendirme ---------- */
let NAV_PATH = null;
function parseHash() {
  let h = NAV_PATH;
  if (h === null) { try { h = location.hash.replace(/^#\/?/, ''); } catch (e) { h = ''; } }
  const [name, ...params] = h.split('/').map(decodeURIComponent);
  return { name: PAGES[name] ? name : 'ozet', params };
}
function route() {
  if (!$('#main')) return;
  const { name, params } = parseHash();
  closeMenu();
  if (current && current.page.unmount) { try { current.page.unmount(); } catch (e) { console.error(e); } }
  const page = PAGES[name];
  const main = $('#main');
  main.innerHTML = '';
  main.scrollTop = 0;
  const el = document.createElement('div');
  el.className = 'page-root' + (page.full ? ' full' : '');
  if (page.full) { main.style.overflow = 'hidden'; el.style.height = '100%'; } else main.style.overflow = '';
  main.appendChild(el);
  current = { name, params, page, el };
  try { page.mount(el, params); } catch (e) { console.error(e); el.innerHTML = `<div class="page"><div class="note bad">Bu ekran açılırken bir hata oluştu: ${esc(e.message)}</div></div>`; }
  $$('.nav-item[data-nav]').forEach((a) => {
    const on2 = a.dataset.nav === name;
    a.classList.toggle('active', on2);
    if (on2) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
  });
}
function syncNavFromUrl() { try { NAV_PATH = location.hash.replace(/^#\/?/, ''); } catch (e) { /* */ } route(); }
window.addEventListener('hashchange', syncNavFromUrl);
window.addEventListener('popstate', syncNavFromUrl);
function go(path) {
  NAV_PATH = path;
  try { if (location.hash !== '#/' + path) history.pushState(null, '', '#/' + path); } catch (e) { /* önizleme penceresinde adres yok */ }
  route();
}
document.addEventListener('click', (e) => {
  const a = e.target.closest('a[href^="#/"]');
  if (!a || e.defaultPrevented || e.button !== 0 || e.ctrlKey || e.metaKey || e.shiftKey) return;
  e.preventDefault();
  go(a.getAttribute('href').slice(2));
});

function rerender() {
  if (!current) return;
  const main = $('#main');
  const st = main.scrollTop;
  const a = document.activeElement;
  const fid = a && a.id && current.el.contains(a) ? a.id : null;
  let sel = null;
  try { sel = fid && typeof a.selectionStart === 'number' ? [a.selectionStart, a.selectionEnd] : null; } catch (e) { sel = null; }
  const el = document.createElement('div');
  el.className = current.el.className;
  el.style.height = current.el.style.height;
  el.style.minHeight = current.el.offsetHeight + 'px';
  current.el.replaceWith(el);
  current.el = el;
  try { current.page.mount(el, current.params); } catch (e) { console.error(e); }
  main.scrollTop = st;
  requestAnimationFrame(() => { el.style.minHeight = ''; });
  if (fid) {
    const n = document.getElementById(fid);
    if (n) { n.focus(); if (sel && n.setSelectionRange) { try { n.setSelectionRange(sel[0], sel[1]); } catch (e) { /* */ } } }
  }
}
let _rf = 0;
on('data', () => {
  if (_rf) return;
  _rf = requestAnimationFrame(() => {
    _rf = 0;
    updateBadges();
    if (!current) return;
    if (current.page.refresh) current.page.refresh(); else rerender();
  });
});

/* ---------- Klavye ---------- */
document.addEventListener('keydown', (e) => {
  if (_menu && e.key === 'Escape') { closeMenu(); return; }
  if ($('#gate')) return;
  const m = topModal();
  if (m) {
    if (m.onKey && m.onKey(e) === true) return;
    if (e.key === 'Escape') { e.preventDefault(); m.close(); return; }
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
      const t = e.target;
      if (t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.tagName === 'A' || (t.tagName === 'BUTTON' && !t.hasAttribute('data-enter'))) return;
      if (t.dataset && t.dataset.noenter !== undefined) return;
      const b = m.el.querySelector('[data-enter]');
      if (b && !b.disabled) { e.preventDefault(); b.click(); }
    }
    if (['F2', 'F3', 'F4', 'F8', 'F9'].includes(e.key)) e.preventDefault();
    return;
  }
  if (current && current.page.onKey) current.page.onKey(e);
});

/* ---------- Gerçek kullanıma geçiş (örnek verileri temizle) ---------- */
async function startRealUse() {
  const ok = await confirmBox({
    title: 'Örnek veriler silinsin mi?',
    message: 'Örnek ürünler, satışlar, veresiye ve toptancı kayıtlarının hepsi silinir. İşletme bilgileriniz ve ayarlarınız korunur.',
    ok: 'Sil ve başla', danger: true
  });
  if (!ok) return;
  await wipeData(true);
  toast('Hazırsınız. İlk ürünü barkod okutarak ekleyebilirsiniz.');
}
async function wipeData(keepSettings = true) {
  const keep = Object.assign({}, S.settings);
  const dir = S.backupDir;
  if (DB.ok) await DB.clearAll();
  S.products = new Map(); S.byBarcode = new Map(); S.customers = new Map(); S.suppliers = new Map();
  S.ledger = []; S.sledger = []; S.purchases = []; S.lots = []; S.moves = []; S.expenses = []; S.closings = new Map(); S.days = new Map(); S.sales = [];
  if (keepSettings) {
    S.settings = Object.assign(DEFAULT_SETTINGS(), keep, { demo: false, seq: 1001, pseq: 1 });
    const ops = [putOp('meta', S.settings)];
    if (dir) ops.push(putOp('meta', { id: 'backupDir', handle: dir }));
    await persist(ops);
  } else {
    S.settings = DEFAULT_SETTINGS();
    S.backupDir = null;
  }
  if (keepSettings) { renderShell(); go('ozet'); } else location.reload();
}

/* ---------- Kilit ---------- */
function lockNow() { showLock(() => { hideGate(); if (current && current.page.focus) current.page.focus(); }); }
function showLock(onOpen) {
  const s = S.settings;
  const len = s.pinLen || 4;
  let pin = '';
  let mode = 'pin';
  const draw = () => {
    if (mode === 'pin') {
      showGate(`<div class="gate-card" style="width:min(400px,100%);text-align:center">
        <div class="gate-brand" style="flex-direction:column;gap:10px;margin-bottom:6px"><div class="logo" style="width:60px;height:60px;border-radius:16px">${bizLogo()}</div><b style="font-size:17px">${esc(s.bizName || APP.name)}</b></div>
        <p class="lead">Devam etmek için şifrenizi girin</p>
        <div class="pin-dots" id="pd">${Array.from({ length: len }, (_, i) => `<i class="${i < pin.length ? 'on' : ''}"></i>`).join('')}</div>
        <div class="keypad">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map((n) => `<button data-k="${n}">${n}</button>`).join('')}<button class="fn" data-k="del">Sil</button><button data-k="0">0</button><button class="fn" data-k="clr">Temizle</button></div>
        <button class="btn ghost mt" id="lk-forgot">Şifremi unuttum</button>
      </div>`);
      $('#gate .keypad').onclick = (e) => { const b = e.target.closest('[data-k]'); if (b) press(b.dataset.k); };
      $('#lk-forgot').onclick = () => { mode = 'rec'; draw(); };
    } else {
      showGate(`<div class="gate-card" style="width:min(440px,100%)">
        <h1>Şifreyi sıfırla</h1>
        <p class="lead">Şifreyi belirlerken size verilen 8 haneli kurtarma kodunu yazın. Kod doğruysa şifre kaldırılır, Ayarlar'dan yenisini belirleyebilirsiniz.</p>
        <div class="field mt"><label for="lk-rec">Kurtarma kodu</label><input class="inp" id="lk-rec" placeholder="XXXX-XXXX" autocomplete="off" style="text-transform:uppercase;letter-spacing:.08em"><span class="hint red" id="lk-err"></span></div>
        <div style="display:flex;justify-content:space-between;margin-top:20px"><button class="btn ghost" id="lk-back">${ic('left')} Geri</button><button class="btn primary" id="lk-go">Şifreyi kaldır</button></div>
      </div>`);
      $('#lk-rec').focus();
      $('#lk-back').onclick = () => { mode = 'pin'; draw(); };
      const go2 = async () => {
        const code = $('#lk-rec').value.toUpperCase().replace(/[^A-Z0-9]/g, '');
        if (s.recHash && await sha256(s.pinSalt + ':rec:' + code) === s.recHash) {
          s.pinHash = ''; s.recHash = ''; s.pinLen = 0;
          await persist([putOp('meta', s)]);
          toast('Şifre kaldırıldı. Ayarlar > Güvenlik bölümünden yeni şifre belirleyebilirsiniz.', { ms: 6000 });
          document.removeEventListener('keydown', keyH, true);
          onOpen();
          renderShell(); route();
        } else { $('#lk-err').textContent = 'Kod hatalı. Kodu tire olmadan da yazabilirsiniz.'; }
      };
      $('#lk-go').onclick = go2;
      $('#lk-rec').addEventListener('keydown', (e) => { if (e.key === 'Enter') go2(); });
    }
  };
  const press = async (k) => {
    if (k === 'del') pin = pin.slice(0, -1);
    else if (k === 'clr') pin = '';
    else if (/^\d$/.test(k) && pin.length < len) pin += k;
    const dots = $('#pd');
    if (dots) dots.innerHTML = Array.from({ length: len }, (_, i) => `<i class="${i < pin.length ? 'on' : ''}"></i>`).join('');
    if (pin.length === len) {
      const h = await sha256(s.pinSalt + ':' + pin);
      if (h === s.pinHash) {
        document.removeEventListener('keydown', keyH, true);
        onOpen();
      } else {
        pin = '';
        beep('err');
        if (dots) { dots.classList.remove('shake'); void dots.offsetWidth; dots.classList.add('shake'); setTimeout(() => { dots.innerHTML = Array.from({ length: len }, () => '<i></i>').join(''); }, 350); }
      }
    }
  };
  const keyH = (e) => {
    if (!$('#gate') || mode !== 'pin') return;
    if (/^\d$/.test(e.key)) { e.preventDefault(); press(e.key); }
    else if (e.key === 'Backspace') { e.preventDefault(); press('del'); }
    else if (e.key === 'Escape') { e.preventDefault(); press('clr'); }
  };
  document.addEventListener('keydown', keyH, true);
  draw();
}

/* ---- 35-charts.js ---- */
/* ============================================================
   Grafikler: sütun grafik (tekli / yığılmış), yatay çubuk, oran çubuğu
   İnce çubuklar, saç teli ızgara, her çubukta üzerine gelince ipucu.
   ============================================================ */
function niceStep(v) {
  if (v <= 0) return 1;
  const e = Math.pow(10, Math.floor(Math.log10(v)));
  const f = v / e;
  return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * e;
}
function niceTicks(max, n = 4) {
  const step = niceStep(max / n);
  const top = Math.max(step, Math.ceil(max / step - 1e-9) * step);
  const arr = [];
  for (let v = 0; v <= top + step * 1e-6; v += step) arr.push(r2(v));
  return arr;
}
function barPath(x, y, w, h, r) {
  r = Math.max(0, Math.min(r, h, w / 2));
  return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`;
}

/**
 * columnChart(el, opts)
 *  data:   [{ label, title, vals:[...], extra:[[ad, değer]...], hl }]
 *  series: [{ name, color }]  (alttan üste yığılır)
 */
function columnChart(el, opts) {
  const { data, series, height = 230, yFmt = moneyAxis, vFmt = money, ariaLabel = 'Grafik' } = opts;
  el.classList.add('chart');
  const draw = () => {
    if (!el.isConnected) { if (el._ro) el._ro.disconnect(); return; }
    const W = Math.max(260, Math.floor(el.clientWidth || 600));
    const H = height;
    const padL = 58, padR = 6, padT = 10, padB = 26;
    const pw = W - padL - padR, ph = H - padT - padB;
    const totals = data.map((d) => d.vals.reduce((a, v) => a + Math.max(0, v || 0), 0));
    const empty = totals.every((t) => !t);
    const tk = niceTicks(Math.max(empty ? 1000 : 4, ...totals), 4);
    const top = tk[tk.length - 1];
    const y = (v) => padT + ph - (v / top) * ph;
    const n = Math.max(1, data.length);
    const band = pw / n;
    const bw = Math.min(24, Math.max(2, band * 0.64));
    const every = Math.max(1, Math.ceil(46 / band));
    let s = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${esc(ariaLabel)}">`;
    tk.forEach((v) => {
      const yy = Math.round(y(v)) + 0.5;
      s += `<line class="${v === 0 ? 'base' : 'gl'}" x1="${padL}" x2="${W - padR}" y1="${yy}" y2="${yy}"/>`;
      s += `<text x="${padL - 8}" y="${yy + 4}" text-anchor="end">${esc(yFmt(v))}</text>`;
    });
    data.forEach((d, i) => {
      const bx = padL + band * i;
      const x = bx + (band - bw) / 2;
      let acc = 0;
      let segs = '';
      const nz = d.vals.map((v, si) => [v || 0, si]).filter(([v]) => v > 0);
      nz.forEach(([v, si], idx) => {
        const y0 = y(acc), y1 = y(acc + v);
        acc += v;
        let h = y0 - y1;
        if (idx > 0) h -= 2;
        if (h <= 0.4) return;
        const isTop = idx === nz.length - 1;
        segs += isTop
          ? `<path class="bar" d="${barPath(x, y1, bw, h, 4)}" style="fill:${series[si].color}"/>`
          : `<rect class="bar" x="${x}" y="${y1}" width="${bw}" height="${h}" style="fill:${series[si].color}"/>`;
      });
      s += `<rect class="hit" x="${bx}" y="${padT}" width="${band}" height="${ph}" tabindex="0" data-i="${i}" aria-label="${esc((d.title || d.label) + ': ' + vFmt(totals[i]))}"/><g>${segs}</g>`;
      if (i % every === 0) s += `<text x="${bx + band / 2}" y="${H - 8}" text-anchor="middle" class="${d.hl ? 'vl' : ''}">${esc(d.label)}</text>`;
    });
    s += '</svg><div class="tip" role="presentation"></div>' + (empty ? `<div class="chart-empty">${esc(opts.emptyText || 'Bu dönemde satış yok.')}</div>` : '');
    el.innerHTML = s;
    const tip = el.querySelector('.tip');
    const show = (i, cx, cy) => {
      const d = data[i];
      tip.innerHTML = '';
      const tt = document.createElement('div'); tt.className = 'tt'; tt.textContent = d.title || d.label; tip.appendChild(tt);
      const rows = series.map((se, si) => [se.name, vFmt(d.vals[si] || 0), se.color]).reverse();
      if (series.length > 1) rows.push(['Toplam', vFmt(totals[i]), null]);
      (d.extra || []).forEach((x) => rows.push([x[0], x[1], null]));
      for (const [nm, val, col] of rows) {
        const r = document.createElement('div'); r.className = 'tr';
        const k = document.createElement('i'); k.className = 'tk'; k.style.background = col || 'transparent'; r.appendChild(k);
        const a = document.createElement('span'); a.className = 'tn'; a.textContent = nm; r.appendChild(a);
        const b = document.createElement('span'); b.className = 'tv'; b.textContent = val; r.appendChild(b);
        tip.appendChild(r);
      }
      tip.classList.add('on');
      const tw = tip.offsetWidth, th = tip.offsetHeight;
      let lx = cx + 14; if (lx + tw > W) lx = cx - tw - 14; lx = Math.max(0, lx);
      let ly = cy - th / 2; ly = clamp(ly, 0, H - th);
      tip.style.left = lx + 'px'; tip.style.top = ly + 'px';
    };
    const hide = () => tip.classList.remove('on');
    el.querySelectorAll('.hit').forEach((h) => {
      const i = +h.dataset.i;
      h.addEventListener('pointermove', (e) => { const r = el.getBoundingClientRect(); show(i, e.clientX - r.left, e.clientY - r.top); });
      h.addEventListener('pointerleave', hide);
      h.addEventListener('focus', () => { const bx = padL + band * i + band / 2; show(i, bx, padT + ph / 3); });
      h.addEventListener('blur', hide);
    });
  };
  draw();
  if (window.ResizeObserver && !el._ro) {
    let w0 = el.clientWidth;
    el._ro = new ResizeObserver(() => { if (Math.abs(el.clientWidth - w0) > 2) { w0 = el.clientWidth; draw(); } });
    el._ro.observe(el);
  }
}

/* Yatay çubuk listesi (tek seri) */
function hbars(rows, { fmt = money } = {}) {
  const max = Math.max(1e-9, ...rows.map((r) => r.v));
  return rows.map((r) => `<div class="hbar" title="${esc(r.name)}: ${esc(fmt(r.v))}">
    <div class="n">${esc(r.name)}${r.sub ? `<small>${esc(r.sub)}</small>` : ''}</div>
    <div><div class="b" style="width:${Math.max(0.6, (r.v / max) * 100).toFixed(2)}%"></div></div>
    <div class="v">${esc(fmt(r.v))}</div></div>`).join('');
}

/* Oran çubuğu (parça-bütün) + açıklama tablosu */
function splitBlock(parts, { fmt = money } = {}) {
  const tot = sum(parts, (p) => p.v);
  const vis = parts.filter((p) => p.v > 0);
  return `<div class="split" role="img" aria-label="${esc(parts.map((p) => p.name + ' ' + fmt(p.v)).join(', '))}">
      ${vis.map((p) => `<i style="width:${((p.v / (tot || 1)) * 100).toFixed(2)}%;background:${p.color}"></i>`).join('') || ''}
    </div>
    <div class="flow mt-s">
      ${parts.map((p) => `<div class="flow-row"><span class="k"><i class="dot" style="background:${p.color}"></i>${esc(p.name)}</span><span class="v">${esc(fmt(p.v))} <span class="muted" style="font:500 13px var(--font);margin-left:6px">${tot ? pct(p.v / tot) : '0%'}</span></span></div>`).join('')}
    </div>`;
}

/* ============================================================
   Satış (kasa) ekranı
   ============================================================ */
const POS = { cart: [], disc: 0, staff: false, held: [], top: 'fav', sub: '', q: '', hl: 0, last: null, lastKey: null, lastSnap: null };
const NONE_KEY = '__none';

const posSub = () => r2(sum(POS.cart, (l) => l.q * l.p));
const posTotal = () => { const s = posSub(); return r2(s - Math.min(POS.disc, s)); };
const posPriceOf = (p, staff = POS.staff) => (staff ? staffPriceOf(p) : p.sell);
/* Sepetin normal ya da personel fiyatıyla toplamı (elle değiştirilen fiyatlar korunur) */
function cartTotalWith(staff) {
  const s = r2(sum(POS.cart, (l) => {
    const p = l.pid && !l.custom ? S.products.get(l.pid) : null;
    return l.q * (p ? posPriceOf(p, staff) : l.p);
  }));
  return r2(s - Math.min(POS.disc, s));
}
function qtyParse(s) {
  const m = String(s).match(/^\s*(\d+(?:[.,]\d+)?)\s*[*xX×]\s*(.*)$/);
  if (m) return { q: parseNum(m[1]), rest: m[2] };
  return { q: 1, rest: String(s) };
}
function unitShort(u) { return { adet: 'ad', paket: 'pk', kg: 'kg', lt: 'lt' }[u] || u || 'ad'; }
function topSellers(n = 24, days = 30) {
  const from = addDays(todayKey(), -days);
  const m = new Map();
  for (const d of S.days.values()) {
    if (d.id < from) continue;
    for (const [k, a] of Object.entries(d.p)) if (!k.startsWith('~')) m.set(k, (m.get(k) || 0) + a[0]);
  }
  return [...m.entries()].sort((a, b) => b[1] - a[1]).map(([k]) => S.products.get(k)).filter((p) => p && p.active !== false).slice(0, n);
}
const byBrandNav = () => S.settings.posNav !== 'cat';
const navVal = (v) => (v === NONE_KEY ? '' : v);
function posList() {
  const list = productList();
  const q = POS.q.trim();
  if (q) return searchProducts(qtyParse(q).rest, list).slice(0, 80);
  if (POS.top === 'fav') {
    const favs = list.filter((p) => p.fav);
    return favs.length ? favs : topSellers(30);
  }
  if (POS.top === 'all') return list;
  const bb = byBrandNav();
  const tv = navVal(POS.top);
  let L = list.filter((p) => (bb ? (p.brand || '') : p.cat) === tv);
  if (POS.sub) { const sv = navVal(POS.sub); L = L.filter((p) => (bb ? p.cat : (p.brand || '')) === sv); }
  return L;
}

function posRenderTiles() {

  const hint = $('#pos-hint');
  if (hint) hint.textContent = q ? (list.length ? `${list.length} sonuç, Enter ile ekle` : '') : '';
  box.classList.toggle('staff', POS.staff);
  if (!list.length) {
    if (q) box.innerHTML = `<div class="empty">${ic('search')}<b>"${esc(qtyParse(q).rest)}" bulunamadı</b><p>Barkod yeniyse Enter'a basın, ürünü hemen kaydedip satışa ekleyelim.</p></div>`;
    else if (!S.products.size) box.innerHTML = `<div class="empty">${ic('box')}<b>Henüz ürün yok</b><p>Bir ürünün barkodunu okutun; kayıtlı değilse burada hemen ekleyebilirsiniz. Toplu eklemek için Ürünler ekranını kullanın.</p><a class="btn primary" href="#/urunler">${ic('plus')} Ürün ekle</a></div>`;
    else if (POS.top === 'fav') box.innerHTML = `<div class="empty">${ic('star')}<b>Hızlı ürün seçilmedi</b><p>Çay, simit, tost gibi barkodsuz ürünleri Ürünler ekranında "Kasada hızlı buton" olarak işaretleyin.</p></div>`;
    else box.innerHTML = `<div class="empty">${ic('box')}<b>Bu grupta ürün yok</b></div>`;
    return;
  }
  if (POS.hl >= list.length) POS.hl = 0;
  box.innerHTML = list.map((p, i) => {
    const st = stockState(p);
    const cls = (st === 'neg' || st === 'out') ? 'neg' : st === 'low' ? 'low' : '';
    const stTxt = p.track === false ? '' : `${qtyFmt(p.stock)} ${unitShort(p.unit)}`;
    const price = posPriceOf(p);
    return `<button class="tile ${cls} ${q && i === POS.hl ? 'hl' : ''}" data-pid="${p.id}" title="${esc(p.name)}${p.brand ? '\nMarka: ' + esc(p.brand) : ''}${p.barcode ? '\nBarkod: ' + esc(p.barcode) : ''}${POS.staff && price !== p.sell ? '\nNormal fiyat: ' + money(p.sell) : ''}">
      ${p.fav && POS.top !== 'fav' ? '<i class="fav"></i>' : ''}
      <span class="nm">${esc(p.name)}</span>
      <span class="bt"><span class="pr">${money(price)}</span><span class="st">${stTxt}</span></span></button>`;
  }).join('');
  if (q) { const h = box.querySelector('.tile.hl'); if (h) h.scrollIntoView({ block: 'nearest' }); }
}

/* ---------- Personel fiyatı ---------- */
function posSetStaff(on) {
  POS.staff = !!on;
  for (const l of POS.cart) {
    if (!l.pid || l.custom) continue;
    const p = S.products.get(l.pid);
    if (!p) continue;
    l.lp = p.sell; l.p = posPriceOf(p);
  }
  posRenderStaff(); posRenderCart(); posRenderTiles();
}
function posRenderStaff() {
  $$('#pos-mode button').forEach((b) => b.classList.toggle('on', (b.dataset.mode === 'staff') === POS.staff));
  const r = $('#pos-receipt'); if (r) r.classList.toggle('staff-mode', POS.staff);
}

function posAdd(p, q = 1, asked = false) {
  if (!p) return;
  if (!asked && (p.unit === 'kg' || p.unit === 'lt') && q === 1) {
    askBox({
      title: p.name, label: `Miktar (${p.unit})`, value: '1', type: 'money',
      hint: `Birim fiyat ${money(posPriceOf(p))} / ${p.unit}`,
      validate: (v) => parseNum(v) > 0 ? '' : 'Miktarı yazın (ör. 0,5).'
    }).then((v) => { if (v !== null) posAdd(p, parseNum(v), true); });
    return;
  }
  if (!(p.sell > 0)) {
    askBox({
      title: 'Satış fiyatı yok', label: `${p.name} için satış fiyatı`, type: 'money', value: '',
      hint: 'Fiyat ürün kartına da kaydedilir.',
      validate: (v) => parseNum(v) > 0 ? '' : 'Fiyatı yazın.'
    }).then((v) => {
      if (v === null) return;
      p.sell = r2(parseNum(v)); upsertProduct(p);
      posAdd(p, q, true);
    });
    return;
  }
  const ex = POS.cart.find((l) => l.pid === p.id && !l.custom);
  if (ex) { ex.q = r3(ex.q + q); POS.lastKey = ex.key; }
  else { const l = { key: uid(), pid: p.id, n: p.name, q: r3(q), p: posPriceOf(p), lp: p.sell, u: p.unit || 'adet' }; POS.cart.push(l); POS.lastKey = l.key; }
  beep();
  posRenderCart(true);
}
function posEnter() {
  const inp = $('#pos-q');
  const raw = inp.value;
  if (!raw.trim()) return;
  const { q, rest } = qtyParse(raw);
  const code = rest.trim();
  if (q > 9999) { beep('err'); toast('Adet çok yüksek görünüyor.', { type: 'warn' }); return; }
  let p = findByBarcode(code);
  if (!p && code) {
    const list = posList();
    if (list.length) p = list[Math.min(POS.hl, list.length - 1)];
  }
  if (p) { posAdd(p, q > 0 ? q : 1, q !== 1); posClearSearch(); return; }
  if (/^\d{5,14}$/.test(code)) {
    beep('err');
    posClearSearch();
    openProductForm({ barcode: code }, {
      sub: `<b>${esc(code)}</b> barkodlu ürün kayıtlı değil. Bilgilerini girip kaydedin, ürün satışa eklenecek.`,
      onSaved: (np) => posAdd(np, q > 0 ? q : 1, q !== 1)
    });
    return;
  }
  beep('err');
  toast(`"${code}" ile eşleşen ürün yok`, { type: 'warn' });
}
function posBump(d) {
  const l = POS.cart.find((x) => x.key === POS.lastKey) || POS.cart[POS.cart.length - 1];
  if (!l) return;
  l.q = r3(l.q + d);
  if (l.q <= 0) POS.cart = POS.cart.filter((x) => x !== l);
  posRenderCart();
}

function posRenderCart(flash = false) {
  const box = $('#pos-lines'); if (!box) return;
  $('#pos-no').textContent = '#' + S.settings.seq;
  if (!POS.cart.length) {
    box.innerHTML = `<div class="empty">${ic('receipt')}<b>Sepet boş</b><p>Barkod okutun ya da soldaki ürünlere dokunun.</p></div>`;
  } else {
    const inCart = {};
    POS.cart.forEach((l) => { if (l.pid) inCart[l.pid] = (inCart[l.pid] || 0) + l.q; });
    box.innerHTML = POS.cart.map((l) => {
      const p = l.pid ? S.products.get(l.pid) : null;
      const warn = p && p.track !== false && p.stock - inCart[p.id] < 0 ? `<span class="amber" title="Kayıtlı stok yetersiz">${ic('alert', 'sm')} stok ${qtyFmt(p.stock)}</span>` : '';
      const was = !l.custom && l.lp > l.p ? `<s class="was">${money(l.lp)}</s>` : '';
      return `<div class="line" data-key="${l.key}">
        <div class="nm">${esc(l.n)}</div>
        <div class="lt">${money(l.q * l.p)}</div>
        <div class="meta">${was}<button data-a="price" data-key="${l.key}" title="Bu satış için fiyatı değiştir">${money(l.p)}</button><span>/ ${esc(l.u || 'adet')}</span>${l.custom && l.pid ? '<span class="pill info">özel fiyat</span>' : ''}${warn}</div>
        <div class="ctl"><div class="qty"><button data-a="dec" data-key="${l.key}" aria-label="Azalt">${ic('minus', 'sm')}</button><input value="${qtyFmt(l.q)}" data-key="${l.key}" inputmode="decimal" aria-label="Adet"><button data-a="inc" data-key="${l.key}" aria-label="Artır">${ic('plus', 'sm')}</button></div><button class="icon-btn sm danger" data-a="rm" data-key="${l.key}" aria-label="Kaldır" title="Kaldır">${ic('x', 'sm')}</button></div>
      </div>`;
    }).join('');
    if (flash && POS.lastKey) {
      const n = box.querySelector(`[data-key="${POS.lastKey}"]`);
      if (n) { n.classList.add('new'); n.scrollIntoView({ block: 'nearest' }); }
    }
  }
  const sub = posSub();
  if (POS.disc > sub) POS.disc = sub;
  const total = posTotal();
  $('#pos-sub').textContent = money(sub);
  $('#pos-discv').innerHTML = POS.disc > 0 ? `<span class="red">, indirim −${money(POS.disc)}</span>` : '';
  $('#pos-total').textContent = money(total);
  $('#pos-display').classList.toggle('zero', !POS.cart.length);
  $('#pos-tlabel').textContent = POS.staff ? 'Personel toplamı' : 'Toplam';
  const qn = sum(POS.cart, (l) => (l.u === 'kg' || l.u === 'lt') ? 1 : l.q);
  const saved = POS.staff ? r2(cartTotalWith(false) - total) : 0;
  $('#pos-cnt').textContent = !POS.cart.length ? 'Sepet boş' : saved > 0 ? `${plural(POS.cart.length, 'kalem')}, ${money(saved)} indirim` : `${plural(POS.cart.length, 'kalem')}, ${NF0.format(qn)} parça`;
  $$('.pay, .split-btn').forEach((b) => { b.disabled = !POS.cart.length; });
}
function posRenderHeld() {
  const box = $('#pos-held'); if (!box) return;
  box.innerHTML = POS.held.map((h, i) => {
    const t = r2(sum(h.cart, (l) => l.q * l.p) - h.disc);
    return `<button data-a="resume" data-i="${i}" title="Bekleyen satışı geri getir">${ic('pause', 'sm')} ${money(t)}${h.staff ? ' <span class="pill staff">P</span>' : ''} <span class="muted">${fmtTime(h.ts)}</span></button>`;
  }).join('');
}
function posRenderLast() {
  const box = $('#pos-last'); if (!box) return;
  const today = todayKey();
  const s = [...S.sales].reverse().find((x) => !x.void && x.day === today);
  if (!s) { box.innerHTML = `<span>Bugün henüz satış yok.</span>`; return; }
  const cust = s.cid && S.customers.get(s.cid);
  box.innerHTML = `<span>Son satış <b>#${s.no}</b>, ${fmtTime(s.ts)}, <b>${money(s.total)}</b> ${esc(payLabel(s).toLocaleLowerCase('tr'))}${s.staff ? ', personel' : ''}${cust ? ' (' + esc(cust.name) + ')' : ''}</span><button class="btn ghost sm" data-a="undo" data-id="${s.id}" title="Son satışı iptal et">${ic('undo', 'sm')} Geri al</button>`;
}

/* ---------- Ödeme ---------- */
function posPay(type) {
  if (MODALS.length) return;
  if (!POS.cart.length) { beep('err'); toast('Sepet boş. Önce ürün ekleyin.', { type: 'info' }); return; }
  if (type === 'nakit') posCash();
  else if (type === 'kart') posFinish('kart');
  else if (type === 'veresiye') posCredit();
  else if (type === 'split') posSplit();
}
function posFinish(pay, extra = {}) {
  const items = POS.cart.map((l) => ({ pid: l.pid, n: l.n, q: l.q, p: l.p, lp: !l.custom && l.lp > l.p ? l.lp : null }));
  const sale = createSale(Object.assign({ items, disc: POS.disc, pay, staff: POS.staff }, extra));
  const snap = { cart: POS.cart, disc: POS.disc, staff: POS.staff };
  POS.cart = []; POS.disc = 0; POS.last = sale; POS.lastKey = null; POS.staff = false;
  beep('done');
  posRenderStaff(); posRenderCart(); posRenderTiles(); posRenderLast();
  let msg;
  const c = sale.cid ? S.customers.get(sale.cid) : null;
  if (sale.pays) msg = `Parçalı ödeme: ${payLabel(sale)}${c ? ` (${c.name} hesabına yazıldı)` : ''}`;
  else if (sale.pay === 'nakit') msg = sale.change > 0 ? `Nakit ${money(sale.total)}. Para üstü ${money(sale.change)}` : `Nakit satış: ${money(sale.total)}`;
  else if (sale.pay === 'kart') msg = `Kartla satış: ${money(sale.total)}`;
  else msg = `${c ? c.name : 'Müşteri'} hesabına yazıldı: ${money(sale.total)}`;
  if (sale.staff) msg += ', personel fiyatı';
  toast(msg, { ms: 5000 });
  POS.lastSnap = { id: sale.id, ...snap };
  posFocus();
}
function cashSuggestions(total) {
  const out = [total];
  for (const b of [5, 10, 20, 50, 100, 200, 500, 1000]) {
    const v = Math.ceil(total / b - 1e-9) * b;
    if (v > total + 0.001 && !out.some((x) => Math.abs(x - v) < 0.001)) out.push(v);
  }
  return out.sort((a, b) => a - b).slice(0, 6);
}
function posCash() {
  const total = posTotal();
  const quick = cashSuggestions(total);
  openModal({
    title: 'Nakit ödeme', size: 'sm',
    body: `<div class="sum-line"><span class="muted strong">Ödenecek</span><span class="big-amt">${money(total)}</span></div>
      <div class="field mt"><label for="cash-in">Müşteriden alınan</label><input class="inp num" id="cash-in" inputmode="decimal" placeholder="${moneyIn(total)}" style="height:52px;font-size:24px;font-family:var(--font-num)" autofocus></div>
      <div class="cash-grid mt-s">${quick.map((v, i) => `<button data-v="${v}">${i === 0 ? 'Tam tutar' : NF0.format(v) + ' ₺'}</button>`).join('')}</div>
      <div class="change-box mt" id="cash-ch"><span class="k">Para üstü</span><span class="v">0,00 ₺</span></div>
      <div class="rest-acts hidden" id="cash-rest">
        <button class="btn" data-rest="kart">${ic('card')}<span class="ra"><b></b><small>kalanı kartla öde</small></span></button>
        <button class="btn" data-rest="veresiye">${ic('book')}<span class="ra"><b></b><small>kalanı veresiyeye yaz</small></span></button>
      </div>
      <p class="muted mt-s" style="font-size:13px" id="cash-hint">Tutarı boş bırakırsanız tam ödeme kabul edilir.</p>`,
    foot: `<button class="btn" data-close>Vazgeç</button><button class="btn green lg" data-enter id="cash-ok">${ic('check')} Satışı tamamla</button>`,
    onMount(el, m) {
      const inp = $('#cash-in', el);
      const box = $('#cash-ch', el);
      const rest = $('#cash-rest', el);
      const given = () => (inp.value.trim() ? parseNum(inp.value) : total);
      const upd = () => {
        const g = given();
        const ch = r2(g - total);
        box.classList.toggle('short', ch < -0.001 || isNaN(ch));
        box.querySelector('.k').textContent = ch < -0.001 ? 'Eksik' : 'Para üstü';
        box.querySelector('.v').textContent = isNaN(ch) ? '—' : money(Math.abs(ch));
        const partial = g > 0.004 && ch < -0.004;
        rest.classList.toggle('hidden', !partial);
        $('#cash-hint', el).textContent = partial ? 'Eksik kalan tutarı kartla ya da veresiyeyle tamamlayabilirsiniz.' : 'Tutarı boş bırakırsanız tam ödeme kabul edilir.';
        if (partial) $$('b', rest).forEach((b) => { b.textContent = money(-ch); });
      };
      inp.addEventListener('input', upd);
      el.querySelector('.cash-grid').onclick = (e) => {
        const b = e.target.closest('[data-v]'); if (!b) return;
        inp.value = moneyIn(+b.dataset.v); upd(); $('#cash-ok', el).focus();
      };
      rest.onclick = (e) => {
        const b = e.target.closest('[data-rest]'); if (!b) return;
        const g = r2(given());
        const left = r2(total - g);
        if (!(g > 0) || !(left > 0)) return;
        m.close(true);
        if (b.dataset.rest === 'kart') posFinish('parcali', { pays: { nakit: g, kart: left }, given: g });
        else posCredit({ pays: { nakit: g }, amount: left });
      };
      $('#cash-ok', el).onclick = () => {
        const g = given();
        if (isNaN(g) || g < total - 0.001) { inp.classList.add('err'); inp.focus(); beep('err'); return; }
        if (g > Math.max(20000, total * 50)) {
          inp.classList.add('err'); inp.select(); beep('err');
          box.classList.add('short'); box.querySelector('.k').textContent = 'Tutar çok yüksek, kontrol edin'; box.querySelector('.v').textContent = '';
          return;
        }
        m.close(true);
        posFinish('nakit', { given: g });
      };
      upd();
    }
  });
}

/* Parçalı ödeme: nakit + kart (+ istenirse veresiye) */
function posSplit() {
  const total = posTotal();
  const F = ['nakit', 'kart', 'veresiye'];
  const val = { nakit: 0, kart: 0, veresiye: 0 };
  const touched = new Set();
  let cust = null;
  openModal({
    title: 'Parçalı ödeme', size: 'sm', sub: 'Müşterinin her ödeme şekliyle verdiği tutarı yazın; kalan kendiliğinden hesaplanır.',
    body: `<div class="sum-line"><span class="muted strong">Ödenecek</span><span class="big-amt">${money(total)}</span></div>
      <div class="split-rows mt">${F.map((m) => `<div class="split-row"><label for="sp-${m}"><i class="dot ${m}"></i>${payName[m]}</label>
        <div class="inp-wrap"><input class="inp num" id="sp-${m}" data-m="${m}" inputmode="decimal" placeholder="0,00" ${m === 'nakit' ? 'autofocus' : ''}><span class="suffix">₺</span></div>
        <button class="btn sm" data-rest="${m}" title="Kalan tutarı buraya yaz">Kalanı</button></div>`).join('')}</div>
      <div id="sp-cust" class="mt-s hidden"></div>
      <div class="change-box mt" id="sp-left"><span class="k">Kalan</span><span class="v">${money(total)}</span></div>`,
    foot: `<button class="btn" data-close>Vazgeç</button><button class="btn green lg" data-enter id="sp-ok">${ic('check')} Satışı tamamla</button>`,
    onMount(el, m) {
      const inpOf = (k) => $('#sp-' + k, el);
      const left = () => r2(total - val.nakit - val.kart - val.veresiye);
      const draw = () => {
        const l = left();
        const box = $('#sp-left', el);
        box.classList.toggle('short', Math.abs(l) >= 0.005);
        box.querySelector('.k').textContent = Math.abs(l) < 0.005 ? 'Tutar tamam' : l > 0 ? 'Eksik' : 'Fazla';
        box.querySelector('.v').textContent = money(Math.abs(l));
        const cb = $('#sp-cust', el);
        cb.classList.toggle('hidden', !(val.veresiye > 0));
        cb.innerHTML = cust
          ? `<div class="note info" style="display:flex;align-items:center;gap:10px">${ic('book', 'sm')}<span style="flex:1"><b>${esc(cust.name)}</b>${cust.title ? ` <span class="muted">${esc(cust.title)}</span>` : ''}: borcu ${money(cust.bal)} → <b>${money(cust.bal + val.veresiye)}</b></span><button class="btn sm" data-pick>Değiştir</button></div>`
          : `<div class="note warn" style="display:flex;align-items:center;gap:10px">${ic('alert', 'sm')}<span style="flex:1">Veresiye kısmı için müşteri seçin.</span><button class="btn sm primary" data-pick>Müşteri seç</button></div>`;
      };
      const setVal = (k, v, mark) => {
        val[k] = Math.max(0, r2(v || 0));
        inpOf(k).value = val[k] > 0 ? moneyIn(val[k]) : '';
        if (mark) touched.add(k);
      };
      el.addEventListener('input', (e) => {
        const k = e.target.dataset && e.target.dataset.m; if (!k) return;
        const v = parseNum(e.target.value);
        val[k] = isNaN(v) ? 0 : Math.max(0, r2(v));
        touched.add(k);
        // Kalanı, elle girilmemiş ilk alana (önce kart, sonra nakit) yaz
        const target = ['kart', 'nakit'].find((x) => x !== k && !touched.has(x));
        if (target) {
          const others = F.filter((x) => x !== target).reduce((a, x) => a + val[x], 0);
          setVal(target, total - others, false);
        }
        draw();
      });
      el.addEventListener('click', (e) => {
        const r = e.target.closest('[data-rest]');
        if (r) {
          const k = r.dataset.rest;
          const others = F.filter((x) => x !== k).reduce((a, x) => a + val[x], 0);
          setVal(k, total - others, true);
          draw(); inpOf(k).focus();
          if (k === 'veresiye' && !cust) pick();
          return;
        }
        if (e.target.closest('[data-pick]')) pick();
      });
      const pick = () => customerPicker('Veresiye müşterisi seç', (c) => { cust = c; draw(); });
      $('#sp-ok', el).onclick = () => {
        const l = left();
        if (Math.abs(l) >= 0.005) { beep('err'); $('#sp-left', el).animate([{ transform: 'translateX(-6px)' }, { transform: 'translateX(6px)' }, { transform: 'none' }], { duration: 200 }); return; }
        if (val.veresiye > 0 && !cust) { beep('err'); pick(); return; }
        m.close(true);
        posFinish('parcali', { pays: { ...val }, cid: cust ? cust.id : null });
      };
      draw();
    }
  });
}

function posCredit(opts = {}) {
  const pre = opts.pays || null;
  const st = { q: '', idx: 0, sel: null, staffApply: true };
  const list = () => {
    const f = fold(st.q).trim();
    const digits = st.q.replace(/\D/g, '');
    return customerList().filter((c) => !f || fold(c.name).includes(f) || fold(c.title).includes(f) || (digits.length >= 3 && String(c.phone || '').replace(/\D/g, '').includes(digits)))
      .sort((a, b) => (b.lastTs || 0) - (a.lastTs || 0));
  };
  const amountNow = () => {
    if (pre) return opts.amount;
    return st.sel && st.sel.staff && !POS.staff && st.staffApply ? cartTotalWith(true) : posTotal();
  };
  let M = null;
  const draw = () => {
    const el = M.el;
    const L = list();
    if (st.idx >= L.length) st.idx = Math.max(0, L.length - 1);
    $('#cr-amt', el).textContent = money(amountNow());
    const box = $('#cr-list', el);
    box.innerHTML = L.length ? L.slice(0, 120).map((c, i) => `<div class="list-row click ${st.sel === c ? 'sel' : (st.idx === i && !st.sel ? 'sel' : '')}" data-id="${c.id}">
        <span class="avatar">${esc(initials(c.name))}</span>
        <div class="grow"><div class="t1">${esc(c.name)}${c.staff ? ' <span class="pill staff">Personel</span>' : ''}</div><div class="t2">${c.title ? esc(c.title) + ', ' : ''}${c.phone ? esc(fmtPhone(c.phone)) + ', ' : ''}son işlem ${esc(agoText(c.lastTs))}</div></div>
        <div style="text-align:right"><div class="amt ${c.bal > 0 ? 'red' : ''}">${money(c.bal)}</div>${c.limit > 0 ? `<div class="t2">limit ${money0(c.limit)}</div>` : ''}</div>
      </div>`).join('')
      : `<div class="empty" style="padding:24px">${ic('users')}<b>${st.q ? 'Müşteri bulunamadı' : 'Henüz veresiye müşterisi yok'}</b><p>Yeni müşteri ekleyerek devam edin.</p></div>`;
    const info = $('#cr-info', el);
    const okb = $('#cr-ok', el);
    if (st.sel) {
      const amt = amountNow();
      const nb = r2(st.sel.bal + amt);
      const over = st.sel.limit > 0 && nb > st.sel.limit;
      const canStaff = !pre && st.sel.staff && !POS.staff && cartTotalWith(true) < posTotal() - 0.004;
      info.innerHTML = `${canStaff ? `<label class="switch note" style="margin-bottom:8px"><input type="checkbox" id="cr-staff" ${st.staffApply ? 'checked' : ''}><span class="track"></span><span class="st"><b>Personel fiyatı uygula</b><small>Bu müşteri personel. Normal fiyatla ${money(posTotal())}, personel fiyatıyla ${money(cartTotalWith(true))}.</small></span></label>` : ''}
        <div class="note ${over ? 'warn' : 'info'}"><b>${esc(st.sel.name)}</b>: mevcut borç ${money(st.sel.bal)}, bu satışla <b>${money(nb)}</b> olacak.${over ? `<br>${ic('alert', 'sm')} Limit (${money(st.sel.limit)}) aşılıyor.` : ''}</div>`;
      const cs = $('#cr-staff', el);
      if (cs) cs.onchange = () => { st.staffApply = cs.checked; draw(); };
      okb.disabled = false;
    } else { info.innerHTML = ''; okb.disabled = true; }
  };
  const confirmIt = () => {
    if (!st.sel) return;
    M.close(true);
    if (pre) { posFinish('parcali', { pays: { ...pre, veresiye: opts.amount }, cid: st.sel.id, given: pre.nakit || null }); return; }
    if (st.sel.staff && !POS.staff && st.staffApply && cartTotalWith(true) < posTotal() - 0.004) posSetStaff(true);
    posFinish('veresiye', { cid: st.sel.id });
  };
  M = openModal({
    title: pre ? 'Kalanı veresiyeye yaz' : 'Veresiyeye yaz', size: 'md',
    body: `${pre ? `<div class="note info" style="margin-bottom:12px">${money(pre.nakit || 0)} nakit alındı. Kalan tutar seçeceğiniz müşterinin hesabına yazılacak.</div>` : ''}
      <div class="sum-line"><span class="muted strong">${pre ? 'Veresiyeye yazılacak' : 'Tutar'}</span><span class="big-amt" id="cr-amt">${money(pre ? opts.amount : posTotal())}</span></div>
      <div class="inp-wrap mt">${ic('search', 'prefix-ic')}<input class="inp has-ic" id="cr-q" placeholder="Müşteri ara (ad, ünvan ya da telefon)" autocomplete="off" autofocus></div>
      <div class="picker-list mt-s" id="cr-list"></div>
      <div id="cr-info" class="mt-s"></div>`,
    foot: `<div class="left"><button class="btn" id="cr-new">${ic('userplus')} Yeni müşteri</button></div><button class="btn" data-close>Vazgeç</button><button class="btn primary" id="cr-ok" disabled>${ic('book')} Veresiyeye yaz</button>`,
    onMount(el) {
      const q = $('#cr-q', el);
      q.addEventListener('input', () => { st.q = q.value; st.idx = 0; st.sel = null; draw(); });
      $('#cr-list', el).addEventListener('click', (e) => {
        const r = e.target.closest('[data-id]'); if (!r) return;
        st.sel = S.customers.get(r.dataset.id); st.staffApply = true; draw();
      });
      $('#cr-list', el).addEventListener('dblclick', (e) => {
        const r = e.target.closest('[data-id]'); if (!r) return;
        st.sel = S.customers.get(r.dataset.id); confirmIt();
      });
      $('#cr-ok', el).onclick = confirmIt;
      $('#cr-new', el).onclick = () => openCustomerForm({ name: titleTR(st.q && !/\d{3}/.test(st.q) ? st.q : '') }, { onSaved: (c) => { st.sel = c; st.q = ''; q.value = ''; draw(); } });
    },
    onKey(e) {
      if (topModal() !== M) return false;
      const L = list();
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        e.preventDefault();
        if (!L.length) return true;
        const cur = st.sel ? L.indexOf(st.sel) : st.idx;
        st.idx = clamp(cur + (e.key === 'ArrowDown' ? 1 : -1), 0, L.length - 1);
        st.sel = L[st.idx];
        draw();
        const r = M.el.querySelector('.list-row.sel'); if (r) r.scrollIntoView({ block: 'nearest' });
        return true;
      }
      if (e.key === 'Enter') {
        if (e.target && e.target.type === 'checkbox') return false;
        e.preventDefault();
        if (!st.sel && L.length) { st.sel = L[st.idx] || L[0]; draw(); return true; }
        confirmIt();
        return true;
      }
      return false;
    }
  });
  draw();
}

    title: 'Fiyatı değiştir', label: `${line.n} için birim fiyat`, value: moneyIn(line.p), type: 'money',
    hint: 'Değişiklik yalnızca bu satış için geçerlidir; ürün kartındaki fiyat değişmez.',
