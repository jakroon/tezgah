function posDisc() {
  const sub = posSub();
  if (!sub) { toast('Önce sepete ürün ekleyin.', { type: 'info' }); return; }
  let mode = 'tl';
  openModal({
    title: 'İndirim', size: 'sm',
    body: `<div class="seg block" id="ds-m"><button data-m="tl" class="on">Tutar (₺)</button><button data-m="pct">Yüzde (%)</button></div>
      <div class="field mt"><label for="ds-v" id="ds-l">İndirim tutarı</label><input class="inp num" id="ds-v" inputmode="decimal" value="${POS.disc ? moneyIn(POS.disc) : ''}" placeholder="0" autofocus></div>
      <div class="sum-line mt"><span class="muted strong">Yeni toplam</span><span class="big-amt" id="ds-t" style="font-size:30px">${money(posTotal())}</span></div>`,
    foot: `${POS.disc ? '<div class="left"><button class="btn danger" id="ds-rm">İndirimi kaldır</button></div>' : ''}<button class="btn" data-close>Vazgeç</button><button class="btn primary" data-enter id="ds-ok">Uygula</button>`,
    onMount(el, m) {
      const v = $('#ds-v', el);
      const calc = () => { const x = parseNum(v.value) || 0; return clamp(mode === 'pct' ? r2(sub * x / 100) : r2(x), 0, sub); };
      const upd = () => { $('#ds-t', el).textContent = money(sub - calc()); };
      v.addEventListener('input', upd);
      $('#ds-m', el).onclick = (e) => {
        const b = e.target.closest('[data-m]'); if (!b) return;
        mode = b.dataset.m;
        $$('#ds-m button', el).forEach((x) => x.classList.toggle('on', x === b));
        $('#ds-l', el).textContent = mode === 'pct' ? 'İndirim yüzdesi' : 'İndirim tutarı';
        v.value = ''; v.focus(); upd();
      };
      $('#ds-ok', el).onclick = () => { POS.disc = calc(); m.close(true); posRenderCart(); };
      const rm = $('#ds-rm', el); if (rm) rm.onclick = () => { POS.disc = 0; m.close(true); posRenderCart(); };
    }
  });
}
function posHold() {
  if (MODALS.length) return;
  if (!POS.cart.length) { toast('Bekletilecek ürün yok', { type: 'info' }); return; }
  if (POS.held.length >= 6) { toast('En fazla 6 satış bekletilebilir', { type: 'warn' }); return; }
  POS.held.push({ cart: POS.cart, disc: POS.disc, staff: POS.staff, ts: Date.now() });
  POS.cart = []; POS.disc = 0; POS.staff = false;
  posRenderStaff(); posRenderCart(); posRenderHeld(); posRenderTiles();
  toast('Satış bekletmeye alındı. Üstteki düğmeyle geri getirebilirsiniz.', { type: 'info' });
  posFocus();
}
function posResume(i) {
  const h = POS.held.splice(i, 1)[0];
  if (!h) return;
  if (POS.cart.length) POS.held.push({ cart: POS.cart, disc: POS.disc, staff: POS.staff, ts: Date.now() });
  POS.cart = h.cart; POS.disc = h.disc; POS.staff = !!h.staff;
  posRenderStaff(); posRenderCart(); posRenderHeld(); posRenderTiles(); posFocus();
}
function posClear() {
  if (MODALS.length || !POS.cart.length) return;
  const snap = { cart: POS.cart, disc: POS.disc, staff: POS.staff };
  POS.cart = []; POS.disc = 0; POS.staff = false;
  posRenderStaff(); posRenderCart(); posRenderTiles();
  toast('Sepet temizlendi', { type: 'info', action: { label: 'Geri al', fn: () => { POS.cart = snap.cart; POS.disc = snap.disc; POS.staff = snap.staff; posRenderStaff(); posRenderCart(); posRenderTiles(); } } });
  posFocus();
}
async function posUndoConfirm(id) {
  const s = await getSale(id);
  if (!s) return;
  const ok = await confirmBox({
    title: `Satış #${s.no} geri alınsın mı?`,
    message: `${esc(itemsSummary(s.items, 120))}<br><b>${money(s.total)}</b>, ${esc(payLabel(s))}. Ürünler stoğa geri eklenir${saleCredit(s) > 0 ? ', müşterinin borcundan düşülür' : ''}.`,
    ok: 'Satışı geri al', danger: true
  });
  if (!ok) return;
  if (await voidSale(id, 'Kasadan geri alındı')) {
    const snap = POS.lastSnap;
    if (snap && snap.id === id && !POS.cart.length && current && current.name === 'satis') {
      POS.cart = snap.cart; POS.disc = snap.disc; POS.staff = !!snap.staff; POS.lastSnap = null;
      posRenderStaff(); posRenderCart(); posRenderTiles(); posRenderLast();
      toast(`Satış #${s.no} geri alındı, ürünler sepete döndü. Doğru ödeme türüyle tekrar tamamlayabilirsiniz.`, { type: 'info', ms: 5000 });
    } else toast(`Satış #${s.no} geri alındı`);
  }
}

    }
  });
  draw();
}

/* ============================================================
   Ürünler: liste, ürün kartı, sayım, fire, geçmiş, toplu fiyat,
   marka / kategori, Excel ile içe / dışa aktarma
   ============================================================ */
const PS = { q: '', brand: '', cat: '', f: 'all', sort: 'name', dir: 1, sel: new Set(), limit: 300, lastCat: '' };

function productFilterCounts(list) {
  const sktIds = new Set(sktAlerts().map((l) => l.pid));
  return {
    all: list.filter((p) => p.active !== false).length,
    low: list.filter((p) => p.active !== false && ['low', 'out', 'neg'].includes(stockState(p))).length,
    skt: list.filter((p) => p.active !== false && sktIds.has(p.id)).length,
    fav: list.filter((p) => p.active !== false && p.fav).length,
    off: list.filter((p) => p.active === false).length,
    sktIds
  };
}
const brandMatch = (p, b) => (b === NONE_KEY ? !p.brand : (p.brand || '') === b);
function productRows() {
  const all = productList(true);
  const C = productFilterCounts(all);
  let list = all.filter((p) => PS.f === 'off' ? p.active === false : p.active !== false);
  if (PS.f === 'low') list = list.filter((p) => ['low', 'out', 'neg'].includes(stockState(p)));
  if (PS.f === 'skt') list = list.filter((p) => C.sktIds.has(p.id));
  if (PS.f === 'fav') list = list.filter((p) => p.fav);
  if (PS.brand) list = list.filter((p) => brandMatch(p, PS.brand));
  if (PS.cat) list = list.filter((p) => p.cat === PS.cat);
  if (PS.q.trim()) list = searchProducts(PS.q, list);
  else {
    const key = {
      name: (p) => fold(p.name), brand: (p) => (p.brand ? '0' + fold(p.brand) : '1') + fold(p.cat) + fold(p.name), stock: (p) => (p.track === false ? Infinity : p.stock),
      buy: (p) => p.buy || 0, sell: (p) => p.sell || 0, margin: (p) => margin(p) ?? -1,
      skt: (p) => { const l = lotsOf(p.id)[0]; return l ? l.skt : '9999'; }
    }[PS.sort] || ((p) => fold(p.name));
    list.sort((a, b) => { const x = key(a), y = key(b); return (x < y ? -1 : x > y ? 1 : 0) * PS.dir; });
  }
  return { list, C };
}

  mount(el) {
    const prods = productList();

    const ms = prods.map(margin).filter((m) => m !== null);
    const avgM = ms.length ? sum(ms) / ms.length : null;
    const noCost = prods.filter((p) => !(p.buy > 0)).length;
    const brands = brandList();
    const hasNoBrand = prods.some((p) => !p.brand);
    if (PS.brand && PS.brand !== NONE_KEY && !brands.includes(PS.brand)) PS.brand = '';
    const catsIn = () => {
      const pool = PS.brand ? productList(true).filter((p) => brandMatch(p, PS.brand)) : productList(true);
      const set = new Set(pool.map((p) => p.cat));
      return catList().filter((c) => set.has(c));
    };
    el.innerHTML = `<div class="page">

        <div class="stat"><div class="k">Stok değeri (alış)</div><div class="v">${money(valBuy)}</div><div class="d">${noCost ? `<span class="amber">${noCost} üründe alış fiyatı yok</span>` : 'Elimizdeki malın maliyeti'}</div></div>

        <div class="stat"><div class="k">Ortalama kâr marjı</div><div class="v">${avgM === null ? '—' : pct(avgM, 1)}</div><div class="d">Satış fiyatı üzerinden</div></div>
      </div>
      <div class="toolbar mt">
        <div class="inp-wrap grow">${ic('search', 'prefix-ic')}<input id="pr-q" class="inp has-ic" placeholder="Ürün adı, marka ya da barkod" value="${esc(PS.q)}" autocomplete="off"></div>

        <select id="pr-cat" class="inp" style="width:auto;min-width:170px" aria-label="Kategori"></select>

      <div id="pr-selbar"></div>
      <div class="panel flush"><div class="tbl-wrap" id="pr-table"></div></div>
    </div>`;
    const q = $('#pr-q', el);
    const drawCatSel = () => {
      const cs = catsIn();
      if (PS.cat && !cs.includes(PS.cat)) PS.cat = '';
      $('#pr-cat', el).innerHTML = `<option value="">Tüm kategoriler</option>` + cs.map((c) => `<option ${PS.cat === c ? 'selected' : ''}>${esc(c)}</option>`).join('');
    };
    q.addEventListener('input', debounce(() => { PS.q = q.value; PS.limit = 300; drawTable(); }, 120));
    $('#pr-brand', el).onchange = (e) => { PS.brand = e.target.value; drawCatSel(); drawTable(); };
    $('#pr-cat', el).onchange = (e) => { PS.cat = e.target.value; drawTable(); };
    el.addEventListener('click', (e) => {
      const f = e.target.closest('[data-f]');
      if (f) { PS.f = f.dataset.f; PS.sel.clear(); drawTable(); return; }
      const th = e.target.closest('th[data-sort]');
      if (th) { const k = th.dataset.sort; if (PS.sort === k) PS.dir *= -1; else { PS.sort = k; PS.dir = 1; } drawTable(); return; }
      const a = e.target.closest('[data-a]');
      if (a) {
        const p = a.dataset.id ? S.products.get(a.dataset.id) : null;
        switch (a.dataset.a) {
          case 'new': openProductForm(PS.brand && PS.brand !== NONE_KEY ? { brand: PS.brand, cat: PS.cat || undefined } : (PS.cat ? { cat: PS.cat } : {})); break;
          case 'bulk': bulkPriceModal(PS.sel.size ? [...PS.sel] : null); break;
          case 'excel': openMenu(a, [
            { label: 'Ürün listesini Excel\'e aktar', icon: 'download', fn: exportProductsXlsx },
            { label: 'Excel\'den ürün yükle', icon: 'upload', fn: importProductsModal },
            '-',
            { label: 'Boş şablon indir', icon: 'sheet', fn: downloadProductTemplate }
          ]); break;
          case 'more': openMenu(a, [
            { label: 'Düzenle', icon: 'edit', fn: () => openProductForm(p) },
            { label: 'Stok sayımı', icon: 'clipboard', fn: () => countModal(p) },
            { label: 'Fire / imha', icon: 'ban', fn: () => wasteModal(p) },
            { label: 'Hareketler ve partiler', icon: 'history', fn: () => productHistoryModal(p) },
            '-',
            { label: p.fav ? 'Hızlı butondan çıkar' : 'Kasada hızlı buton yap', icon: 'star', fn: () => { p.fav = !p.fav; upsertProduct(p); } },
            p.active === false ? { label: 'Yeniden satışa aç', icon: 'refresh', fn: () => { p.active = true; upsertProduct(p); toast(`${p.name} yeniden satışta`); } }
              : { label: 'Satıştan kaldır', icon: 'ban', fn: () => { p.active = false; upsertProduct(p); toast(`${p.name} satıştan kaldırıldı`, { action: { label: 'Geri al', fn: () => { p.active = true; upsertProduct(p); } } }); } }
          ]); break;
          case 'more-rows': PS.limit += 500; drawTable(); break;
          case 'sel-fav': [...PS.sel].forEach((id) => { const x = S.products.get(id); if (x) { x.fav = true; upsertProduct(x); } }); toast('Seçili ürünler hızlı buton yapıldı'); break;
          case 'sel-cat': bulkCategory([...PS.sel]); break;
          case 'sel-brand': bulkBrand([...PS.sel]); break;
          case 'sel-clear': PS.sel.clear(); drawTable(); break;
          default: break;
        }
        return;
      }
      if (e.target.closest('input[type=checkbox]')) return;
      const row = e.target.closest('tr[data-id]');
      if (row) openProductForm(S.products.get(row.dataset.id));
    });
    el.addEventListener('change', (e) => {
      const cb = e.target.closest('input[type=checkbox]');
      if (!cb) return;
      if (cb.dataset.all !== undefined) { const { list } = productRows(); list.slice(0, PS.limit).forEach((p) => cb.checked ? PS.sel.add(p.id) : PS.sel.delete(p.id)); drawTable(); return; }
      if (cb.dataset.id) { cb.checked ? PS.sel.add(cb.dataset.id) : PS.sel.delete(cb.dataset.id); drawSelbar(); }
    });
    const drawSelbar = () => {
      const b = $('#pr-selbar', el);
      if (!b) return;
      b.innerHTML = PS.sel.size ? `<div class="note info" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px"><b>${plural(PS.sel.size, 'ürün')} seçildi</b>
        <button class="btn sm" data-a="sel-brand">${ic('tag', 'sm')} Marka ata</button><button class="btn sm" data-a="sel-cat">${ic('layers', 'sm')} Kategori değiştir</button><button class="btn sm" data-a="bulk">${ic('percent', 'sm')} Toplu fiyat</button><button class="btn sm" data-a="sel-fav">${ic('star', 'sm')} Hızlı buton yap</button><button class="btn ghost sm" data-a="sel-clear">Seçimi kaldır</button></div>` : '';
    };
    const drawTable = () => {
      const { list, C } = productRows();
      $('#pr-f', el).innerHTML = [
        ['all', 'Tümü', C.all, ''], ['low', 'Kritik stok', C.low, 'warn'], ['skt', 'SKT uyarısı', C.skt, 'bad'], ['fav', 'Hızlı butonlar', C.fav, ''], ['off', 'Satışta değil', C.off, '']
      ].filter(([k, , n]) => k === 'all' || n || PS.f === k).map(([k, l, n, cls]) => `<button class="chip ${cls} ${PS.f === k ? 'on' : ''}" data-f="${k}">${l} <span class="n">${n}</span></button>`).join('');
      drawSelbar();
      const box = $('#pr-table', el);
      if (!list.length) {
        box.innerHTML = S.products.size
          ? `<div class="empty">${ic('search')}<b>Bu filtreyle eşleşen ürün yok</b><p>Aramayı ya da filtreyi değiştirin.</p></div>`
          : `<div class="empty">${ic('box')}<b>Ürün listeniz boş</b><p>Ürünleri tek tek ekleyebilir ya da elinizdeki Excel listesini yükleyebilirsiniz. Kasada barkodu okutulan yeni ürün de buraya kaydedilir.</p><div style="display:flex;gap:8px;margin-top:6px"><button class="btn primary" data-a="new">${ic('plus')} Ürün ekle</button><button class="btn" data-a="excel">${ic('sheet')} Excel'den yükle</button></div></div>`;
        return;
      }
      const sh = (k, l, cls = '') => `<th class="sort ${cls}" data-sort="${k}">${l}${PS.sort === k && !PS.q ? ` <span class="arr">${PS.dir > 0 ? '↑' : '↓'}</span>` : ''}</th>`;
      const allSel = list.slice(0, PS.limit).every((p) => PS.sel.has(p.id));
      box.innerHTML = `<table class="tbl"><thead><tr><th class="w1"><input type="checkbox" data-all ${allSel ? 'checked' : ''} aria-label="Tümünü seç"></th>${sh('name', 'Ürün')}${sh('brand', 'Marka / kategori')}${sh('stock', 'Stok', 'r')}${sh('buy', 'Alış', 'r')}${sh('sell', 'Satış', 'r')}${sh('margin', 'Kâr', 'r')}${sh('skt', 'SKT')}<th class="w1"></th></tr></thead><tbody>
        ${list.slice(0, PS.limit).map((p) => {
          const st = stockState(p);
          const stPill = st === 'neg' ? `<span class="pill bad">${qtyFmt(p.stock)} ${esc(p.unit)}</span>` : st === 'out' ? `<span class="pill bad">Tükendi</span>` : st === 'low' ? `<span class="pill warn">${qtyFmt(p.stock)} ${esc(p.unit)}</span>` : st === 'none' ? '<span class="muted">takip yok</span>' : `${qtyFmt(p.stock)} <span class="muted">${esc(p.unit)}</span>`;
          const m = margin(p);
          const lot = p.skt ? lotsOf(p.id)[0] : null;
          const sk = lot ? sktState(lot.skt) : null;
          const skt = !p.skt ? '<span class="muted">—</span>' : !lot ? '<span class="muted">parti yok</span>' : `${fmtDate(fromKey(lot.skt))}${sk !== 'ok' ? ` <span class="pill ${sk === 'expired' ? 'bad' : 'warn'}">${sktLabel(lot.skt)}</span>` : ''}`;
          const sp = staffPriceOf(p);
          return `<tr class="click ${p.active === false ? 'void' : ''}" data-id="${p.id}">
            <td class="w1"><input type="checkbox" data-id="${p.id}" ${PS.sel.has(p.id) ? 'checked' : ''} aria-label="Seç"></td>
            <td><span class="nm">${esc(p.name)}</span>${p.fav ? ` <span title="Kasada hızlı buton" class="muted">${ic('star', 'sm')}</span>` : ''}<span class="sub-t tnum">${p.barcode ? esc(p.barcode) : 'barkodsuz'}</span></td>
            <td>${p.brand ? `<span class="strong">${esc(p.brand)}</span>` : `<span class="muted">${NO_BRAND}</span>`}<span class="sub-t">${esc(p.cat || '')}</span></td>
            <td class="r">${stPill}</td>
            <td class="r">${p.buy > 0 ? money(p.buy) : '<span class="amber">girilmedi</span>'}</td>
            <td class="r strong">${money(p.sell)}${sp !== p.sell ? `<span class="sub-t staff-t" title="Personel fiyatı">personel ${money(sp)}</span>` : ''}</td>
            <td class="r">${m === null ? '<span class="muted">—</span>' : `${pct(m)}<span class="sub-t">${money(p.sell - p.buy)}</span>`}</td>
            <td class="nowrap">${skt}</td>
            <td class="w1"><button class="icon-btn" data-a="more" data-id="${p.id}" aria-label="İşlemler" title="İşlemler">${ic('more')}</button></td></tr>`;
        }).join('')}</tbody></table>
        ${list.length > PS.limit ? `<div style="padding:12px;text-align:center"><button class="btn" data-a="more-rows">${NF0.format(list.length - PS.limit)} ürün daha göster</button></div>` : ''}`;
    };
    drawCatSel();
    drawTable();
  }
};

/* ---------- Ürün kartı (ekle / düzenle) ---------- */
function openProductForm(data, opts = {}) {
  const isNew = !data || !data.id;
  const p = Object.assign({ name: '', barcode: '', brand: '', cat: (PS.lastCat && catList().includes(PS.lastCat) ? PS.lastCat : S.settings.categories[0]) || 'Diğer', unit: 'adet', buy: null, sell: null, staffPrice: null, min: S.settings.minStockDefault, fav: false, track: true, skt: false, active: true }, data || {});
  const cats = [...new Set([...catList(), p.cat].filter(Boolean))];
  const sw = (id, on, title, desc) => `<label class="switch"><input type="checkbox" id="${id}" ${on ? 'checked' : ''}><span class="track"></span><span class="st"><b>${title}</b><small>${desc}</small></span></label>`;
  const sd = S.settings.staffDisc || 0;
  openModal({
    title: isNew ? 'Yeni ürün' : 'Ürünü düzenle', size: 'lg', sub: opts.sub || (isNew ? '' : esc(p.name)),
    body: `<div class="form">
      <div class="field"><label for="pf-name">Ürün adı<span class="req">*</span></label><input class="inp" id="pf-name" value="${esc(p.name)}" maxlength="80" placeholder="Örn. Ayran 300 ml" ${p.barcode && isNew ? 'autofocus' : ''}><span class="hint red" id="pf-name-e"></span></div>
      <div class="row3">
        <div class="field"><label for="pf-bc">Barkod</label><input class="inp tnum" id="pf-bc" value="${esc(p.barcode || '')}" placeholder="Okutun ya da yazın" maxlength="32" autocomplete="off" data-noenter><span class="hint" id="pf-bc-h">Barkodsuz ürünlerde boş bırakın.</span></div>
        <div class="field"><label for="pf-brand">Marka</label><input class="inp" id="pf-brand" value="${esc(p.brand || '')}" list="pf-brands" placeholder="Örn. Ülker" maxlength="40" autocomplete="off"><datalist id="pf-brands">${brandList().map((b) => `<option value="${esc(b)}">`).join('')}</datalist><span class="hint">Yeni marka yazarsanız listeye eklenir.</span></div>
        <div class="field"><label for="pf-cat">Kategori</label><select class="inp" id="pf-cat">${cats.map((c) => `<option ${c === p.cat ? 'selected' : ''}>${esc(c)}</option>`).join('')}<option value="__new">+ Yeni kategori…</option></select><span class="hint" id="pf-cat-h"></span></div>
      </div>
      <div class="row4">
        <div class="field"><label for="pf-buy">Alış fiyatı</label><div class="inp-wrap"><input class="inp num" id="pf-buy" inputmode="decimal" value="${p.buy != null ? moneyIn(p.buy) : ''}" placeholder="0,00"><span class="suffix">₺</span></div></div>
        <div class="field"><label for="pf-sell">Satış fiyatı<span class="req">*</span></label><div class="inp-wrap"><input class="inp num" id="pf-sell" inputmode="decimal" value="${p.sell != null ? moneyIn(p.sell) : ''}" placeholder="0,00"><span class="suffix">₺</span></div><span class="hint red" id="pf-sell-e"></span></div>
        <div class="field"><label for="pf-staff">Personel fiyatı</label><div class="inp-wrap"><input class="inp num" id="pf-staff" inputmode="decimal" value="${p.staffPrice > 0 ? moneyIn(p.staffPrice) : ''}" placeholder="${sd ? '%' + NFQ.format(sd) + ' indirimli' : 'Normal fiyat'}"><span class="suffix">₺</span></div><span class="hint" id="pf-staff-h"></span></div>
        <div class="field"><label for="pf-unit">Birim</label><select class="inp" id="pf-unit">${Object.keys(UNITS).map((u) => `<option value="${u}" ${u === p.unit ? 'selected' : ''}>${u}</option>`).join('')}</select></div>
      </div>
      <div class="note" id="pf-m"></div>
      <div class="row3">
        <div class="field">${isNew
          ? `<label for="pf-stock">Mevcut stok</label><input class="inp num" id="pf-stock" inputmode="decimal" placeholder="0"><span class="hint">Şu an rafta olan miktar</span>`
          : `<label>Mevcut stok</label><div style="display:flex;gap:8px;align-items:center;height:40px"><b class="tnum" style="font-size:17px">${p.track === false ? '—' : qtyFmt(p.stock) + ' ' + esc(p.unit)}</b>${p.track === false ? '' : `<button class="btn sm" type="button" id="pf-count">${ic('clipboard', 'sm')} Sayım</button>`}</div>`}</div>
        <div class="field"><label for="pf-min">Kritik stok seviyesi</label><input class="inp num" id="pf-min" inputmode="decimal" value="${qtyFmt(p.min ?? S.settings.minStockDefault)}"><span class="hint">Bu miktara inince uyarır</span></div>
        <div class="field ${isNew ? '' : 'hidden'}" id="pf-skt-f"><label for="pf-skt">Son kullanma tarihi</label><input class="inp" type="date" id="pf-skt" min="${todayKey()}"><span class="hint">Mevcut stoğun SKT'si</span></div>
      </div>
      <div class="panel" style="padding:4px 16px"><div class="divide">
        <div style="padding:12px 0">${sw('pf-fav', p.fav, 'Kasada hızlı buton olarak göster', 'Çay, simit, tost gibi sık satılan ya da barkodsuz ürünler için.')}</div>
        <div style="padding:12px 0">${sw('pf-track', p.track !== false, 'Stok takibi yap', 'Kendi hazırladığınız ürünlerde (çay, tost) kapatabilirsiniz.')}</div>
        <div style="padding:12px 0">${sw('pf-sktt', p.skt, 'Son kullanma tarihini takip et', 'Mal girişinde SKT sorulur, tarihi yaklaşınca uyarı verilir.')}</div>
        ${isNew ? '' : `<div style="padding:12px 0">${sw('pf-active', p.active !== false, 'Satışta', 'Kapatırsanız kasada görünmez; geçmiş kayıtlar korunur.')}</div>`}
      </div></div>
    </div>`,
    foot: `${isNew ? '' : `<div class="left"><button class="btn danger" id="pf-del">${ic('trash')} Sil</button></div>`}<button class="btn" data-close>Vazgeç</button><button class="btn primary" data-enter id="pf-ok">${ic('check')} Kaydet</button>`,
    onMount(el, m) {
      const g = (id) => $('#' + id, el);
      if (p.barcode && isNew) setTimeout(() => g('pf-name').focus(), 60);
      const updM = () => {
        const b = parseNum(g('pf-buy').value), s = parseNum(g('pf-sell').value), st = parseNum(g('pf-staff').value);
        const n = g('pf-m');
        const staffP = st > 0 ? st : (s > 0 && sd ? r2(s * (1 - sd / 100)) : s);
        g('pf-staff-h').textContent = s > 0 && !(st > 0) ? (sd ? `Boş: ${money(staffP)} uygulanır` : 'Boş: normal fiyat') : (st > 0 && s > 0 ? `${money(s - st)} indirim` : '');
        if (s > 0 && b > 0) {
          const k = s - b;
          const ks = staffP - b;
          n.className = 'note ' + (k < 0 ? 'bad' : 'info');
          n.innerHTML = k < 0 ? `${ic('alert', 'sm')} Satış fiyatı alış fiyatının altında: her satışta <b>${money(-k)}</b> zarar.`
            : `Ürün başına kâr <b>${money(k)}</b>, kâr marjı <b>${pct(k / s, 1)}</b>.${staffP !== s ? ` Personele satışta kâr ${ks >= 0 ? `<b>${money(ks)}</b>` : `<b class="red">−${money(-ks)}</b> (zarar)`}.` : ''}`;
        } else { n.className = 'note'; n.textContent = 'Alış ve satış fiyatını girdiğinizde kâr burada hesaplanır.'; }
      };
      ['pf-buy', 'pf-sell', 'pf-staff'].forEach((id) => g(id).addEventListener('input', updM)); updM();
      const updSkt = () => { const f = g('pf-skt-f'); if (f && isNew) f.classList.toggle('hidden', !g('pf-sktt').checked); };
      g('pf-sktt').addEventListener('change', updSkt); updSkt();
      // Markanın daha önce kullandığı kategorileri ipucu olarak göster
      const updBrandHint = () => {
        const b = fold(g('pf-brand').value.trim());
        const h = g('pf-cat-h');
        if (!b) { h.textContent = ''; return; }
        const used = [...new Set(productList(true).filter((x) => fold(x.brand) === b && x.id !== p.id).map((x) => x.cat))];
        h.textContent = used.length ? `Bu markada: ${used.slice(0, 4).join(', ')}` : '';
      };
      g('pf-brand').addEventListener('input', updBrandHint); updBrandHint();
      g('pf-bc').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); g('pf-name').value ? g('pf-sell').focus() : g('pf-name').focus(); } });
      g('pf-bc').addEventListener('input', () => {
        const ex = findByBarcode(g('pf-bc').value.trim());
        const h = g('pf-bc-h');
        if (ex && ex.id !== p.id) { h.className = 'hint red'; h.textContent = `Bu barkod "${ex.name}" ürününde kayıtlı.`; }
        else { h.className = 'hint'; h.textContent = 'Barkodsuz ürünlerde boş bırakın.'; }
      });
      g('pf-cat').addEventListener('change', async () => {
        if (g('pf-cat').value !== '__new') return;
        const v = await askBox({ title: 'Yeni kategori', label: 'Kategori adı', ok: 'Ekle', hint: 'Örn. İçecek, Çikolata, Sigara. Aynı kategori farklı markalarda kullanılabilir.', validate: (x) => titleTR(x) ? '' : 'Kategori adını yazın.' });
        const sel = g('pf-cat');
        if (v) {
          const name = capFirst(v);
          if (!S.settings.categories.some((c) => fold(c) === fold(name))) { S.settings.categories.push(name); saveSettings(); }
          const ex = S.settings.categories.find((c) => fold(c) === fold(name));
          if (![...sel.options].some((o) => o.value === ex)) { const o = document.createElement('option'); o.textContent = ex; sel.insertBefore(o, sel.lastElementChild); }
          sel.value = ex;
        } else sel.value = p.cat;
      });
      const cnt = g('pf-count'); if (cnt) cnt.onclick = () => countModal(S.products.get(p.id));
      const del = g('pf-del');
      if (del) del.onclick = async () => {
        const ok = await confirmBox({ title: 'Ürün silinsin mi?', message: `<b>${esc(p.name)}</b> ürün listesinden kalıcı olarak silinir. Geçmiş satış ve raporlardaki kayıtları korunur.<br><br>Sadece kasada görünmesin istiyorsanız "Satışta" seçeneğini kapatmanız yeterli.`, ok: 'Sil', danger: true });
        if (!ok) return;
        deleteProduct(p.id); m.close(true); toast(`${p.name} silindi`);
      };
      g('pf-ok').onclick = () => {
        const name = capFirst(g('pf-name').value);
        const barcode = g('pf-bc').value.trim();
        const sell = parseNum(g('pf-sell').value);
        const buy = parseNum(g('pf-buy').value);
        const staff = parseNum(g('pf-staff').value);
        let bad = false;
        g('pf-name-e').textContent = ''; g('pf-sell-e').textContent = '';
        if (!name) { g('pf-name-e').textContent = 'Ürün adını yazın.'; g('pf-name').classList.add('err'); bad = true; }
        if (!(sell > 0)) { g('pf-sell-e').textContent = 'Satış fiyatını yazın.'; g('pf-sell').classList.add('err'); bad = true; }
        const ex = barcode && findByBarcode(barcode);
        if (ex && ex.id !== p.id) { g('pf-bc').classList.add('err'); bad = true; }
        if (bad) { beep('err'); return; }
        const cat = g('pf-cat').value === '__new' ? p.cat : g('pf-cat').value;
        const out = {
          name, barcode, brand: g('pf-brand').value, cat, unit: g('pf-unit').value, buy: buy > 0 ? r2(buy) : 0, sell: r2(sell), staffPrice: staff > 0 ? r2(staff) : 0,
          min: Math.max(0, parseNum(g('pf-min').value) || 0), fav: g('pf-fav').checked, track: g('pf-track').checked, skt: g('pf-sktt').checked
        };
        if (!isNew) { out.id = p.id; out.active = g('pf-active').checked; }
        const opening = isNew ? (parseNum(g('pf-stock').value) || 0) : 0;
        const saved = upsertProduct(out, { openingStock: opening, openingSkt: isNew && out.skt ? g('pf-skt').value : '' });
        if (isNew) PS.lastCat = saved.cat;
        m.close(true);
        toast(isNew ? `${saved.name} eklendi` : `${saved.name} güncellendi`);
        if (opts.onSaved) opts.onSaved(saved);
      };
    }
  });
}

function bulkCategory(ids) {
  const cats = catList();
  openModal({
    title: 'Kategori değiştir', size: 'sm', sub: `${plural(ids.length, 'ürün')} seçili`,
    body: `<div class="field"><label for="bc-c">Yeni kategori</label><select class="inp" id="bc-c">${cats.map((c) => `<option>${esc(c)}</option>`).join('')}</select></div>`,
    foot: `<button class="btn" data-close>Vazgeç</button><button class="btn primary" data-enter id="bc-ok">Uygula</button>`,
    onMount(el, m) {
      $('#bc-ok', el).onclick = () => {
        const c = $('#bc-c', el).value;
        const ops = [];
        ids.forEach((id) => { const p = S.products.get(id); if (p) { p.cat = c; ops.push(putOp('products', p)); } });
        persist(ops); emit('data'); m.close(true); PS.sel.clear();
        toast(`${plural(ops.length, 'ürün')} "${c}" kategorisine taşındı`);
      };
    }
  });
}
function bulkBrand(ids) {
  openModal({
    title: 'Marka ata', size: 'sm', sub: `${plural(ids.length, 'ürün')} seçili`,
    body: `<div class="field"><label for="bb-b">Marka</label><input class="inp" id="bb-b" list="bb-list" placeholder="Marka adı" autocomplete="off" maxlength="40" autofocus><datalist id="bb-list">${brandList().map((b) => `<option value="${esc(b)}">`).join('')}</datalist><span class="hint">Boş bırakırsanız ürünler "${NO_BRAND}" olur.</span></div>`,
    foot: `<button class="btn" data-close>Vazgeç</button><button class="btn primary" data-enter id="bb-ok">Uygula</button>`,
    onMount(el, m) {
      $('#bb-ok', el).onclick = () => {
        const ops = [];
        const b = normBrand($('#bb-b', el).value, ops);
        ids.forEach((id) => { const p = S.products.get(id); if (p) { p.brand = b; ops.push(putOp('products', p)); } });

}

/* ---------- Sayım ---------- */
function countModal(p) {
  if (!p) return;
  openModal({
    title: 'Stok sayımı', size: 'sm', sub: esc(p.name),
    body: `<div class="sum-line"><span class="muted strong">Kayıtlı stok</span><b class="tnum" style="font-size:20px">${qtyFmt(p.stock)} ${esc(p.unit)}</b></div>
      <div class="field mt"><label for="ct-v">Rafta saydığınız miktar</label><input class="inp num" id="ct-v" inputmode="decimal" autofocus style="height:48px;font-size:20px"></div>
      <div class="note mt-s" id="ct-d">Saydığınız miktarı yazın; kayıt bu sayıya eşitlenir.</div>
      <div class="field mt"><label for="ct-n">Not</label><input class="inp" id="ct-n" placeholder="İsteğe bağlı"></div>`,
    foot: `<button class="btn" data-close>Vazgeç</button><button class="btn primary" data-enter id="ct-ok">Stoğu düzelt</button>`,
    onMount(el, m) {
      const v = $('#ct-v', el), d = $('#ct-d', el);
      v.addEventListener('input', () => {
        const x = parseNum(v.value);
        if (isNaN(x)) { d.className = 'note'; d.textContent = 'Saydığınız miktarı yazın; kayıt bu sayıya eşitlenir.'; return; }
        const diff = r3(x - p.stock);
        d.className = 'note ' + (diff < 0 ? 'warn' : diff > 0 ? 'info' : '');
        d.innerHTML = diff === 0 ? 'Kayıtla aynı, fark yok.' : `Fark: <b>${diff > 0 ? '+' : '−'}${qtyFmt(Math.abs(diff))} ${esc(p.unit)}</b> ${diff < 0 ? `(yaklaşık ${money(-diff * (p.buy || 0))} maliyet)` : ''}`;
      });
      $('#ct-ok', el).onclick = () => {
        const x = parseNum(v.value);
        if (isNaN(x) || x < 0) { v.classList.add('err'); return; }
        const diff = countStock(p.id, x, $('#ct-n', el).value.trim());
        m.close(true);
        toast(diff ? `${p.name} stoğu ${qtyFmt(x)} ${p.unit} olarak düzeltildi` : 'Stok kayıtla aynı');
      };
    }
  });
}

/* ---------- Fire / imha ---------- */
function wasteModal(p, lotId = null) {
  if (!p) return;
  const lots = p.skt ? lotsOf(p.id) : [];
  const lot = lotId ? lots.find((l) => l.id === lotId) : null;
  openModal({
    title: 'Fire / imha', size: 'sm', sub: esc(p.name),
    body: `<div class="form">
      <div class="field"><label for="ws-q">Miktar (${esc(p.unit)})</label><input class="inp num" id="ws-q" inputmode="decimal" value="${lot ? qtyFmt(lot.left) : ''}" autofocus></div>
      <div class="field"><label for="ws-r">Neden</label><select class="inp" id="ws-r">${WASTE_REASONS.map((r, i) => `<option ${lot && i === 0 ? 'selected' : ''}>${r}</option>`).join('')}</select></div>
      ${lots.length ? `<div class="field"><label for="ws-l">Hangi parti</label><select class="inp" id="ws-l"><option value="">En yakın SKT'den düş</option>${lots.map((l) => `<option value="${l.id}" ${lot && lot.id === l.id ? 'selected' : ''}>SKT ${fmtDate(fromKey(l.skt))}, kalan ${qtyFmt(l.left)} ${esc(p.unit)}</option>`).join('')}</select></div>` : ''}
      <div class="field"><label for="ws-n">Not</label><input class="inp" id="ws-n" placeholder="İsteğe bağlı"></div>
      <div class="note" id="ws-c">Fire, raporlarda kârdan düşülür.</div></div>`,
    foot: `<button class="btn" data-close>Vazgeç</button><button class="btn danger solid" data-enter id="ws-ok">Fire olarak düş</button>`,
    onMount(el, m) {
      const q = $('#ws-q', el);
      const upd = () => { const x = parseNum(q.value); $('#ws-c', el).innerHTML = x > 0 ? `Maliyeti yaklaşık <b>${money(x * (p.buy || 0))}</b>; raporlarda kârdan düşülür.` : 'Fire, raporlarda kârdan düşülür.'; };
      q.addEventListener('input', upd); upd();
      $('#ws-ok', el).onclick = () => {

        m.close(true);
        toast(`${qtyFmt(x)} ${p.unit} ${p.name} fire olarak düşüldü`);
      };
    }
  });
}

function bulkPriceModal(ids) {
  const st = { scope: ids ? 'sel' : '', mode: 'pct', value: '', target: 'sell', step: 0.5, staff: true };
  const prods = productList();
  const cats = [...new Set(prods.map((p) => p.cat))].sort((a, b) => a.localeCompare(b, 'tr'));
  const brands = brandList().filter((b) => prods.some((p) => p.brand === b));
  const targetProducts = () => {
    if (st.scope === 'sel') return ids.map((id) => S.products.get(id)).filter(Boolean);
    if (st.scope.startsWith('b:')) return prods.filter((p) => (p.brand || '') === st.scope.slice(2));
    if (st.scope.startsWith('c:')) return prods.filter((p) => p.cat === st.scope.slice(2));
    return prods;
  };
  let plan = [];
  openModal({
    title: 'Toplu fiyat güncelleme', size: 'lg', sub: 'Zam geldiğinde bir markanın, kategorinin ya da seçili ürünlerin fiyatını tek seferde güncelleyin.',
    body: `<div class="form">
      <div class="row2">
        <div class="field"><label for="bp-s">Hangi ürünler</label><select class="inp" id="bp-s">${ids ? `<option value="sel">Seçili ${ids.length} ürün</option>` : ''}<option value="">Tüm ürünler</option>
          ${brands.length ? `<optgroup label="Marka">${brands.map((b) => `<option value="b:${esc(b)}">${esc(b)}</option>`).join('')}</optgroup>` : ''}
          <optgroup label="Kategori">${cats.map((c) => `<option value="c:${esc(c)}">${esc(c)}</option>`).join('')}</optgroup></select></div>
        <div class="field"><label>Değişecek fiyat</label><div class="seg block" id="bp-t"><button data-v="sell" class="on">Satış</button><button data-v="buy">Alış</button><button data-v="both">İkisi de</button></div></div>
      </div>
      <div class="row3">
        <div class="field"><label>Değişim türü</label><div class="seg block" id="bp-m"><button data-v="pct" class="on">Yüzde</button><button data-v="amt">Tutar</button></div></div>
        <div class="field"><label for="bp-v" id="bp-vl">Artış oranı (%)</label><input class="inp num" id="bp-v" inputmode="decimal" placeholder="Örn. 10 ya da -5" autofocus></div>
        <div class="field"><label for="bp-r">Yuvarlama</label><select class="inp" id="bp-r"><option value="0">Yuvarlama yok</option><option value="0.25">0,25 ₺'ye yukarı</option><option value="0.5" selected>0,50 ₺'ye yukarı</option><option value="1">1 ₺'ye yukarı</option><option value="5">5 ₺'ye yukarı</option></select></div>
      </div>
      <label class="switch" id="bp-staff-w"><input type="checkbox" id="bp-staff" checked><span class="track"></span><span class="st"><b>Personel fiyatları da aynı oranda değişsin</b><small>Personel fiyatı ayrıca girilmiş ürünler için. Diğerlerinde personel fiyatı zaten satış fiyatından hesaplanır.</small></span></label>
      <div id="bp-prev"></div></div>`,
    foot: `<button class="btn" data-close>Vazgeç</button><button class="btn primary" id="bp-ok" disabled>Fiyatları güncelle</button>`,
    onMount(el, m) {
      const draw = () => {
        st.value = parseNum($('#bp-v', el).value);
        $('#bp-staff-w', el).classList.toggle('hidden', st.target === 'buy');
        const box = $('#bp-prev', el);
        if (isNaN(st.value) || !st.value) { box.innerHTML = `<div class="note">Oranı ya da tutarı yazın; değişecek fiyatlar burada önizlenir.</div>`; $('#bp-ok', el).disabled = true; plan = []; return; }
        plan = bulkPricePlan(targetProducts(), st);
        const showStaff = st.target !== 'buy' && st.staff && plan.some((x) => x.newStaff !== x.oldStaff);
        $('#bp-ok', el).disabled = !plan.length;
        $('#bp-ok', el).textContent = plan.length ? `${plural(plan.length, 'ürünün')} fiyatını güncelle` : 'Fiyatları güncelle';
        box.innerHTML = plan.length ? `<div class="panel flush"><div class="tbl-wrap" style="max-height:290px"><table class="tbl"><thead><tr><th>Ürün</th>${st.target !== 'buy' ? '<th class="r">Satış</th><th class="r">Yeni satış</th>' : ''}${showStaff ? '<th class="r">Yeni personel</th>' : ''}${st.target !== 'sell' ? '<th class="r">Alış</th><th class="r">Yeni alış</th>' : ''}</tr></thead><tbody>
          ${plan.slice(0, 150).map((x) => `<tr><td>${esc(x.p.name)}${x.p.brand ? `<span class="sub-t">${esc(x.p.brand)}</span>` : ''}</td>${st.target !== 'buy' ? `<td class="r muted">${money(x.oldSell)}</td><td class="r strong">${money(x.newSell)}</td>` : ''}${showStaff ? `<td class="r">${x.newStaff !== x.oldStaff ? money(x.newStaff) : '<span class="muted">—</span>'}</td>` : ''}${st.target !== 'sell' ? `<td class="r muted">${money(x.oldBuy)}</td><td class="r strong">${money(x.newBuy)}</td>` : ''}</tr>`).join('')}
          </tbody></table></div></div>${plan.length > 150 ? `<p class="muted mt-s">…ve ${plan.length - 150} ürün daha</p>` : ''}` : `<div class="note">Bu seçimle değişecek fiyat yok.</div>`;
      };
      const seg = (id, key) => $(id, el).addEventListener('click', (e) => {
        const b = e.target.closest('[data-v]'); if (!b) return;
        st[key] = b.dataset.v; $$(id + ' button', el).forEach((x) => x.classList.toggle('on', x === b));
        if (key === 'mode') $('#bp-vl', el).textContent = st.mode === 'pct' ? 'Artış oranı (%)' : 'Artış tutarı (₺)';
        draw();
      });
      seg('#bp-t', 'target'); seg('#bp-m', 'mode');
      $('#bp-s', el).onchange = (e) => { st.scope = e.target.value; draw(); };
      $('#bp-r', el).onchange = (e) => { st.step = +e.target.value; draw(); };
      $('#bp-staff', el).onchange = (e) => { st.staff = e.target.checked; draw(); };
      $('#bp-v', el).addEventListener('input', draw);
      $('#bp-ok', el).onclick = async () => {
        if (!plan.length) return;
        applyBulkPrice(plan);
        m.close(true); PS.sel.clear();
        toast(`${plural(plan.length, 'ürünün')} fiyatı güncellendi`);
      };
      draw();
    }
  });
}

const PRODUCT_COLS = ['Barkod', 'Ürün adı', 'Marka', 'Kategori', 'Birim', 'Alış fiyatı', 'Satış fiyatı', 'Personel fiyatı', 'Stok', 'Kritik stok', 'Hızlı buton', 'SKT takibi'];
const PRODUCT_SHEET = { money: [5, 6, 7], text: [0], widths: [16, 32, 16, 20, 8, 12, 12, 14, 9, 11, 11, 10] };
function exportProductsXlsx() {
  const rows = [PRODUCT_COLS];
  productList(true).forEach((p) => rows.push([p.barcode || '', p.name, p.brand || '', p.cat || '', p.unit || 'adet', p.buy || 0, p.sell || 0, p.staffPrice || '', p.track === false ? '' : p.stock, p.min ?? '', p.fav ? 'Evet' : '', p.skt ? 'Evet' : '']));
  const blob = XLSX.build([{ name: 'Ürünler', rows, ...PRODUCT_SHEET }]);

function downloadProductTemplate() {
  const rows = [PRODUCT_COLS, ['8690000000001', 'Örnek ürün 500 ml', 'Örnek Marka', S.settings.categories[0] || 'İçecek', 'adet', 12.5, 20, 18, 24, 5, '', '']];
  downloadBlob(XLSX.build([{ name: 'Ürünler', rows, ...PRODUCT_SHEET }]), 'tezgah-urun-sablonu.xlsx');
}
function mapProductHeader(h) {
  const f = fold(h).replace(/[^a-z0-9 ]/g, ' ').trim();
  if (!f) return null;
  if (f.includes('barkod') || f.includes('barcode') || f === 'ean') return 'barcode';
  if (f.includes('personel')) return 'staff';
  if (f.includes('marka') || f.includes('brand') || f.includes('firma') || f.includes('uretici')) return 'brand';
  if (f.includes('alis') || f.includes('maliyet') || f.includes('gelis')) return 'buy';
  if (f.includes('satis') || f.includes('fiyat') || f.includes('etiket')) return 'sell';
  if (f.includes('kategori') || f.includes('grup') || f.includes('reyon')) return 'cat';
  if (f.includes('birim')) return 'unit';
  if (f.includes('kritik') || f.startsWith('min')) return 'min';
  if (f.includes('hizli') || f.includes('favori')) return 'fav';
  if (f.includes('skt') || f.includes('son kullanma')) return 'skt';
  if (f.includes('stok') || f.includes('miktar') || f === 'adet') return 'stock';
  if (f.includes('urun') || f.includes('adi') || f === 'ad' || f.includes('isim') || f.includes('name') || f.includes('aciklama')) return 'name';
  return null;
}
function importProductsModal() {

    title: 'Excel\'den ürün yükle', size: 'lg',
    sub: 'Elinizdeki ürün listesini (.xlsx ya da .csv) yükleyin. İlk satırda sütun başlıkları olmalı.',

    foot: `<button class="btn" data-close>Vazgeç</button><button class="btn primary" id="im-ok" disabled>Ürünleri yükle</button>`,
    onMount(el, m) {
      $('#im-tpl', el).onclick = downloadProductTemplate;

            <div style="padding:12px 0"><label class="switch"><input type="checkbox" id="im-stk" ${cols.includes('stock') ? '' : 'disabled'}><span class="track"></span><span class="st"><b>Kayıtlı ürünlerin stoğunu dosyadakiyle değiştir</b><small>${cols.includes('stock') ? 'Yeni ürünlerin stoğu her durumda dosyadan alınır.' : 'Dosyada stok sütunu yok.'}</small></span></label></div>

          <div class="panel flush"><div class="tbl-wrap" style="max-height:220px"><table class="tbl"><thead><tr><th>Barkod</th><th>Ürün adı</th><th>Marka</th><th>Kategori</th><th class="r">Alış</th><th class="r">Satış</th><th class="r">Stok</th></tr></thead><tbody>

        if (!table.length) { toast('Dosyada satır bulunamadı', { type: 'warn' }); return; }

        const map = table[hi].map((h) => mapProductHeader(String(h || '')));
        const cols = map.filter(Boolean);
        if (!cols.includes('name')) { toast('"Ürün adı" sütunu bulunamadı.', { type: 'err' }); return; }
        const rows = [];
        const seen = new Set();
        for (const r of table.slice(hi + 1)) {
          const o = {};
          map.forEach((k, i) => { if (k && o[k] === undefined) o[k] = r[i]; });
          const name = titleTR(o.name);
          if (!name && !o.barcode) continue;
          const barcode = String(o.barcode ?? '').replace(/\.0+$/, '').trim();
          const row = {
            name, barcode, brand: titleTR(o.brand), cat: titleTR(o.cat) || '', unit: (UNITS[fold(o.unit || '').trim()] || 'adet'),
            buy: parseNum(o.buy), sell: parseNum(o.sell), staff: parseNum(o.staff), stock: parseNum(o.stock), min: parseNum(o.min),
            fav: /^(e|evet|x|1|var|true)/i.test(String(o.fav || '').trim()), skt: /^(e|evet|x|1|var|true)/i.test(String(o.skt || '').trim())
          };
          const key = barcode || fold(name);
          if (seen.has(key)) continue;
          seen.add(key);
          row.match = (barcode && findByBarcode(barcode)) || productList(true).find((p) => fold(p.name) === fold(name)) || null;
          row.ok = !!name && (row.sell > 0 || !!row.match);
          rows.push(row);
        }
        parsed = { rows, cols, fresh: rows.filter((r) => r.ok && !r.match).length, upd: rows.filter((r) => r.ok && r.match).length, bad: rows.filter((r) => !r.ok).length };
        show();
      };
      $('#im-ok', el).onclick = () => {
        if (!parsed) return;
        const doUpd = $('#im-upd', el).checked, doStk = $('#im-stk', el) && $('#im-stk', el).checked;
        const ops = [];
        const now = Date.now();
        let nNew = 0, nUpd = 0;
        for (const r of parsed.rows) {
          if (!r.ok) continue;
          if (r.cat && !S.settings.categories.some((c) => fold(c) === fold(r.cat))) S.settings.categories.push(r.cat);
          if (r.cat) r.cat = S.settings.categories.find((c) => fold(c) === fold(r.cat)) || r.cat;
          if (r.brand) r.brand = normBrand(r.brand);
          if (r.match) {
            if (!doUpd && !doStk) continue;
            const p = r.match;
            if (doUpd) {
              if (r.name) p.name = r.name;
              if (r.barcode && !findByBarcode(r.barcode)) { if (p.barcode) S.byBarcode.delete(p.barcode); p.barcode = r.barcode; S.byBarcode.set(r.barcode, p.id); }
              if (r.cat) p.cat = r.cat;
              if (r.brand) p.brand = r.brand;
              if (r.buy > 0) p.buy = r2(r.buy);
              if (r.sell > 0) p.sell = r2(r.sell);
              if (r.staff > 0) p.staffPrice = r2(r.staff);
              if (r.min >= 0) p.min = r.min;
            }
            if (doStk && !isNaN(r.stock) && p.track !== false) {
              const diff = r3(r.stock - p.stock);
              if (diff) { p.stock = r3(r.stock); const mv = { id: uid(), ts: now, pid: p.id, n: p.name, type: 'count', q: diff, note: 'Excel ile güncellendi' }; S.moves.push(mv); ops.push(putOp('moves', mv)); }
            }
            p.updatedAt = now; ops.push(putOp('products', p)); nUpd++;
          } else {
            const p = { id: uid(), name: r.name, barcode: r.barcode, brand: r.brand || '', cat: r.cat || S.settings.categories[0] || 'Diğer', unit: r.unit, buy: r.buy > 0 ? r2(r.buy) : 0, sell: r2(r.sell), staffPrice: r.staff > 0 ? r2(r.staff) : 0, stock: isNaN(r.stock) ? 0 : r3(r.stock), min: r.min >= 0 ? r.min : S.settings.minStockDefault, fav: r.fav, track: true, skt: r.skt, active: true, createdAt: now, updatedAt: now };
            if (p.barcode && S.byBarcode.has(p.barcode)) p.barcode = '';
            S.products.set(p.id, p); if (p.barcode) S.byBarcode.set(p.barcode, p.id);
            ops.push(putOp('products', p));
            if (p.stock) { const mv = { id: uid(), ts: now, pid: p.id, n: p.name, type: 'open', q: p.stock, note: 'Excel ile yüklendi' }; S.moves.push(mv); ops.push(putOp('moves', mv)); }
            nNew++;
          }
        }
        ops.push(putOp('meta', S.settings));
        persist(ops); emit('data');
        m.close(true);
        toast(`${plural(nNew, 'yeni ürün')} eklendi${nUpd ? `, ${plural(nUpd, 'ürün')} güncellendi` : ''}`);
      };
    }
  });
}

/* ============================================================
   Veresiye: müşteri listesi, hesap kartı, tahsilat, vade farkı,
   ekstre, WhatsApp
   ============================================================ */
const VS = { q: '', f: 'debt', sort: 'bal', period: 'all' };

function periodRange(key) {
  const t = todayKey();
  const d = fromKey(t);
  if (key === '30') return [addDays(t, -29), t];
  if (key === 'month') return [dayKey(new Date(d.getFullYear(), d.getMonth(), 1)), t];
  if (key === 'prev') { const a = new Date(d.getFullYear(), d.getMonth() - 1, 1); const b = new Date(d.getFullYear(), d.getMonth(), 0); return [dayKey(a), dayKey(b)]; }
  if (key === '90') return [addDays(t, -89), t];
  return ['0000-00-00', '9999-12-31'];
}
const PERIODS = [['all', 'Tüm hareketler'], ['30', 'Son 30 gün'], ['month', 'Bu ay'], ['prev', 'Geçen ay']];

function withRunning(entries) {
  let b = 0;
  return entries.map((e) => { if (!e.void) b = r2(b + e.amt); return { e, run: b }; });
}
function slicePeriod(rows, from, to) {
  let opening = 0;
  const out = [];
  for (const r of rows) {
    const k = dayKey(r.e.ts);
    if (k < from) opening = r.run;
    else if (k <= to) out.push(r);
  }
  return { opening, rows: out };
}
const custMatch = (c, q) => {
  const f = fold(q).trim(), dg = q.replace(/\D/g, '');
  return !f || fold(c.name).includes(f) || fold(c.title).includes(f) || (dg.length >= 3 && String(c.phone || '').replace(/\D/g, '').includes(dg));
};
const entryLabel = (e) => `${ENTRY_NAME[e.type] || e.type}${e.type === 'pay' && e.method ? ` (${(payName[e.method] || e.method).toLocaleLowerCase('tr')})` : ''}`;

PAGES.veresiye = {
  mount(el, params) {
    if (params && params[0]) return customerDetail(el, params[0]);
    const all = customerList();
    const debtors = all.filter((c) => c.bal > 0.004);
    const [mFrom] = periodRange('month');
    const inMonth = (e) => dayKey(e.ts) >= mFrom;
    const mSales = r2(sum(S.ledger.filter((e) => !e.void && e.type === 'sale' && inMonth(e)), (e) => e.amt));
    const mPay = r2(sum(S.ledger.filter((e) => !e.void && e.type === 'pay' && inMonth(e)), (e) => -e.amt));
    const mVade = r2(sum(S.ledger.filter((e) => !e.void && e.type === 'vade' && inMonth(e)), (e) => e.amt));
    const od = overdueCustomers();
    const odSet = new Set(od.map((c) => c.id));
    const ol = overLimitCustomers();
    const days = S.settings.vadeDays || 30;
    el.innerHTML = `<div class="page">
      <div class="page-head"><div><h1>Veresiye</h1><div class="sub">Müşteri borçları, ödemeler, vade farkı ve hesap dökümleri</div></div>
        <div class="actions"><button class="btn" data-a="vade">${ic('vade')} Vade farkı</button><button class="btn" data-a="pay">${ic('coins')} Tahsilat al</button><button class="btn primary" data-a="new">${ic('userplus')} Müşteri ekle</button></div></div>
      <div class="stats">
        <div class="stat hero"><div class="k">Toplam alacak</div><div class="v ${debtors.length ? 'red' : ''}">${money(receivableTotal())}</div><div class="d">${plural(debtors.length, 'müşteride')}</div></div>
        <div class="stat"><div class="k">Bu ay veresiye satış</div><div class="v">${money(mSales)}</div></div>
        <div class="stat"><div class="k">Bu ay tahsilat</div><div class="v">${money(mPay)}</div>${mVade ? `<div class="d">Vade farkı ${money(mVade)}</div>` : ''}</div>
        <div class="stat"><div class="k">Vadesi geçmiş borç</div><div class="v">${money(sum(od, (c) => c.overdue))}</div><div class="d">${od.length ? `${plural(od.length, 'müşteride')}, ${days} günden eski` : `${days} günden eski borç yok`}</div></div>
      </div>
      <div class="toolbar mt">
        <div class="inp-wrap grow">${ic('search', 'prefix-ic')}<input id="vs-q" class="inp has-ic" placeholder="Ad, ünvan ya da telefon ara" value="${esc(VS.q)}" autocomplete="off"></div>
        <div class="chips" id="vs-f"></div>
        <select class="inp" id="vs-sort" style="width:auto;margin-left:auto" aria-label="Sıralama"><option value="bal">Borca göre</option><option value="name">Ada göre</option><option value="title">Ünvana göre</option><option value="last">Son işleme göre</option></select>
      </div>
      <div class="panel" id="vs-list"></div>
    </div>`;
    $('#vs-sort', el).value = VS.sort;
    const draw = () => {
      let L = all.filter((c) => custMatch(c, VS.q));
      const cnt = { debt: L.filter((c) => c.bal > 0.004).length, all: L.length, staff: L.filter((c) => c.staff).length, over: L.filter((c) => ol.includes(c)).length, late: L.filter((c) => odSet.has(c.id)).length };
      if (VS.f === 'debt') L = L.filter((c) => c.bal > 0.004);
      if (VS.f === 'staff') L = L.filter((c) => c.staff);
      if (VS.f === 'over') L = L.filter((c) => ol.includes(c));
      if (VS.f === 'late') L = L.filter((c) => odSet.has(c.id));
      const byTitle = (a, b) => (a.title ? 0 : 1) - (b.title ? 0 : 1) || fold(a.title).localeCompare(fold(b.title), 'tr') || a.name.localeCompare(b.name, 'tr');
      L.sort(VS.sort === 'name' ? (a, b) => a.name.localeCompare(b.name, 'tr') : VS.sort === 'title' ? byTitle : VS.sort === 'last' ? (a, b) => (b.lastTs || 0) - (a.lastTs || 0) : (a, b) => b.bal - a.bal);
      $('#vs-f', el).innerHTML = [['debt', 'Borçlu', cnt.debt, ''], ['all', 'Tümü', cnt.all, ''], ['staff', 'Personel', cnt.staff, ''], ['over', 'Limiti aşan', cnt.over, 'bad'], ['late', 'Vadesi geçmiş', cnt.late, 'warn']]
        .filter(([k, , n]) => k === 'debt' || k === 'all' || n || VS.f === k).map(([k, l, n, c]) => `<button class="chip ${c} ${VS.f === k ? 'on' : ''}" data-f="${k}">${l} <span class="n">${n}</span></button>`).join('');
      const box = $('#vs-list', el);
      if (!all.length) { box.innerHTML = `<div class="empty">${ic('book')}<b>Veresiye defteri boş</b><p>Veresiye alan müşterilerinizi ünvanlarıyla ekleyin. Defterdeki eski borçlarını "Önceki borç" olarak girebilirsiniz.</p><button class="btn primary" data-a="new">${ic('userplus')} Müşteri ekle</button></div>`; return; }
      if (!L.length) { box.innerHTML = `<div class="empty">${ic('search')}<b>${VS.f === 'debt' && !VS.q.trim() ? 'Borçlu müşteri yok' : 'Eşleşen müşteri yok'}</b></div>`; return; }
      box.innerHTML = `<div class="list">${L.map((c) => {
        const over = c.limit > 0 && c.bal > c.limit;
        const late = odSet.has(c.id);
        return `<div class="list-row click" data-id="${c.id}">
          <span class="avatar">${esc(initials(c.name))}</span>
          <div class="grow"><div class="t1">${esc(c.name)}${c.title ? ` <span class="c-title">${esc(c.title)}</span>` : ''} ${c.staff ? '<span class="pill staff">Personel</span>' : ''} ${over ? '<span class="pill bad">limit aşıldı</span>' : ''} ${late ? '<span class="pill warn">vadesi geçti</span>' : ''}</div>
            <div class="t2">${c.phone ? esc(fmtPhone(c.phone)) + ', ' : ''}son işlem ${esc(agoText(c.lastTs))}${c.lastPayTs ? ', son ödeme ' + esc(agoText(c.lastPayTs)) : ''}${late ? `, vadesi geçmiş ${money(c.overdue)}` : ''}</div></div>
          ${c.limit > 0 ? `<div style="width:140px" title="Limit ${money(c.limit)}"><div class="meter ${over ? 'bad' : c.bal / c.limit > 0.8 ? 'warn' : ''}"><i style="width:${clamp(c.bal / c.limit * 100, 0, 100)}%"></i></div><div class="t2" style="margin-top:4px;text-align:right">limit ${money0(c.limit)}</div></div>` : ''}
          <div style="min-width:120px;text-align:right"><div class="amt ${c.bal > 0.004 ? 'red' : c.bal < -0.004 ? 'green' : ''}">${money(Math.abs(c.bal))}</div><div class="t2">${c.bal > 0.004 ? 'borçlu' : c.bal < -0.004 ? 'alacaklı' : 'hesap kapalı'}</div></div>
        </div>`;
      }).join('')}</div>`;
    };
    $('#vs-q', el).addEventListener('input', debounce((e) => { VS.q = e.target.value; draw(); }, 100));
    $('#vs-sort', el).onchange = (e) => { VS.sort = e.target.value; draw(); };
    el.addEventListener('click', (e) => {
      const f = e.target.closest('[data-f]'); if (f) { VS.f = f.dataset.f; draw(); return; }
      const a = e.target.closest('[data-a]');
      if (a) {
        if (a.dataset.a === 'new') openCustomerForm({}, { onSaved: (c) => go('veresiye/' + c.id) });
        if (a.dataset.a === 'pay') customerPicker('Tahsilat al', (c) => payModal(c.id));
        if (a.dataset.a === 'vade') vadeBulkModal();
        return;
      }
      const r = e.target.closest('[data-id]'); if (r) go('veresiye/' + r.dataset.id);
    });
    draw();
  }
};

function customerDetail(el, id) {
  const c = S.customers.get(id);
  if (!c) { el.innerHTML = `<div class="page"><a class="back-link" href="#/veresiye">${ic('back')} Veresiye</a><div class="empty">${ic('users')}<b>Müşteri bulunamadı</b></div></div>`; return; }
  const all = withRunning(customerEntries(id));
  const [from, to] = periodRange(VS.period);
  const { opening, rows } = slicePeriod(all, from, to);
  const pDebt = r2(sum(rows.filter((r) => !r.e.void && r.e.amt > 0), (r) => r.e.amt));
  const pPay = r2(sum(rows.filter((r) => !r.e.void && r.e.amt < 0), (r) => -r.e.amt));
  const over = c.limit > 0 && c.bal > c.limit;
  const ag = agingOf(c.id);
  const days = S.settings.vadeDays || 30;
  el.innerHTML = `<div class="page">
    <a class="back-link" href="#/veresiye">${ic('back')} Veresiye</a>
    <div class="panel">
      <div class="detail-head">
        <div class="detail-id"><span class="avatar lg">${esc(initials(c.name))}</span><div style="min-width:0"><h2>${esc(c.name)} ${c.staff ? '<span class="pill staff" style="vertical-align:middle">Personel</span>' : ''}</h2>
          ${c.title ? `<div class="c-title lg">${esc(c.title)}</div>` : ''}
          <div class="t2">${c.phone ? `<span>${ic('phone', 'sm')} ${esc(fmtPhone(c.phone))}</span>` : '<span>Telefon eklenmemiş</span>'}<span>Kayıt ${fmtDate(c.createdAt)}</span>${c.note ? `<span>${esc(c.note)}</span>` : ''}${c.noVade ? '<span>Vade farkı uygulanmıyor</span>' : ''}</div></div></div>
        <div class="balance"><div class="k">${c.bal < -0.004 ? 'Alacaklı (fazla ödeme)' : 'Güncel borç'}</div><div class="v ${c.bal > 0.004 ? 'debt' : 'clear'}">${money(Math.abs(c.bal))}</div>
          ${ag.overdue > 0.004 ? `<div class="amber" style="font-size:13px;font-weight:600;margin-top:2px">${money(ag.overdue)} vadesi geçmiş (${days} günden eski)</div>` : ''}
          ${c.limit > 0 ? `<div style="margin-top:6px;width:220px;margin-left:auto"><div class="meter ${over ? 'bad' : c.bal / c.limit > 0.8 ? 'warn' : ''}"><i style="width:${clamp(c.bal / c.limit * 100, 0, 100)}%"></i></div><div class="muted" style="font-size:12.5px;margin-top:4px">${over ? `<span class="red">Limit ${money(c.bal - c.limit)} aşıldı</span>` : `Limit ${money(c.limit)}, kalan ${money(c.limit - c.bal)}`}</div></div>` : ''}
        </div>
      </div>
      <div class="detail-actions">
        <button class="btn green" data-a="pay">${ic('coins')} Tahsilat al</button>
        <button class="btn" data-a="debt">${ic('plus')} Borç ekle</button>
        <button class="btn" data-a="vade">${ic('vade')} Vade farkı</button>
        <button class="btn" data-a="print">${ic('print')} Ekstre yazdır</button>
        <button class="btn" data-a="wa">${ic('chat')} WhatsApp'tan gönder</button>
        <button class="btn ghost" data-a="edit">${ic('edit')} Düzenle</button>
      </div>
    </div>
    <div class="toolbar mt"><div class="chips">${PERIODS.map(([k, l]) => `<button class="chip ${VS.period === k ? 'on' : ''}" data-p="${k}">${l}</button>`).join('')}</div>
      <span class="muted" style="margin-left:auto;font-size:13.5px">Dönemde borç <b class="red">${money(pDebt)}</b>, ödeme <b class="green">${money(pPay)}</b></span></div>
    <div class="panel flush">${rows.length || opening ? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th class="w1">Tarih</th><th>İşlem</th><th class="r">Borç</th><th class="r">Ödeme</th><th class="r">Bakiye</th><th class="w1"></th></tr></thead><tbody>
      ${VS.period !== 'all' ? `<tr><td class="w1 muted">${fmtDate(fromKey(from))}</td><td class="ink2">Dönem başı bakiye</td><td></td><td></td><td class="r strong">${money(opening)}</td><td></td></tr>` : ''}
      ${rows.slice().reverse().map(({ e, run }) => `<tr class="${e.void ? 'void' : ''}">
        <td class="w1 nowrap tnum">${fmtDT(e.ts)}</td>
        <td><span class="strike">${esc(entryLabel(e))}</span>${e.type === 'vade' ? ' <span class="pill warn">vade</span>' : ''}${e.void ? ' <span class="pill bad">iptal</span>' : ''}${e.note ? `<span class="sub-t">${esc(e.note)}</span>` : ''}</td>
        <td class="r amt-debt"><span class="strike">${e.amt > 0 ? money(e.amt) : ''}</span></td>
        <td class="r amt-pay"><span class="strike">${e.amt < 0 ? money(-e.amt) : ''}</span></td>
        <td class="r strong">${e.void ? '' : money(run)}</td>
        <td class="w1">${e.void ? '' : e.type === 'sale' ? `<button class="btn ghost sm" data-sale="${e.ref}">Fişi gör</button>` : `<button class="icon-btn sm danger" data-void="${e.id}" title="Bu kaydı iptal et" aria-label="İptal et">${ic('x', 'sm')}</button>`}</td></tr>`).join('')}
      </tbody></table></div>` : `<div class="empty">${ic('book')}<b>Bu dönemde hareket yok</b><p>Kasada "Veresiye" ile yapılan satışlar ve aldığınız ödemeler burada listelenir.</p></div>`}</div>
  </div>`;
  el.addEventListener('click', async (e) => {
    const p = e.target.closest('[data-p]'); if (p) { VS.period = p.dataset.p; rerender(); return; }
    const sl = e.target.closest('[data-sale]'); if (sl) { saleDetailModal(sl.dataset.sale); return; }
    const v = e.target.closest('[data-void]');
    if (v) {
      const en = S.ledger.find((x) => x.id === v.dataset.void);
      if (!en) return;
      const ok = await confirmBox({ title: 'Kayıt iptal edilsin mi?', message: `${esc(ENTRY_NAME[en.type])}, ${money(Math.abs(en.amt))} (${fmtDT(en.ts)}). Bakiye buna göre yeniden hesaplanır.`, ok: 'İptal et', danger: true });
      if (ok && voidLedger(en.id)) toast('Kayıt iptal edildi');
      return;
    }
    const a = e.target.closest('[data-a]');
    if (!a) return;
    if (a.dataset.a === 'pay') payModal(c.id);
    if (a.dataset.a === 'debt') debtModal(c.id);
    if (a.dataset.a === 'vade') vadeModal(c.id);
    if (a.dataset.a === 'edit') openCustomerForm(c);
    if (a.dataset.a === 'print') statementModal(c);
    if (a.dataset.a === 'wa') whatsappModal(c);
  });
}

/* ---------- Müşteri kartı ---------- */
function openCustomerForm(data, opts = {}) {
  const isNew = !data || !data.id;
  const c = Object.assign({ name: '', title: '', phone: '', limit: 0, note: '', staff: false, noVade: false }, data || {});
  const sw = (id, on, title, desc) => `<label class="switch"><input type="checkbox" id="${id}" ${on ? 'checked' : ''}><span class="track"></span><span class="st"><b>${title}</b><small>${desc}</small></span></label>`;
  openModal({
    title: isNew ? 'Yeni veresiye müşterisi' : 'Müşteriyi düzenle', size: 'md',
    body: `<div class="form">
      <div class="row2">
        <div class="field"><label for="cf-n">Ad soyad<span class="req">*</span></label><input class="inp" id="cf-n" value="${esc(c.name)}" maxlength="60" placeholder="Örn. Ahmet Yılmaz" autofocus><span class="hint red" id="cf-e"></span></div>
        <div class="field"><label for="cf-t">Ünvan</label><input class="inp" id="cf-t" value="${esc(c.title)}" maxlength="60" list="cf-titles" placeholder="Örn. Güvenlik Şefi, Yer Hizmetleri" autocomplete="off"><datalist id="cf-titles">${titlesList().map((t) => `<option value="${esc(t)}">`).join('')}</datalist><span class="hint">Görevi, birimi ya da çalıştığı firma</span></div>
      </div>
      <div class="row2">
        <div class="field"><label for="cf-p">Telefon</label><input class="inp" id="cf-p" value="${esc(c.phone)}" inputmode="tel" placeholder="05xx xxx xx xx" maxlength="20"><span class="hint">WhatsApp ekstresi için gerekli</span></div>
        <div class="field"><label for="cf-l">Borç limiti</label><div class="inp-wrap"><input class="inp num" id="cf-l" inputmode="decimal" value="${c.limit ? moneyIn(c.limit) : ''}" placeholder="Limitsiz"><span class="suffix">₺</span></div><span class="hint">Aşılınca kasada uyarır</span></div>
      </div>
      ${isNew ? `<div class="field"><label for="cf-o">Önceki borç (defterden devir)</label><div class="inp-wrap"><input class="inp num" id="cf-o" inputmode="decimal" placeholder="0,00"><span class="suffix">₺</span></div><span class="hint">Eski veresiye defterinde kalan borcu varsa yazın.</span></div>` : ''}
      <div class="field"><label for="cf-x">Not</label><input class="inp" id="cf-x" value="${esc(c.note)}" maxlength="120" placeholder="Örn. Ayın 15'inde maaşla öder"></div>
      <div class="panel" style="padding:4px 16px"><div class="divide">
        <div style="padding:12px 0">${sw('cf-staff', c.staff, 'Havalimanı personeli', 'Veresiyeye yazarken personel fiyatı önerilir.')}</div>
        <div style="padding:12px 0">${sw('cf-novade', c.noVade, 'Vade farkı uygulanmasın', 'Toplu vade farkı eklerken bu müşteri atlanır.')}</div>
      </div></div>
    </div>`,
    foot: `${isNew ? '' : `<div class="left"><button class="btn danger" id="cf-del">${ic('trash')} Müşteriyi sil</button></div>`}<button class="btn" data-close>Vazgeç</button><button class="btn primary" data-enter id="cf-ok">${ic('check')} Kaydet</button>`,
    onMount(el, m) {
      const del = $('#cf-del', el);
      if (del) del.onclick = async () => {
        const cc = S.customers.get(c.id);
        if (Math.abs(cc.bal) > 0.004) { toast(`Silmek için önce hesabın kapanması gerekiyor (bakiye ${money(cc.bal)}).`, { type: 'warn', ms: 5000 }); return; }
        if (!(await confirmBox({ title: 'Müşteri silinsin mi?', message: `${esc(cc.name)} listeden kaldırılır. Geçmiş kayıtları raporlarda korunur.`, ok: 'Sil', danger: true }))) return;
        archiveCustomer(cc.id); m.close(true); toast(`${cc.name} silindi`); go('veresiye');
      };
      $('#cf-ok', el).onclick = () => {
        const name = capWords($('#cf-n', el).value);
        if (!name) { $('#cf-e', el).textContent = 'Ad soyad yazın.'; $('#cf-n', el).classList.add('err'); return; }
        const dup = customerList().find((x) => x.id !== c.id && fold(x.name) === fold(name));
        if (dup && isNew && !m._dupOk) { $('#cf-e', el).textContent = `"${dup.name}" adında bir müşteri zaten var. Yine de eklemek için tekrar Kaydet'e basın.`; m._dupOk = true; return; }
        let title = capWords($('#cf-t', el).value);
        const exT = titlesList().find((t) => fold(t) === fold(title));
        if (exT) title = exT;
        const out = { name, title, phone: $('#cf-p', el).value.trim(), limit: Math.max(0, parseNum($('#cf-l', el).value) || 0), note: $('#cf-x', el).value.trim(), staff: $('#cf-staff', el).checked, noVade: $('#cf-novade', el).checked };
        if (!isNew) out.id = c.id;
        const opening = isNew ? (parseNum($('#cf-o', el).value) || 0) : 0;
        const saved = upsertCustomer(out, opening);
        m.close(true);
        toast(isNew ? `${saved.name} veresiye defterine eklendi` : 'Müşteri bilgileri güncellendi');
        if (opts.onSaved) opts.onSaved(saved);
      };
    }
  });
}

function customerPicker(title, onPick) {
  let q = '', idx = 0;
  let M = null;
  const list = () => customerList().filter((c) => custMatch(c, q)).sort((a, b) => b.bal - a.bal);
  const draw = () => {
    const L = list();
    idx = clamp(idx, 0, Math.max(0, L.length - 1));
    $('#cp-l', M.el).innerHTML = L.length ? L.slice(0, 150).map((c, i) => `<div class="list-row click ${i === idx ? 'sel' : ''}" data-id="${c.id}"><span class="avatar">${esc(initials(c.name))}</span><div class="grow"><div class="t1">${esc(c.name)}${c.staff ? ' <span class="pill staff">Personel</span>' : ''}</div><div class="t2">${c.title ? esc(c.title) + ', ' : ''}${esc(fmtPhone(c.phone) || 'telefon yok')}</div></div><div class="amt ${c.bal > 0.004 ? 'red' : ''}">${money(c.bal)}</div></div>`).join('')
      : `<div class="empty" style="padding:22px">${ic('users')}<b>Müşteri bulunamadı</b></div>`;
  };
  M = openModal({
    title, size: 'md',
    body: `<div class="inp-wrap">${ic('search', 'prefix-ic')}<input class="inp has-ic" id="cp-q" placeholder="Ad, ünvan ya da telefon ara" autocomplete="off" autofocus></div><div class="picker-list mt-s" id="cp-l"></div>`,
    onMount(el, m) {
      $('#cp-q', el).addEventListener('input', (e) => { q = e.target.value; idx = 0; draw(); });
      $('#cp-l', el).addEventListener('click', (e) => { const r = e.target.closest('[data-id]'); if (r) { m.close(true); onPick(S.customers.get(r.dataset.id)); } });
    },
    onKey(e) {
      if (topModal() !== M) return false;
      const L = list();
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); idx = clamp(idx + (e.key === 'ArrowDown' ? 1 : -1), 0, Math.max(0, L.length - 1)); draw(); const r = M.el.querySelector('.list-row.sel'); if (r) r.scrollIntoView({ block: 'nearest' }); return true; }
      if (e.key === 'Enter' && L[idx]) { e.preventDefault(); M.close(true); onPick(L[idx]); return true; }
      return false;
    }
  });
  draw();
}

/* ---------- Tahsilat / borç ---------- */
function payModal(cid) {
  const c = S.customers.get(cid);
  if (!c) return;
  let method = 'nakit';
  openModal({
    title: 'Tahsilat al', size: 'sm', sub: esc(c.name) + (c.title ? `, ${esc(c.title)}` : ''),
    body: `<div class="sum-line"><span class="muted strong">Güncel borç</span><span class="big-amt ${c.bal > 0 ? 'red' : ''}" style="font-size:30px">${money(c.bal)}</span></div>
      <div class="field mt"><label for="py-a">Alınan tutar</label><div class="inp-wrap"><input class="inp num" id="py-a" inputmode="decimal" placeholder="0,00" autofocus style="height:50px;font-size:22px"><span class="suffix">₺</span></div><span class="hint red" id="py-e"></span></div>

/* ---------- Vade farkı ---------- */
function vadeModal(cid) {
  const c = S.customers.get(cid);
  if (!c) return;
  const sg = vadeSuggestion(c);
  const days = S.settings.vadeDays || 30;
  let amtTouched = false;
  openModal({
    title: 'Vade farkı ekle', size: 'sm', sub: esc(c.name) + (c.title ? `, ${esc(c.title)}` : ''),
    body: `<div class="note ${sg.base > 0.004 ? 'info' : ''}">${sg.base > 0.004 ? `Vadesi geçmiş borç (${days} günden eski): <b>${money(sg.base)}</b>` : `Bu müşterinin ${days} günden eski ödenmemiş borcu yok. Yine de tutar yazarak vade farkı ekleyebilirsiniz.`}${c.lastVadeTs ? `<br>Son vade farkı: ${fmtDate(c.lastVadeTs)} (${esc(agoText(c.lastVadeTs))})` : ''}${c.noVade ? '<br>Bu müşteri için "vade farkı uygulanmasın" seçili.' : ''}</div>
      <div class="row2 mt">
        <div class="field"><label for="vd-r">Aylık oran (%)</label><input class="inp num" id="vd-r" inputmode="decimal" value="${sg.rate ? NFQ.format(sg.rate) : ''}" placeholder="Örn. 3"></div>
        <div class="field"><label for="vd-a">Vade farkı</label><div class="inp-wrap"><input class="inp num" id="vd-a" inputmode="decimal" value="${sg.amount > 0 ? moneyIn(sg.amount) : ''}" placeholder="0,00"><span class="suffix">₺</span></div><span class="hint red" id="vd-e"></span></div>
      </div>
      <div class="row2 mt">
        <div class="field"><label for="vd-d">Tarih</label><input class="inp" type="date" id="vd-d" value="${todayKey()}" max="${todayKey()}"></div>
        <div class="field"><label for="vd-n">Açıklama</label><input class="inp" id="vd-n" placeholder="Boşsa oranla yazılır" maxlength="100"></div>
      </div>
      <div class="note mt" id="vd-x"></div>`,
    foot: `<button class="btn" data-close>Vazgeç</button><button class="btn primary" data-enter id="vd-ok">${ic('vade')} Vade farkını ekle</button>`,
    onMount(el, m) {
      const r = $('#vd-r', el), a = $('#vd-a', el);
      const upd = () => {
        const rate = parseNum(r.value) || 0;
        if (!amtTouched && sg.base > 0) a.value = rate > 0 ? moneyIn(r2(sg.base * rate / 100)) : '';
        const v = parseNum(a.value) || 0;
        $('#vd-x', el).innerHTML = v > 0 ? `Borç ${money(c.bal)} → <b>${money(c.bal + v)}</b> olacak.` : 'Oranı ya da tutarı yazın.';
      };
      r.addEventListener('input', upd);
      a.addEventListener('input', () => { amtTouched = true; upd(); });
      $('#vd-ok', el).onclick = () => {
        const v = parseNum(a.value);
        if (!(v > 0)) { $('#vd-e', el).textContent = 'Tutarı yazın.'; a.classList.add('err'); return; }
        const rate = parseNum(r.value) || 0;
        customerVade(c.id, v, { note: $('#vd-n', el).value.trim(), ts: tsFromInputDate($('#vd-d', el).value), rate: amtTouched && sg.base > 0 && Math.abs(r2(sg.base * rate / 100) - v) > 0.01 ? 0 : rate, base: sg.base });
        m.close(true);
        toast(`${c.name} hesabına ${money(v)} vade farkı eklendi`);
      };
      upd();
    }
  });
}
function vadeBulkModal() {
  const days = S.settings.vadeDays || 30;
  const now = Date.now();
  const month = 30 * 864e5;
  const rows = customerList().filter((c) => c.bal > 0.004).map((c) => ({ c, ag: agingOf(c.id) })).filter((x) => x.ag.base > 0.004).sort((a, b) => b.ag.base - a.ag.base);
  const exempt = rows.filter((x) => x.c.noVade);
  const recent = rows.filter((x) => !x.c.noVade && x.c.lastVadeTs && now - x.c.lastVadeTs < month);
  const elig = rows.filter((x) => !x.c.noVade && !(x.c.lastVadeTs && now - x.c.lastVadeTs < month));
  const st = { rate: S.settings.vadeRate || 0, on: new Set(elig.map((x) => x.c.id)), amt: {}, touched: new Set() };
  const calc = (x) => (st.touched.has(x.c.id) ? st.amt[x.c.id] : r2(x.ag.base * st.rate / 100));
  openModal({
    title: 'Vade farkı uygula', size: 'lg',
    sub: `${days} günden uzun süredir ödenmemiş borçlara aylık oranla vade farkı ekleyin. Son 30 günde vade farkı eklenen müşteriler listelenmez.`,
    body: `<div class="row3">
        <div class="field"><label for="vb-r">Aylık oran (%)</label><input class="inp num" id="vb-r" inputmode="decimal" value="${st.rate ? NFQ.format(st.rate) : ''}" placeholder="Örn. 3" autofocus></div>
        <div class="field"><label>&nbsp;</label><label class="switch" style="height:40px;align-items:center"><input type="checkbox" id="vb-save" ${st.rate ? '' : 'checked'}><span class="track" style="margin-top:0"></span><span class="st"><b style="font-size:13.5px">Varsayılan oran olarak kaydet</b></span></label></div>
        <div></div>
      </div>
      <div id="vb-list" class="mt"></div>
      ${exempt.length || recent.length ? `<p class="muted mt-s" style="font-size:13px">${recent.length ? `${plural(recent.length, 'müşteriye')} son 30 günde vade farkı eklendiği için listede yok. ` : ''}${exempt.length ? `${plural(exempt.length, 'müşteri')} "vade farkı uygulanmasın" olarak işaretli.` : ''}</p>` : ''}`,
    foot: `<div class="left"><span class="muted" id="vb-tot"></span></div><button class="btn" data-close>Vazgeç</button><button class="btn primary" id="vb-ok" disabled>Vade farkı ekle</button>`,
    onMount(el, m) {
      const draw = () => {
        const box = $('#vb-list', el);
        if (!elig.length) {
          box.innerHTML = `<div class="empty" style="padding:26px">${ic('check')}<b>Vade farkı eklenecek müşteri yok</b><p>${days} günden eski ödenmemiş borcu olan müşteri bulunmuyor.</p></div>`;
          $('#vb-ok', el).disabled = true; $('#vb-tot', el).textContent = ''; return;
        }
        box.innerHTML = `<div class="panel flush"><div class="tbl-wrap" style="max-height:340px"><table class="tbl"><thead><tr><th class="w1"></th><th>Müşteri</th><th class="r">Toplam borç</th><th class="r">Vadesi geçmiş</th><th class="r" style="width:150px">Vade farkı</th></tr></thead><tbody>
          ${elig.map((x) => `<tr><td class="w1"><input type="checkbox" data-on="${x.c.id}" ${st.on.has(x.c.id) ? 'checked' : ''} aria-label="Seç"></td>
            <td><span class="nm">${esc(x.c.name)}</span>${x.c.title ? `<span class="sub-t">${esc(x.c.title)}</span>` : ''}</td>
            <td class="r">${money(x.c.bal)}</td><td class="r">${money(x.ag.base)}<span class="sub-t">en eski ${fmtDate(x.ag.oldest)}</span></td>
            <td class="r"><div class="inp-wrap"><input class="inp num" data-amt="${x.c.id}" value="${calc(x) > 0 ? moneyIn(calc(x)) : ''}" inputmode="decimal" placeholder="0,00" style="height:34px"><span class="suffix">₺</span></div></td></tr>`).join('')}
          </tbody></table></div></div>`;
        foot();
      };
      const foot = () => {
        const sel = elig.filter((x) => st.on.has(x.c.id) && calc(x) > 0);
        const tot = r2(sum(sel, calc));
        $('#vb-tot', el).textContent = sel.length ? `${plural(sel.length, 'müşteri')}, toplam ${money(tot)}` : '';
        $('#vb-ok', el).disabled = !sel.length;
        $('#vb-ok', el).textContent = sel.length ? `${plural(sel.length, 'müşteriye')} vade farkı ekle` : 'Vade farkı ekle';
      };
      $('#vb-r', el).addEventListener('input', (e) => {
        st.rate = parseNum(e.target.value) || 0;
        elig.forEach((x) => { if (!st.touched.has(x.c.id)) { const i = el.querySelector(`[data-amt="${x.c.id}"]`); if (i) i.value = calc(x) > 0 ? moneyIn(calc(x)) : ''; } });
        foot();
      });
      el.addEventListener('input', (e) => {
        const id = e.target.dataset && e.target.dataset.amt; if (!id) return;
        st.touched.add(id); st.amt[id] = r2(parseNum(e.target.value) || 0); foot();
      });
      el.addEventListener('change', (e) => {
        const id = e.target.dataset && e.target.dataset.on; if (!id) return;
        e.target.checked ? st.on.add(id) : st.on.delete(id); foot();
      });
      $('#vb-ok', el).onclick = () => {
        const sel = elig.filter((x) => st.on.has(x.c.id) && calc(x) > 0);
        if (!sel.length) return;
        const ops = [];
        const ts = Date.now();
        sel.forEach((x) => customerVade(x.c.id, calc(x), { ts, rate: st.touched.has(x.c.id) ? 0 : st.rate, base: x.ag.base }, { ops }));
        if ($('#vb-save', el).checked && st.rate > 0) { S.settings.vadeRate = st.rate; ops.push(putOp('meta', S.settings)); }
        persist(ops); emit('data');
        m.close(true);
        toast(`${plural(sel.length, 'müşteriye')} toplam ${money(sum(sel, calc))} vade farkı eklendi`);
      };
      draw();
    }
  });
}

function docHeader(title, sub) {
  const s = S.settings;
  return `<div class="doc-head"><div class="doc-biz">${s.logo ? `<img src="${esc(s.logo)}" alt="">` : logoMark(s.bizName).replace('width="100%" height="100%"', 'width="48" height="48"')}<div><h1>${esc(s.bizName || APP.name)}</h1>${s.address ? `<p>${esc(s.address)}</p>` : ''}${s.phone ? `<p>Tel: ${esc(fmtPhone(s.phone))}</p>` : ''}</div></div>
    <div class="doc-title"><h2>${esc(title)}</h2><p>${esc(sub || '')}</p><p>Düzenlenme: ${fmtDT(Date.now())}</p></div></div>`;
}
function printStatement(c, per) {
  const all = withRunning(customerEntries(c.id));
  const [from, to] = periodRange(per);
  const { opening, rows } = slicePeriod(all, from, to);
  const live = rows.filter((r) => !r.e.void);
  const debt = r2(sum(live.filter((r) => r.e.amt > 0), (r) => r.e.amt));
  const pay = r2(sum(live.filter((r) => r.e.amt < 0), (r) => -r.e.amt));
  const perLabel = per === 'all' ? 'Tüm hareketler' : `${fmtDate(fromKey(from))} – ${fmtDate(fromKey(to))}`;
  const ag = agingOf(c.id);
  const html = `<div class="doc">
    ${docHeader('HESAP EKSTRESİ', perLabel)}
    <div class="doc-meta"><div><small style="color:#555">Müşteri</small><br><b>${esc(c.name)}</b>${c.title ? `<br>${esc(c.title)}` : ''}${c.phone ? `<br>${esc(fmtPhone(c.phone))}` : ''}</div>
      <div class="doc-box"><small>Güncel bakiye</small><strong>${money(c.bal)}</strong><small>${c.bal > 0.004 ? 'borç' : c.bal < -0.004 ? 'alacak' : 'hesap kapalı'}${ag.overdue > 0.004 ? `, ${money(ag.overdue)} vadesi geçmiş` : ''}</small></div></div>
    <table><thead><tr><th>Tarih</th><th>İşlem</th><th class="r">Borç</th><th class="r">Ödeme</th><th class="r">Bakiye</th></tr></thead><tbody>
      ${per !== 'all' ? `<tr><td>${fmtDate(fromKey(from))}</td><td>Dönem başı bakiye</td><td></td><td></td><td class="r">${money(opening)}</td></tr>` : ''}
      ${rows.map(({ e, run }) => `<tr class="${e.void ? 'void' : ''}"><td>${fmtDT(e.ts)}</td><td>${esc(entryLabel(e))}${e.note ? `<br><span style="color:#555">${esc(e.note)}</span>` : ''}${e.void ? ' (iptal)' : ''}</td><td class="r">${e.amt > 0 ? money(e.amt) : ''}</td><td class="r">${e.amt < 0 ? money(-e.amt) : ''}</td><td class="r">${e.void ? '' : money(run)}</td></tr>`).join('') || '<tr><td colspan="5" style="color:#666">Bu dönemde hareket yok.</td></tr>'}
    </tbody><tfoot><tr><td colspan="2">Dönem toplamı</td><td class="r">${money(debt)}</td><td class="r">${money(pay)}</td><td class="r">${money(per === 'all' ? c.bal : r2(opening + debt - pay))}</td></tr></tfoot></table>
    <div class="doc-foot"><span>${esc(S.settings.stmtNote || '')}</span><span>${esc(S.settings.bizName || '')}</span></div>
    <div class="doc-sign"><div>İşletme</div><div>Müşteri</div></div>
  </div>`;
  printHTML(html);
}
function printHTML(html) {
  const pa = $('#print-area');
  pa.innerHTML = html;
  document.body.classList.add('printing');
  const done = () => { document.body.classList.remove('printing'); pa.innerHTML = ''; };
  window.addEventListener('afterprint', done, { once: true });
  setTimeout(() => { window.print(); setTimeout(() => { if (document.body.classList.contains('printing')) done(); }, 1500); }, 60);
}

function openExternal(url) {
